[package]
name = "twilight-realm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Twilight's Eve's Local Realm: the game rules behind the client's command/event seam, free of Bevy"

[lints]
workspace = true

[dependencies]
benilla-protocol = { path = "../benilla-protocol" }
# The character save's versioned TOML (the app already ships `toml`; it keeps `serde_json` out).
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# tests/content.rs checks the generated `content/` tables against the JSON dumps they come from.
[dev-dependencies]
serde_json = "1"
# examples/gen_outfits.rs reads CharStartOutfit.dbc out of the game's MPQs.
benilla-formats = { path = "../benilla-formats", default-features = false }
