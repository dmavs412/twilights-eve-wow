# The Writ Board (spec #557, docs/specs/writs/README.md): the Writs Stormwind posts, read after
# content/quests_elwynn.toml with the same `[[quest]]` and `[[gameobject]]` schema.
#
# A Writ is `kind = "writ"`. It names `levels`, 1 to 2: the levels a character of the Tier it is
# offered from gains from its hand-in. Its `giver_object` is the board, and its `zone_or_sort`
# names its pool: Elwynn 12, Redridge 44, Duskwood 10. Each pool shows one Writ per window, never
# the one it showed in the window before; a pool of one shows its Writ every window. A Writ's band
# is its rank by level within its pool (low, mid, high). A character can do each showing once, and
# a Writ in the log stays there when the board changes.
#
# `[board]`: window 0 starts at `anchor`'s midnight UTC, and a window lasts `window_days`. Each
# `apart` pair names two pools by zone: the second's draw also skips the band the first drew in
# that window. The draw is a pure function of the window (`src/writs.rs`), so nothing is saved.

[board]
anchor = "2026-11-02"   # window 0 starts at this date's midnight UTC
window_days = 2
apart = [[44, 10]]      # Duskwood's (10) draw skips the band Redridge (44) drew

# The Writ Board in the Trade District (#574). Display 3053 is the stock Alliance wanted board, a
# placeholder (docs/art-assets.md, Writs). It stands on the street floor of the city model (group
# 277), where a City Patroller spawns (vmangos guid 79792).
[[gameobject]]
guid = 791001
entry = 980201
display = 3053
map = 0
position = [-8821.0, 663.0, 95.42]
orientation = 0.0
respawn = 60.0

# ── The seven Writs (#574) ───────────────────────────────────────────────────────────────────────
#
# Watch Officer Harlan Pike (mobs.toml, 96047) reads each one out and takes it back, whoever
# issued it: the City Watch, the House of Nobles or Lady Prestor's office. Money is
# 140 x levels x level copper. A sweep is two family lines; the named creatures are kill lines of
# one. Burning Steppes' three wait for the spec that brings in that zone's mobs.

# Elwynn (12), level 24, from the City Watch.
[[quest]]
id = 95001
kind = "writ"
giver_object = 980201
ender = 96047
zone_or_sort = 12
level = 24
levels = 1.5
title = "Writ of the Watch: Eastern Elwynn"
objectives = "Slay 50 prowlers and forest bears and 50 Defias in Elwynn Forest, and kill Dead-Tooth Jack and Thuros Lightfingers. Then return to Watch Officer Harlan Pike at the Writ Board."
details = "A writ of the City Watch, for Elwynn. Fifty prowlers and forest bears, fifty Defias, and the two names at the bottom. That's what it says. It doesn't say that the Watch kept a patrol on the Eastvale road until spring. Then the harbour wanted men to wait for the ships, and the walls wanted men, and the road got nobody. Now the farms out east bar their doors at sundown. Dead-Tooth Jack runs the Defias in the woods below Ridgepoint. Thuros Lightfingers works the roads and never sleeps in the same place twice. Bring them both down."
progress = "The writ's still open, is it? The Watch pays when the work's done, not before."
completion = "Jack and Lightfingers both. I'll have their names struck off the board. Here's the Watch's money, every copper of it. It's more than they'd pay a soldier, but then they haven't got any soldiers to pay."
money = 5040
kill = [
  { family = "Prowlers and forest bears slain", entries = [118, 822], count = 50 },
  { family = "Defias slain", entries = [116, 474], count = 50 },
  [6093, 1],
  [61, 1],
]

