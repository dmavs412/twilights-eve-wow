# ── The seven Writs (#574) ───────────────────────────────────────────────────────────────────────
#
# Watch Officer Harlan Pike (mobs.toml, 96047) reads each one out and takes it back, whoever
# issued it: the City Watch, the House of Nobles or Lady Prestor's office. Money is
# 140 x levels x level copper. A sweep is two family lines; the named creatures are kill lines of
# one. Burning Steppes' three are on the Blackrock Pass board, at the end of this file (#632).

# Elwynn (12), level 24, from the City Watch.
[[quest]]
id = 95001
kind = "writ"
giver_object = 980201
ender = 96047
zone_or_sort = 12
level = 24
levels = 1.5
title = "Writ of the Watch: Eastern Elwynn"
objectives = "Slay 50 prowlers and forest bears and 50 Defias in Elwynn Forest, and kill Dead-Tooth Jack and Thuros Lightfingers. Then return to Watch Officer Harlan Pike at the Writ Board."
details = "A writ of the City Watch, for Elwynn. Fifty prowlers and forest bears, fifty Defias, and the two names at the bottom. That's what it says. It doesn't say that the Watch kept a patrol on the Eastvale road until spring. Then the harbour wanted men to wait for the ships, and the walls wanted men, and the road got nobody. Now the farms out east bar their doors at sundown. Dead-Tooth Jack runs the Defias in the woods below Ridgepoint. Thuros Lightfingers works the roads and never sleeps in the same place twice. Bring them both down."
progress = "The writ's still open, is it? The Watch pays when the work's done, not before."
completion = "Jack and Lightfingers both. I'll have their names struck off the board. Here's the Watch's money, every copper of it. It's more than they'd pay a soldier, but then they haven't got any soldiers to pay."
money = 5040
kill = [
  { family = "Prowlers and forest bears slain", entries = [118, 822], count = 50 },
  { family = "Defias slain", entries = [116, 474], count = 50 },
  [6093, 1],
  [61, 1],
]

# Redridge (44), low band, level 33, from the House of Nobles.
