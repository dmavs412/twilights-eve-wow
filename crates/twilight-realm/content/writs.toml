title = "Writ of the Nobles: Lakeshire's Fields"
objectives = "Slay 60 Redridge gnolls and 40 Lakeshire murlocs in the Redridge Mountains, and kill Ribchaser and Squiddic. Then return to Watch Officer Harlan Pike at the Writ Board."
details = "This one's from the House of Nobles. Good paper, a wax seal, and a page of writing that says what I could say in three lines. The lords who own the fields around Lakeshire want the gnolls off their land and the murlocs off their shore. Sixty gnolls and forty murlocs. They name two more. Ribchaser leads the gnolls that raid the farms, and Squiddic leads the murlocs along the lake. The lords would rather pay a writ than a garrison. A writ costs less, and it goes home when it's done."
progress = "The lords will want to hear their fields are clear. Are they?"
completion = "Ribchaser and Squiddic. I'll send word up to the House. Some lord's steward will be glad to read it. The fee is yours. They paid it in advance, which tells you how worried they were."
money = 4620
kill = [
  { family = "Redridge gnolls slain", entries = [423, 424, 426, 430], count = 60 },
  { family = "Lakeshire murlocs slain", entries = [1083, 548, 422], count = 40 },
  [14271, 1],
  [14270, 1],
]

