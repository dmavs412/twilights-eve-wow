# Hand-written changes laid over the generated content/duskwood.toml, redridge.toml,
# stormwind.toml (spec #466) and burning_steppes.toml (#634), which are never edited. One [[zone]]
# per file.
# `levels` is the zone's Level Stretch: every spawn but friendly NPCs and critters has its vanilla
# levels mapped linearly from `from` onto `to`, rounded and clamped into `to`. It is the fallback
# for spawns outside the `bounds` of the zone's band file (redridge_bands.toml, duskwood_bands.toml,
# burning_steppes_bands.toml) and inside its `exclude` boxes; Stormwind has no band file.
# A `[[zone.added]]` row places a creature by hand, in the shape of elwynn_overrides.toml's
# `[[added]]`: a camp of its own at its own levels, past the Level Stretch. Its optional
# `after_milestone` and `until_milestone` each name a row of content/milestones.toml (ADR 0034):
# the creature is not brought in until the first is reached, and leaves for good, alive or dead,
# once the second is.
# A `[[zone.rolls]]` row sets the `rolls` of the template with its `entry`, as the `rolls` key does
# on a mobs.toml template, wherever that template comes from: a generated zone file or mobs.toml.
# It is a content error when the template already has rolls or another row names the entry, so
# every 31-50 elite roll sits here. Ticket 08 of spec #650 fills it.

[[zone]]
file = "duskwood"
# Unseen (3094): 28 level-49 spawns, invisible in vanilla (aura 4986). The realm does not model
# invisibility.
removed = [3094]
# The open-world creatures inside the lore bible's Phased Dungeons, deleted (2026-10-27,
# Davis's call); phased.rs's lore_bible_dungeons test keeps the footprints clear.
