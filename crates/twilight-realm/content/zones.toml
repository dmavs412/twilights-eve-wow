  5093, 5094, 5095, 5101, 5102, 5126, 5966, 5969, 5970, 5971, 5972, 5973, 5979, 5980, 5981,
  5983,
  # Mistmantle Manor (mistmantle_manor.toml): every creature inside its footprint, which now
  # covers the yard and the walled garden: Stalvan and the Fetid Corpses (#641).
