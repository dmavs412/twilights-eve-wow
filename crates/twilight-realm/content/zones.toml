# Hand-written changes laid over the generated content/duskwood.toml, redridge.toml and
# stormwind.toml (spec #466), which are never edited. One [[zone]] per file.
# `levels` is the zone's Level Stretch: every spawn but friendly NPCs and critters has its vanilla
# levels mapped linearly from `from` onto `to`, rounded and clamped into `to`.

[[zone]]
file = "duskwood"
# Unseen (3094): 28 level-49 spawns, invisible in vanilla (aura 4986). The realm does not model
# invisibility.
removed = [3094]
# The open-world creatures inside the lore bible's Phased Dungeons, deleted (2026-10-27,
# Davis's call); phased.rs's lore_bible_dungeons test keeps the footprints clear.
removed_guids = [
  # Raven Hill Deeps (raven_hill_deeps.toml): every creature inside its footprint.
  4334, 4336, 4337, 4338, 4339, 4340, 4341, 4386, 4387, 4388, 4389, 4391, 4392, 4393, 4394,
  4395, 4396, 4397, 4398, 4399, 4400, 4401, 4403, 4404, 4405, 4407, 4452, 4461, 4880, 4882,
  4883, 4884, 4885, 4886, 4888, 4889, 4898, 4980, 4982, 4983, 4986, 4987, 4989, 4992, 5037,
  5093, 5094, 5095, 5101, 5102, 5126, 5966, 5969, 5970, 5971, 5972, 5973, 5979, 5980, 5981,
  5983,
  # Mistmantle Manor (mistmantle_manor.toml): every creature inside its footprint.
  5010,
]
# Vanilla 18-35, the non-critter, non-friendly spawns with the Unseen aside, onto the lore
# bible's 30-50 (docs/lore-bible.md, "Zone arcs and dungeons"); spec #466 decision 2.
levels = { from = [18, 35], to = [30, 50] }

