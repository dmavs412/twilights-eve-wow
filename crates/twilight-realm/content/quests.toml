# ── Advancement Quests ──────────────────────────────────────────────────────────────────────────
# Offered by the trainer of the Calling's Line (content/hub.toml) in the trainer's gossip menu,
# to a character of `advancement.from` at that Calling's Tier Cap: Uzzek, the Vanguard Trainer,
# gives the Vanguard line's, and each other Tier 1 line has its own trainer. They ask for nothing
# but a word: accepted and handed in at the trainer. Handing one in advances the character into
# `advancement.to` (GLOSSARY.md, Advancement). `zone_or_sort` files them under a quest log header:
# the Vanguard line's under Warrior (QuestSort.dbc 81), the others under their class's. Texts:
# data/twilights-eve/callings.json, `advancement_quest`.

[[quest]]
id = 64001
kind = "advancement"
giver = 5810
level = 10
zone_or_sort = -81
advancement = { from = "basic_warrior", to = "vanguard" }
title = "The Warrior's Path"
objectives = "Speak with the Vanguard Trainer at the Crossroads to take up the warrior's path."
details = "You have learned all a Basic Warrior can learn, $N. Strength alone carried you this far; from here, discipline must carry you further.$B$BTake up the warrior's path and you begin again, untested, among the youngest of our blades. But you will not be the same fighter you were. Your body remembers. Your arm is stronger.$B$BSay the word, and it begins."
progress = "Say the word, $N, and it begins."
completion = "Then it is done. Forget your old habits, $N: you are a Vanguard now, and a Vanguard starts over. Go and earn your scars again."
money = 0
tokens = 0

