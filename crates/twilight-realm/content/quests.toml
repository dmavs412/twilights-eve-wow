# The Hub's quest givers and their Repeatable Quests (GLOSSARY.md). Each giver stands in the
# Crossroads for one Hunting Ground and offers its quests, which can be taken again as soon as
# they are handed in. A quest's XP is not here: it is always the player's next level's worth,
# shrunk once they outlevel the quest (`rules::quest`).
#
# The givers are Hub NPCs, in content/hub.toml; a quest names its giver's `entry`.
#
# A quest: `id`, its `giver`, `level`, `min_level` (the lowest level it is offered at; by default
# four below its level, and at least 1),
# the dialog texts, `money` (copper) and `tokens` on hand-in, and its objectives: `kill` rows of
# `[creature entry, count]`, and `collect` rows of an `item` (content/quest_items.toml), its
# `count`, and the creatures it drops `from` at `chance` percent while the quest wants more.
# At most four of each.

