# The Hub's quest givers and their quests (GLOSSARY.md). Each giver stands in the Crossroads for
# one Hunting Ground and offers its quests. A quest's `kind` says how often it can be done:
#
# - "hunting": a Hunting Quest, once per character. Advancement never forgets it. It pays 1 Token.
# - "repeatable": a Dungeon's Repeatable Quest, taken again as soon as it is handed in. It pays
#   3 Tokens.
# - "bounty": a Field Giver's bounty, taken again as soon as it is handed in. It pays half a
#   level's XP, as a Hunting Quest does, and the `tokens` and `money` it names (1 Token).
# - "advancement": an Advancement Quest, with an `advancement` table (below). It pays no Token.
# - "once": once per character. Advancement never forgets it. It pays no XP.
# - "story": a Story Quest, once per character. Advancement never forgets it. It pays XP as a
#   Hunting Quest does (below) and no Token; `money` is allowed, though the Story Quests set 0.
#   They live in content/quests_elwynn.toml, which has this same schema.
#
# A quest's XP is not here (`rules::quest`): a Hunting Quest's is half the XP from its own level
# to the next, a Repeatable Quest's the player's next level's worth, and both shrink once the
# player outlevels the quest. An Advancement Quest pays in a new Calling, not in XP.
#
# The givers are Hub NPCs, in content/hub.toml, or Field Givers: a friendly creature the realm
# places anywhere, an Elwynn spawn (content/elwynn.toml after elwynn_overrides.toml) or a Phased
# Dungeon's (content/northshire_abbey.toml). A quest names its giver's `entry`; the content load
# fails on an entry that is neither.
#
# A quest: `id`, its `kind`, its `giver`, `level`, an optional `min_tier` (the lowest Tier it is
# offered at; by default the Tier of its level: below 10 is 0, 10 to 29 is 1, 30 to 49 is 2, 50
# and up is 3; there is no maximum, and a copy accepted earlier is handed in at any Tier),
# the dialog texts, `money` (copper) and `tokens` on hand-in, and its objectives: `kill` rows of
# `[creature entry, count]`, and `collect` rows of an `item` (content/quest_items.toml), its
# `count`, and the creatures it drops `from` at `chance` percent while the quest wants more.
# At most four of each.
#
# A "find" quest sends the player to a place or a person:
# - `explore`: a spot the player walks into, `{ place, position = [x, y], radius, map }` (WoW
#   coordinates, yards; `map` 1, Kalimdor, by default, 0 for the Eastern Kingdoms). It is met on entering, and the log shows
#   "<place> explored". A list, `explore = [{ ... }, { ... }]`, gives each spot a log row of its
#   own, labelled with its `place`, with a count of 1; the quest is met once every spot is
#   reached, in any order. Each listed spot takes one of the four objective slots with the
#   `kill`, `talk` and `use` entries.
# - `fail_if_seen`: a text. While the quest is active, if a creature enters combat with the
#   character (it aggroes on them, or they attack it), the quest fails: the log shows it Failed,
#   the text goes to the character as a system message, and it gains no credit and cannot be
#   handed in. A groupmate's combat does not count. Abandoning it from the log lets the giver
#   offer it again with all credit reset.
# - `ender`: the Hub NPC or Field Giver who takes the quest in, when it is not the giver: a
#   person found out in a Hunting Ground. A quest with no other objective is met on accepting,
#   and finding them is the task.
# - `discover`: `AreaTable.dbc` ids (content/areas.toml), met once the character has discovered
#   every one (Discovery). It counts the discoveries made before the quest was taken.
# - `after`: a quest offered only once that quest is handed in. When its giver is that quest's
#   ender, it is the next in the chain: its accept panel opens as the other is handed in.

