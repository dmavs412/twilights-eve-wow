kind = "advancement"
giver = 5810
level = 10
zone_or_sort = -81
advancement = { from = "basic_warrior", to = "vanguard" }
title = "The Warrior's Path"
objectives = "Speak with the Vanguard Trainer at the Crossroads to take up the warrior's path."
details = "You have learned all a Basic Warrior can learn, $N. Strength alone carried you this far; from here, discipline must carry you further.$B$BTake up the warrior's path and you begin again, untested, among the youngest of our blades. But you will not be the same fighter you were. Your body remembers. Your arm is stronger.$B$BSay the word, and it begins."
