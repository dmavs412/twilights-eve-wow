# The Hub's quest givers and their quests (GLOSSARY.md). Each giver stands in the Crossroads for
# one Hunting Ground and offers its quests. A quest's `kind` says how often it can be done:
#
# - "hunting": a Hunting Quest, once per Tier. Advancement forgets it, so the next Tier does it
#   again. It pays 1 Token.
# - "repeatable": a Dungeon's Repeatable Quest, taken again as soon as it is handed in. It pays
#   3 Tokens.
# - "advancement": an Advancement Quest, with an `advancement` table (below). It pays no Token.
#
# A quest's XP is not here (`rules::quest`): a Hunting Quest's is half the XP from its own level
# to the next, a Repeatable Quest's the player's next level's worth, and both shrink once the
# player outlevels the quest. An Advancement Quest pays in a new Calling, not in XP.
#
# The givers are Hub NPCs, in content/hub.toml; a quest names its giver's `entry`.
#
# A quest: `id`, its `kind`, its `giver`, `level`, `min_level` (the lowest level it is offered at;
# by default four below its level, and at least 1),
# the dialog texts, `money` (copper) and `tokens` on hand-in, and its objectives: `kill` rows of
# `[creature entry, count]`, and `collect` rows of an `item` (content/quest_items.toml), its
# `count`, and the creatures it drops `from` at `chance` percent while the quest wants more.
# At most four of each.
#
# A "find" quest sends the player to a place or a person:
# - `explore`: a spot the player walks into, `{ place, position = [x, y], radius }` on Kalimdor
#   (WoW coordinates, yards). It is met on entering, and the log shows "<place> explored".
# - `ender`: the Hub NPC (content/hub.toml) who takes the quest in, when it is not the giver: a
#   person found out in a Hunting Ground. A quest with no other objective is met on accepting,
#   and finding them is the task.
# - `after`: a quest offered only once that quest is handed in. When its giver is that quest's
#   ender, it is the next in the chain: its accept panel opens as the other is handed in.

