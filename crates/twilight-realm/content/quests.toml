# ── Advancement Quests ──────────────────────────────────────────────────────────────────────────
# Offered by the trainer of the Calling's Line (content/hub.toml) in the trainer's gossip menu,
# to a character of `advancement.from` at that Calling's Tier Cap: Uzzek, the Vanguard Trainer,
# gives the Vanguard line's, and each other Tier 1 line has its own trainer. They ask for nothing
# but a word: accepted and handed in at the trainer. Handing one in advances the character into
# `advancement.to` (GLOSSARY.md, Advancement). `zone_or_sort` files them under a quest log header:
# the Vanguard line's under Warrior (QuestSort.dbc 81), the others under their class's. Texts:
# data/twilights-eve/callings.json, `advancement_quest`.

[[quest]]
