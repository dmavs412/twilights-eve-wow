# The Riot, the Stockade's east wing: a Phased Dungeon for levels 30 to 34 under Stormwind City
# (spec #575, docs/specs/stockade/README.md). Hand-written, from the game data.
#
# On the Stockade's instance map, 34 (instance_maps.toml, ADR 0032 amended 2026-11-04), whose
# doors and Dungeon mark are the map's own. Vanilla's jail is a cross: the corridor from the door
# runs north along x, and the hall of cells crosses it a level below, the east wing at y below 0
# and the west wing (stockade_quiet_wing.toml) at y above 0. The Watch holds the gate hall and
# the corridor, open world; this dungeon's footprint is the east wing and the stairs down to it.
# Map 34 has no terrain, so every Z here is written from the vmangos dump with
# `grounded = false`, each naming the stock spawn it came from; ground_check.py leaves the rows
# alone. The jail's 93 stock spawns span x 67 to 193, y -129 to 148 and z -35 to -25.
#
# The riot (#578): the hall's east wing runs from the foot of the east stairs to the round room
# at its end, about 15 degrees off the y axis through (131, 0). Down it: a pack at the stairs'
# foot; row A, the near half of the cells, with Lever A and Portcullis A at its mouth; Varl
# Cutter where the rows meet; row B, the far half, with its own lever and portcullis; Bertram
# Ash's cell, the last before the round room; and Captain Rook in the round room, Bazil Thredd's
# old spot at its mouth. Cutter calls two Rioters out of each row every 20 s of his fight until
# that row's lever is pulled, which also drops its portcullis. The hall runs on past a dropped
# portcullis, so it seals nothing the player needs. Places come from the stock spawns of the
# wing (`creature` rows of map 34), not from map.html's schematic walls; each row names the one
# it was fitted to.
#
# A row's `after_used` or `until_used` names a lever's guid: the row is in the Run once that lever
# is pulled, or until it is. `after_milestone` or `until_milestone` names a row of
# content/milestones.toml (ADR 0034) the same way, for every Run: in from the tick the Milestone
# is reached, or gone from then. No row here names one yet.
#
# Guids: creatures 973001 and 973003 to 973027 (973002 is the quiet wing's), GameObjects 983001
# to 983004 (the entry is the guid). Templates 97200 to 97205 in mobs.toml.
#
# The quests' items (#580, quests_stormwind.toml) are on the corpses through `drop`: a Twilight
# Coin on every Ringleader, Bought Watchman, Cutter and Rook (a Rioter carries one a third of the
# time, through Twilight Coin's collect row), Cutter's Purse on Cutter, and Rook's Keyring and
# Rook's Letters on Rook.

