# Each Calling's starting outfit (ADR 0007, ticket #82), by hand: one starter Chest, worn from
# creation, and the weapons, ranged weapon and ammo that go with it. Every `items` entry is a row
# of data/twilights-eve/gear.csv. A new character starts in the Basic Warrior's; the others say
# what a Calling would be dressed in. See docs/reference/starting-outfits.md.
#
# The starter Chests (900000 up, one per armour type) take their Wardrobe from the vanilla
# Warrior's Recruit's outfit: the shirt's look on the torso, the pants' and boots' below.
# Callings that share an armour type share a Chest.

[basic_warrior]
# Recruit's Mail Vest, Worn Shortsword, Worn Wooden Shield, Crude Throwing Axe.
items = [900000, 25, 2362, 3111]

