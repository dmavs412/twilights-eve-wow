# Cathedral of Light, a Phased Dungeon for levels 48 to 50 in Stormwind City (the lore bible's
# "Zone arcs and dungeons"). Hand-written, from the game data.
#
# The building is the Cathedral's rooms in the stock `stormwind.wmo`, placed by the ADT's MODF at
# (-8931.6, 539.3, 102.0) with heading 38.5, so `origin` is that point and `yaw` is -141.5
# (heading plus 180), as Jasperlode's. Each footprint box is one indoor WMO group's MOGI bounding
# box in that frame, z widened by a yard each way; the comment above it names the group. The
# portal stands in the doorway the WMO's portal 183 draws between the building and the outside.
#
# A shell for now (2026-10-27, Davis's call): one friendly Phase Tester stands in the nave so a
# character can see the Phase, and the open-world creatures that stood inside the boxes are
# deleted. Guids: creatures 971001 up, one a dungeon.

