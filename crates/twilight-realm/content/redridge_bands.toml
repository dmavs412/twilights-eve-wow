# Hand-written. Redridge Level Bands (spec #595): each sub-zone gives the creatures of
# content/redridge.toml that spawn in it a level from its band, in place of their vanilla levels.
# Boxes are [x0, y0, x1, y1] in WoW coordinates on map 0 (x runs north, y runs west).
# A point inside `bounds` and outside every `exclude` box takes the band of the box that holds it,
# or of the nearest box when none does; when two boxes hold the point, the band listed first wins.
# A spawn outside `bounds` keeps the zone's Level Stretch from zones.toml. Friendly NPCs and
# critters keep their own levels, and a level_overrides.toml row beats a band.

# Every band box below, so a spawn outside them all keeps the Level Stretch.
bounds = [
  [-10050.0, -2083.0, -9450.0, -1717.0],
  [-9449.0, -2383.0, -9160.0, -1860.0],
  [-9583.0, -2917.0, -9217.0, -2384.0],
  [-9583.0, -2383.0, -9450.0, -2084.0],
  [-9883.0, -2817.0, -9584.0, -2084.0],
  [-9420.0, -3440.0, -9150.0, -3170.0],
  [-9050.0, -2017.0, -8981.0, -1950.0],
  [-8980.0, -2060.0, -8750.0, -1910.0],
  [-9159.0, -2460.0, -9051.0, -1950.0],
  [-9050.0, -2060.0, -8981.0, -2018.0],
  [-9050.0, -2460.0, -8835.0, -2061.0],
  [-9216.0, -2850.0, -9017.0, -2470.0],
  [-8834.0, -2540.0, -8583.0, -2120.0],
  [-9917.0, -3510.0, -9500.0, -3118.0],
  [-9917.0, -3117.0, -9551.0, -3050.0],
  [-9550.0, -3117.0, -9050.0, -2918.0],
  [-9216.0, -2917.0, -9083.0, -2851.0],
]

# Stonewatch Keep's footprint: stonewatch_keep.toml's boxes turned by its yaw of 95 about
# -9387.8,-3029.3, so the keep's halls keep the Phased Dungeon's levels and the band takes only the
# yard round them. Ilgalar's Approach holds the Tower of Ilgalar (-9282,-3330) but excludes none of
# it: zones.toml already removed every creature inside the tower's footprint, and the one left in
# its flat box, a Shadowhide Warrior at the tower's foot (-9261,-3283), takes the approach's band
# like the gnolls round it.
exclude = [[-9415.0, -3098.0, -9352.0, -3045.0]]

# Three Corners: Guard Parker -9610,-1902; Redridge Thrasher -9534,-1934; Tarantula -9702,-1915.
# The Mongrels and Poachers south of y -2083 (-9631,-2124; -9722,-2342) stand in the Lakeridge
# Highway box and take that band.
[[band]]
name = "Three Corners"
level_min = 30
level_max = 32
boxes = [[-10050.0, -2083.0, -9450.0, -1717.0]]

# Lakeshire: the town (Magistrate Solomon -9219,-2222), the goretusk fields west of it (Great
# Goretusk -9375..-9207, -1973..-1886; Bellygrub -9289,-1919) and the fields south-west of the
# town down to the lake shore (Great Goretusk -9451,-2123). The north edge stops at x -9160, short
# of the Redridge Brute at -9153,-2020; north of the town is gnoll country, a later band.
[[band]]
name = "Lakeshire"
level_min = 31
level_max = 33
boxes = [[-9449.0, -2383.0, -9160.0, -1860.0]]

# Lake Everstill: the lake (Murloc Flesheater -9419,-2624; Murloc Scout -9316,-2623; Murloc
# Shorestriker -9562,-2623; Murloc Minor Tidecaller -9515,-2753; Dire Condor -9383,-2687; Lake
# Thresher -9388,-2559 and -9508,-2491), and the strip of its chunks between Three Corners, the
# Lakeridge Highway and Lakeshire (Black Dragon Whelp -9571..-9485, -2374..-2089).
[[band]]
name = "Lake Everstill"
level_min = 32
level_max = 35
boxes = [
  [-9583.0, -2917.0, -9217.0, -2384.0],
  [-9583.0, -2383.0, -9450.0, -2084.0],
]

# Lakeridge Highway: the Blackrock camps south of the lake (Blackrock Outrunner, Blackrock Grunt
# and Blackrock Renegade) and the eastern Mongrels and Poachers (-9796..-9598, -2531..-2124).
[[band]]
name = "Lakeridge Highway"
level_min = 33
level_max = 36
boxes = [[-9883.0, -2817.0, -9584.0, -2084.0]]

# Ilgalar's Approach: the tower's hill and the paths up it, so a level 35 character reaches
# Ilgalar's door through gnolls of their level (Shadowhide Gnoll -9365..-9160, -3250..-3181;
# Rabid Shadowhide Gnoll -9299..-9253, -3240..-3199; Shadowhide Darkweaver and Slayer on the hill
# round -9280,-3310). Listed before any band that later covers Galardell Valley round it; Rohh the
# Silent (-9010,-3209) and Lieutenant Fangore (-9112,-3311) stand outside the box.
[[band]]
name = "Ilgalar's Approach"
level_min = 35
level_max = 38
boxes = [[-9420.0, -3440.0, -9150.0, -3170.0]]

# Rethban Caverns: the cave mouth's chunks and the Drudgers' ground before it (Redridge Drudger
# -8973..-8767, -2056..-1916; Ardo Dirtpaw -8827,-1941).
[[band]]
name = "Rethban Caverns"
level_min = 38
level_max = 40
boxes = [
  [-9050.0, -2017.0, -8981.0, -1950.0],
  [-8980.0, -2060.0, -8750.0, -1910.0],
]

# Redridge Canyons: the gnoll canyons north of Lakeshire, less Rethban's boxes (Redridge Brute
# -9153..-9030; Redridge Mystic -9119..-8893; Redridge Basher -9031..-8840; Redridge Alpha
# -8914..-8883, -2175..-2129; Yowler -8885,-2171). The west box starts at x -9159, beside
# Lakeshire's edge, to take the Brute at -9153,-2020. South of Rethban the box stops at x -8835,
# so the Blackrock camp where Corporal Keeshan is held (Blackrock Champion, Summoner and Tracker,
# -8829..-8657, -2472..-2132) stays whole outside it.
[[band]]
name = "Redridge Canyons"
level_min = 36
level_max = 39
boxes = [
  [-9159.0, -2460.0, -9051.0, -1950.0],
  [-9050.0, -2060.0, -8981.0, -2018.0],
  [-9050.0, -2460.0, -8835.0, -2061.0],
]

# Alther's Mill: its chunks east of Lake Everstill's box (Greater Tarantula -9202..-9102,
# -2793..-2609; Chatter -9112,-2724), and north to y -2470 for Snarlflare (-9024,-2493).
[[band]]
name = "Alther's Mill"
level_min = 35
level_max = 37
boxes = [[-9216.0, -2850.0, -9017.0, -2470.0]]

# Render's Camp and Render's Rock, the Blackrock camp where Corporal Keeshan is held (Blackrock
# Champion -8829..-8657, -2346..-2148; Blackrock Tracker -8790..-8689, -2422..-2138; Blackrock
# Summoner -8814..-8668; Kazon -8690,-2350; Corporal Keeshan -8757,-2187, friendly, keeps 25).
# Render's Rock (x -8717..-8617, y -2317..-2250) lies inside the camp's box. The box starts at x
# -8834, past Redridge Canyons, and runs north to y -2120 and south to y -2540 past the chunks so
# the camp's north tents (Blackrock Summoner -8790,-2133) and its south fire (Blackrock Summoner
# -8759,-2529; Blackrock Renegade -8755,-2534) are not split off.
[[band]]
name = "Render's Camp"
level_min = 41
level_max = 44
boxes = [[-8834.0, -2540.0, -8583.0, -2120.0]]

# Render's Valley, the Blackrock camps in the south-east (Blackrock Grunt -9822..-9652; Blackrock
# Outrunner -9816..-9538; Blackrock Renegade -9576..-9509, -3301..-3223; Blackrock Summoner
# -9723,-3178), down to Boulderheart (-9543,-3500) by the Ranthals' farm (Clyde Ranthal
# -9601,-3503, friendly). The chunks (x -9917..-9617, y -3383..-3050) are widened east to x -9500
# and south to y -3510 for the camps' east end and Boulderheart; north of y -3118 the box stops at
# x -9551, short of Stonewatch.
[[band]]
name = "Render's Valley"
level_min = 40
level_max = 43
boxes = [
  [-9917.0, -3510.0, -9500.0, -3118.0],
  [-9917.0, -3117.0, -9551.0, -3050.0],
]

# Stonewatch and Stonewatch Tower: the keep's yard (Blackrock Sentry, Scout, Shadowcaster, Hunter
# and Gladiator, rank 1 elites as in vanilla: group ground; Tharil'zun -9439,-3081, held at 44 by
# level_overrides.toml) and the Blackrock camp at the tower (Blackrock Grunt and Outrunner
# -9236..-9174, -2932..-2852). The keep's box runs north to y -2918, Lake Everstill's edge, for the
# Scouts and Sentry at its north gate (-9534..-9501, -2923..-2918). The tower's chunks west of x
# -9217 lie in the keep's box; east of it a box runs north to y -2851, short of Alther's Mill, for
# the camp's north Grunts (-9208,-2852). Seeker Aqualon (-9389,-2875) stands in Lake Everstill's box.
[[band]]
name = "Stonewatch"
level_min = 43
level_max = 46
boxes = [
  [-9550.0, -3117.0, -9050.0, -2918.0],
  [-9216.0, -2917.0, -9083.0, -2851.0],
]
