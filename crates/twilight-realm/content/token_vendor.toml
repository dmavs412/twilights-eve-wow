# The Token vendor's greens, by band of required levels: a character is offered the band its
# level falls in, and the last band also serves every level above it. Copied from
# data/twilights-eve/token_vendor.json (`bands`, `token_cost`); see
# docs/reference/items-and-vendors.md, "Token vendor". tests/content_tokens.rs checks that the
# two agree. Every entry is an item template in content/items.toml.
#
# `tokens` is the price in Twilight Tokens: max(1, round(item_level / 4 * slot_mod)), with the
# slot multipliers the research proposes. The rows are the merchant window's order.

