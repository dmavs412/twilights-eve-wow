# The Token vendor's stock, by band of required levels: a character is offered the band its
# level falls in, and the last band also serves every level above it. The 1 to 10 band is
# hand-authored: the 22 Token whites of spec #272 (Chest and two-hander 3 Tokens, every other
# weapon 2, amulet and ring 1), nothing else. The later bands are still the research's, copied
# from data/twilights-eve/token_vendor.json (`bands`, `token_cost`; see
# docs/reference/items-and-vendors.md, "Token vendor"), where `tokens` is
# max(1, round(item_level / 4 * slot_mod)) with the slot multipliers the research proposes.
# tests/content_tokens.rs checks both. Every entry is a row of data/twilights-eve/gear.csv; the
# research's greens for a body part outside the ten Gear Slots (ADR 0007) are left out. The
# rows are the merchant window's order.

