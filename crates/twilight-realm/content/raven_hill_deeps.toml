# Raven Hill Deeps, a Phased Dungeon for levels 44 to 48 in Duskwood (the lore bible's "Zone arcs
# and dungeons"). Hand-written, from the game data.
#
# The building is the stock `md_crypt_c.wmo`, the crypt under Raven Hill Cemetery, placed by the
# ADT's MODF at (-10413.7, 405.5, 47.2) with heading -104.0, so `origin` is that point and `yaw`
# is 76 (heading plus 180), as Jasperlode's. Each footprint box is one indoor WMO group's MOGI
# bounding box in that frame, z widened by a yard each way; the comment above it names the group.
# The portal stands on the mausoleum floor beside the stairwell that the WMO's portal 9 cuts.
#
# A shell for now (2026-10-27, Davis's call): one friendly Phase Tester stands in the first vault
# below the stairs so a character can see the Phase, and the open-world creatures that stood
# inside the boxes are deleted. Guids: creatures 971001 up, one a dungeon.

id = 11
name = "Raven Hill Deeps"
levels = [44, 48]
map = 0
zone = 10
origin = [-10413.7, 405.5, 47.2]
yaw = 76

# Group 0.
[[footprint]]
x = [20.0, 94.0]
y = [-44.0, -11.0]
z = [-25.0, -7.0]

# Group 1.
[[footprint]]
