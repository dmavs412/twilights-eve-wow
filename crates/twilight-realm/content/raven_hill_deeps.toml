# Raven Hill Deeps, a Phased Dungeon for levels 40 to 44 in Duskwood (the lore bible's "Zone arcs
# and dungeons"). Hand-written, from the game data.
#
# The building is the stock `md_crypt_c.wmo`, the crypt under Raven Hill Cemetery, placed by the
# ADT's MODF at (-10413.7, 405.5, 47.2) with heading -104.0, so `origin` is that point and `yaw`
# is 76 (heading plus 180), as Jasperlode's. Each footprint box is one indoor WMO group's MOGI
# bounding box in that frame, z widened by a yard each way; the comment above it names the group.
# The portal stands on the mausoleum floor beside the stairwell that the WMO's portal 9 cuts.
#
# The Grey Robes dig the seam under the cemetery and break into an old pocket of grey, and the dead
# in it stand still (#645, spec #637). A run of about 15 minutes, three encounters along the
# crypt's first half: the upper vaults and Commander Felstrom, the dig face in the hall and vault01,
# and the grey pocket in vault06, where the Grey Deacon wakes the Stilled Dead as he weakens. The
# dead here speak. The mist wall `raven_hill_grey` (data/twilights-eve/mist_walls.json) closes the
# rest of the crypt across vault06's south end, where the way down to XBox begins.
#
# Every row is interior, `grounded = false`, with the floor's Z from wmo_floor.py: the upper vaults
# (group 12) 29.08 and 24.39, the hall (group 1) 25.43, vault01 (group 2) 25.25, vault06 (group 4)
# 20.87.
#
# Guids: creatures 974201 to 974219, GameObjects 983051 to 983055. Templates 97260 to 97266 below.

