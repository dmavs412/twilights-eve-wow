# Roads (spec #560): the ADT texture names that are a road or a street, per map. A character
# whose top terrain texture is one of these is on a road. Names compare case-insensitively,
# without the extension. Listed by tools/twilights-eve/road_textures.py.
#
# Map 0's choice, from the list below. Elwynn's roads, Goldshire's square, Eastvale's camp and
# Northshire's courtyard are ElwynnDirtBase2, with ElwynnCobbleStoneBase patches along them and
# on Stormwind's approach. Darkshire's streets are DuskwoodCobblestone; DuskwoodDirt is the ground
# between them, not a road. The rest are the stone and cobble roads of the zones these tiles
# border. No other dirt, grass or rock base is a road.
