# Blackrock Stronghold, a Phased Dungeon for levels 52 to 55 in the Burning Steppes (the lore
# bible's "Zone arcs and dungeons"). Hand-written, from the game data.
#
# The building is the stock `blackrockorcfortress.wmo`, placed by the ADT's MODF at (-7724.7,
# -1496.8, 143.2) with heading -295.5, so `origin` is that point and `yaw` is -115.5 (heading plus
# 180), as Jasperlode's. Each footprint box is one indoor WMO group's MOGI bounding box in that
# frame, z widened by a yard each way; the comment above it names the group. The portal stands in
# the doorway the WMO's portal 2 draws between the building and the outside.
#
# A shell for now (2026-10-27, Davis's call): one friendly Phase Tester stands in the great hall
# so a character can see the Phase, and the open-world creatures that stood inside the boxes are
# deleted. Guids: creatures 971001 up, one a dungeon.

id = 14
name = "Blackrock Stronghold"
levels = [52, 55]
map = 0
zone = 46
origin = [-7724.7, -1496.8, 143.2]
yaw = -115.5

