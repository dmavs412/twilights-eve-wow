    { kind = "energize", power = "rage", amount = { base = 11.0, per_level = 0.1 } },
    { kind = "stun", aura_spell_id = 1000190, aura_spell_name = "Charge (stun)", duration_ms = 1000 },
]

# Zealot's tree: Crusade (seven rows of Paladin Retribution, Holy Power behind 30 points in the
# tab), Blade (Vanguard's weapon talents, Flurry behind 10) and Faith (four rows of Paladin
# defence), so 49 points at the cap put 31 or more in Crusade with the rest in the other two.
# Blade's first row holds the handoff's first two: Improved Charge and Anger Management alone are
# 3 ranks, short of the 5 that open a second row.
# Prerequisites stay inside a tab: Vengeance needs Conviction 5/5, straight down column 2;
# Anger Management, Deep Wounds, Impale and Flurry lose theirs (Tactical Mastery, Improved Rend
# and Enrage are not in Blade, and Deep Wounds sits beside Impale). The Blade talents carry the
# same effects as Vanguard's. WIP talents (`effects = []`): those that need a cooldown, haste,
# hit, movement, Strength or holy-crit kind the realm does not have yet, or a proc it does not
# model (Vindication, Eye for an Eye, Vengeance, Redoubt, Reckoning).
# Improved Seal of the Crusader raises Seal of the Crusader's amounts (skill_amount_pct): its
# attack power and its judgement's holy damage taken, as vanilla's tooltip says; its client cell
# is vanilla's EFFECT1 percent (op 3), on the Seal's family bit.
#   parry_pct - the parry chance rises by that percent
#   defense   - the Defense skill rises by that much
# Benediction takes rage off the Seals and Judgement; its spell-mod cells, one per borrowed
# spell's family bit, make the client's costs agree.

[[calling.talent_tab]]
id = 903
name = "Crusade"
background = "PaladinCombat"

[[calling.talent_tab.talent]]
key = "improved_seal_of_the_crusader"
talent_id = 1000014
tier = 1
column = 2
rank_spells = [1000071, 1000072, 1000073]
spell_name = "Improved Seal of the Crusader"
effects = [{ kind = "skill_amount_pct", skill = "seal_of_the_crusader", per_rank = [5, 10, 15] }]
client_spellmods = [{ flat = false, op = 3, family_bit = 34, per_rank = [5, 10, 15] }]

# Vanilla's 3% less mana a rank, doubled for the small rage costs, rounded and at least 1 rage: the
# Seals' 10 rage loses 1/1/2/2/3, Judgement's 5 loses 1/1/1/1/2.
[[calling.talent_tab.talent]]
key = "benediction"
talent_id = 1000015
tier = 1
column = 3
rank_spells = [1000074, 1000075, 1000076, 1000077, 1000078]
spell_name = "Benediction"
effects = [
    { kind = "skill_cost", skill = "seal_of_command", per_rank = [1, 1, 2, 2, 3] },
    { kind = "skill_cost", skill = "seal_of_the_crusader", per_rank = [1, 1, 2, 2, 3] },
    { kind = "skill_cost", skill = "judgement", per_rank = [1, 1, 1, 1, 2] },
]
# One cell per borrowed spell's own family bit: 33 Seal of Command, 34 Seal of the Crusader,
# 35 Judgement.
client_spellmods = [
    { flat = true, op = 14, family_bit = 33, per_rank = [-10, -10, -20, -20, -30] },
    { flat = true, op = 14, family_bit = 34, per_rank = [-10, -10, -20, -20, -30] },
    { flat = true, op = 14, family_bit = 35, per_rank = [-10, -10, -10, -10, -20] },
]

