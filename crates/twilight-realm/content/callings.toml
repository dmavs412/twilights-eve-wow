# The Callings and their skills, copied from `data/twilights-eve/callings.json` (the `realm` half
# of each skill); tests/content_callings.rs keeps the two in step. Design notes:
# docs/reference/skills-and-talents.md.
#
# A skill is one real 1.12.1 spell id with no ranks: the client shows that spell's name, icon and
# tooltip, and the realm decides what it does. Amounts are `{ base, per_level, per_ap, min }`:
# round(base + per_level * L + per_ap * AP), half away from zero, never below `min` (default 0),
# where L is the level within the Tier and AP the attack power at cast time. Rage is whole points.
#
# `target`: "enemy" (the cast's unit target), "self", or "self_area" (every enemy within
# `radius_yd`, at most `max_targets`). `range_yd` is `[min, max]`; a max of 5 is melee reach.
#
# A Calling: its save `key`, the `name` the select screen shows, its `tier` and Tier Cap (`cap`),
# the `tier_bonus` it adds to base stats (cumulative per Tier, on top of the race table), its
# stance, the `armour` it may wear, skills and Talent Tree. The Advancement Quests into a Calling
# are quests (content/quests.toml).
#
# Gear follows the Calling, never the level: every Calling of the Warrior line wields every
# Warrior weapon, and wears the `armour` kinds it lists ("cloth", "leather", "mail", "plate",
# "shield"). No item is refused for level.

[[calling]]
key = "basic_warrior"
name = "Basic Warrior"
tier = 0
cap = 10
tier_bonus = { strength = 0, agility = 0, stamina = 0, intellect = 0, spirit = 0 }
# Battle Stance: the client refuses Charge, Rend, Thunder Clap, Hamstring and Overpower in any
# other form, so every Warrior Calling stands in it.
shapeshift_form = 17
armour = ["cloth", "leather", "mail", "shield"]

[[calling.skill]]
key = "heroic_strike"
spell_id = 78
rage_cost = 15
cooldown_ms = 0
gcd_ms = 0
target = "enemy"
range_yd = [0.0, 5.0]
effects = [
    { kind = "weapon_strike", weapon = "normal", on_next_swing = true, bonus = { base = 9.5, per_level = 1.4 } },
]

[[calling.skill]]
key = "charge"
spell_id = 100
rage_cost = 0
cooldown_ms = 15000
gcd_ms = 0
target = "enemy"
range_yd = [8.0, 25.0]
requires_out_of_combat = true
effects = [
    { kind = "charge", speed_yd_s = 24.0 },
    { kind = "energize_rage", amount = { base = 8.5, per_level = 0.14 } },
    { kind = "stun", aura_spell_id = 7922, duration_ms = 1000 },
]

# The Talent Tree, from `talent_tree` in the JSON (tests/content_callings.rs checks the seats, rank
# spells, prerequisites and spell mods). Each talent is a real Talent.dbc row, so the stock frame
# shows its name, icon and tooltip; `effects` is what the realm makes it do, one value per rank:
#   skill_rage_cost  - the skill costs that much less rage
#   skill_amount_pct - the skill's damage and buff amounts rise by that percent
#   skill_rage       - the skill gives that much more rage
#   skill_crit_pct   - the skill's critical strike chance rises by that percent
#   melee_crit_pct   - every melee strike's critical strike chance rises by that percent
#   crit_bleed       - a melee crit bleeds the target for that percent of the average swing
#   item_armor_pct   - the armour from items rises by that percent
#   hit_rage_pct     - a landed white swing gives 1 rage that percent of the time
# A talent with `effects = []` and no `skill` is WIP: learnable, shown as "<Name> (WIP)" and
# counted toward the next row, but the realm does not model it yet (Anger Management: no kind
# slows rage decay).
# `client_spellmod` is the spell-mod cell the realm sends so the client's cost check and tooltips
# agree: `op` 14 is COST (tenths of rage), 8 ALL_EFFECTS (percent).

# Recruit: one tab on the vanilla grid, row 2 open at 5 points; 9 points at the Tier Cap.
