    { kind = "school_damage", amount = { base = 2.6, per_level = 1.23, per_ap = 0.05, min = 1 } },
    { kind = "attack_speed_slow", pct = 10, duration_ms = 10000 },
]

[[calling.skill]]
key = "battle_shout"
spell_id = 6673
rage_cost = 10
cooldown_ms = 0
gcd_ms = 1500
target = "self"
effects = [
    { kind = "aura_attack_power", duration_ms = 120000, amount = { base = 14.5, per_level = 0.5 } },
]

[[calling.skill]]
key = "hamstring"
spell_id = 1715
rage_cost = 10
cooldown_ms = 0
gcd_ms = 1500
target = "enemy"
range_yd = [0.0, 5.0]
effects = [
    { kind = "school_damage", melee_hit_table = true, amount = { base = 0.7, per_level = 0.54, per_ap = 0.02, min = 1 } },
    { kind = "movement_slow", pct = 40, duration_ms = 15000 },
]

[[calling.skill]]
key = "overpower"
spell_id = 7384
rage_cost = 5
cooldown_ms = 5000
gcd_ms = 1500
target = "enemy"
range_yd = [0.0, 5.0]
# Castable for 5 s after the target dodged: the realm marks it with a combo point, which the
# client's Overpower button needs.
requires_target_dodged = true
effects = [
    { kind = "weapon_strike", weapon = "normalized", unavoidable = true, bonus = { base = 2.0, per_level = 0.5 } },
]

[[calling.skill]]
key = "bloodrage"
spell_id = 2687
rage_cost = 0
health_cost_pct_of_base_health = 20
cooldown_ms = 60000
gcd_ms = 0
target = "self"
puts_in_combat_ms = 10000
effects = [
    { kind = "energize_rage", amount = { base = 9.6, per_level = 0.25 } },
    { kind = "periodic_rage", aura_spell_id = 29131, per_tick = 1, tick_ms = 1000, duration_ms = 10000 },
]

# The Talent Tree, from `talent_tree` in the JSON (tests/content_callings.rs checks the seats, rank
# spells, prerequisites and spell mods). Each talent is a real Talent.dbc row, so the stock frame
# shows its name, icon and tooltip; `effects` is what the realm makes it do, one value per rank:
#   skill_rage_cost  - the skill costs that much less rage
#   skill_amount_pct - the skill's damage and buff amounts rise by that percent
#   skill_rage       - the skill gives that much more rage
#   skill_crit_pct   - the skill's critical strike chance rises by that percent
#   melee_crit_pct   - every melee strike's critical strike chance rises by that percent
#   crit_bleed       - a melee crit bleeds the target for that percent of the average swing
# `client_spellmod` is the spell-mod cell the realm sends so the client's cost check and tooltips
# agree: `op` 14 is COST (tenths of rage), 8 ALL_EFFECTS (percent).

[[calling.talent_tab]]
id = 900
name = "Basic Warrior"
background = "WarriorArms"

[[calling.talent_tab.talent]]
key = "improved_heroic_strike"
talent_id = 124
tier = 1
column = 1
rank_spells = [12282, 12663, 12664]
effects = [{ kind = "skill_rage_cost", skill = "heroic_strike", per_rank = [1, 2, 3] }]
client_spellmod = { flat = true, op = 14, family_bit = 6, per_rank = [-10, -20, -30] }

