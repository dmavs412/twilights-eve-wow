# The Callings and their skills, copied from `data/twilights-eve/callings.json` (the `realm` half
# of each skill); tests/content_callings.rs keeps the two in step. Design notes:
# docs/reference/skills-and-talents.md.
#
# A skill is one real 1.12.1 spell id with no ranks: the client shows that spell's name, icon and
# tooltip, and the realm decides what it does. Amounts are `{ base, per_level, per_ap, min }`:
# round(base + per_level * L + per_ap * AP), half away from zero, never below `min` (default 0),
# where L is the level within the Tier and AP the attack power at cast time. A `power_cost` is whole
# points of the Calling's power.
#
# Every spell id has its `Spell.dbc` name beside it (`spell_id` and `spell_name`, `aura_spell_id`
# and `aura_spell_name`), and tests/content_spell_ids.rs checks each pair against the client. `cargo run -p benilla-formats
# --example spell_names -- <id>...` prints an id's name and rank.
#
# `target`: "enemy" (the cast's unit target), "self", or "self_area" (every enemy within
# `radius_yd`, at most `max_targets`). `range_yd` is `[min, max]`; a max of 5 is melee reach.
#
# A Calling: its save `key`, the `name` the select screen shows, its `tier` and Tier Cap (`cap`),
# its `power` (rage, energy, focus or mana) and `stat_profile` (the vanilla class table its stats
# follow: warrior, rogue, mage ...; a test Calling may write `class = N` for both), the
# `tier_bonus` it adds to base stats (cumulative per Tier, on top of the race table), its stance, the `armour` it may wear and its skills. The Advancement Quests into a Calling
# are quests (content/quests.toml).
#
# Gear follows the Calling, never the level: it wields the `weapons` it lists (every Warrior weapon
# when it lists none), and wears the `armour` kinds it lists ("cloth", "leather", "mail", "plate",
# "shield"). No item is refused for level.

# Basic Warrior and Vanguard are not here: the master CSV defines them (data/twilights-eve/server_spells.json,
# read by src/generated.rs). A Calling with a `calling` row in the sheet is the sheet's; the
# others are the tables below.

[[calling]]
key = "zealot"
name = "Zealot"
tier = 2
power = "rage"
stat_profile = "warrior"
cap = 50
tier_bonus = { strength = 28, agility = 14, stamina = 28, intellect = 0, spirit = 7 }
# Still a rage bar and Battle Stance: the borrowed Paladin spells need no stance once rewritten.
shapeshift_form = 17
armour = ["cloth", "leather", "mail", "plate", "shield"]

# Borrowed Paladin spells (`borrowed`): the client rewrites each row to cost `power_cost` rage in any
# stance, as a Warrior spell with its own family bit (33..63, which no Warrior spell uses), so a
# spell modifier can name it (ADR 0003).
#
# Seal of Command procs 7 times a minute (vmangos), each a holy hit of 70% of a weapon roll under
# 20424, Spell.dbc's proc; judged, a holy hit under Judgement of Command Rank 1 (20467).
#
# Seal of the Crusader: 20 + 4 attack power a level (vanilla's Rank 3 gives 94 at 22), swings 40%
# faster with each hit cut to match; judged, Judgement of the Crusader Rank 3 (20300) for its 10 s,
# 20% more holy damage taken (vanilla's is flat; a percent keeps up with the levels), each landed
# white swing at the target putting it back to its full 10 s, as the tooltip says.
[[calling.skill]]
key = "seal_of_command"
spell_id = 1000065
spell_name = "Seal of Command"
power_cost = 10
cooldown_ms = 0
gcd_ms = 1500
target = "self"
borrowed = { family_bit = 33 }
effects = [
    { kind = "seal", duration_ms = 30000, seal = { kind = "command", procs_per_minute = 7.0, weapon_pct = 70, proc_spell_id = 20424, proc_spell_name = "Seal of Command", judgement_spell_id = 20467, judgement_spell_name = "Judgement of Command", judgement = { base = 30.0, per_level = 3.0, per_ap = 0.15 } } },
]

[[calling.skill]]
key = "seal_of_the_crusader"
spell_id = 1000066
spell_name = "Seal of the Crusader"
power_cost = 10
cooldown_ms = 0
gcd_ms = 1500
target = "self"
borrowed = { family_bit = 34 }
effects = [
    { kind = "seal", duration_ms = 30000, seal = { kind = "crusader", attack_power = { base = 20.0, per_level = 4.0 }, haste_pct = 40, judgement_spell_id = 20300, judgement_spell_name = "Judgement of the Crusader", judgement_duration_ms = 10000, holy_taken_pct = 20 } },
]

[[calling.skill]]
key = "judgement"
spell_id = 1000067
spell_name = "Judgement"
power_cost = 5
cooldown_ms = 10000
gcd_ms = 0
target = "enemy"
range_yd = [0.0, 10.0]
borrowed = { family_bit = 35 }
effects = [{ kind = "judgement" }]

# Rank 4, the one whose tooltip says six seconds.
[[calling.skill]]
key = "hammer_of_justice"
spell_id = 1000068
spell_name = "Hammer of Justice"
power_cost = 15
cooldown_ms = 60000
gcd_ms = 1500
target = "enemy"
range_yd = [0.0, 10.0]
borrowed = { family_bit = 36 }
effects = [{ kind = "stun", aura_spell_id = 1000068, aura_spell_name = "Hammer of Justice", duration_ms = 6000 }]

# Carried over from Vanguard with the same data: `callings::skill` finds a spell's first table.
[[calling.skill]]
key = "mortal_strike"
spell_id = 1000069
spell_name = "Mortal Strike"
power_cost = 30
cooldown_ms = 6000
gcd_ms = 1500
target = "enemy"
range_yd = [0.0, 5.0]
effects = [
    { kind = "weapon_strike", weapon = "normalized", bonus = { base = 25.0, per_level = 2.5 } },
    { kind = "healing_reduction", pct = 50, duration_ms = 10000 },
]

[[calling.skill]]
key = "charge"
spell_id = 1000070
spell_name = "Charge"
power_cost = 0
cooldown_ms = 15000
gcd_ms = 0
target = "enemy"
range_yd = [8.0, 25.0]
requires_out_of_combat = true
effects = [
    { kind = "charge", speed_yd_s = 24.0 },
    { kind = "energize", power = "rage", amount = { base = 11.0, per_level = 0.1 } },
    { kind = "stun", aura_spell_id = 1000190, aura_spell_name = "Charge (stun)", duration_ms = 1000 },
]
