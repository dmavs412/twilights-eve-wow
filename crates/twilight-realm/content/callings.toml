# Vanguard's tree: Weaponmaster (five rows, Flurry at 20 points in the tab) and Warlord (three
# rows), so 29 points at the cap reach Flurry with 9 for Warlord. Each tier n needs 5 * (n - 1)
# points in its tab. Prerequisites stay inside a tab: Deep Wounds needs Improved Rend 3/3 and
# Impale Deep Wounds 3/3; Anger Management and Flurry lose theirs (Tactical Mastery and Enrage are
# not in Weaponmaster). WIP talents (`effects = []`, no `skill`): Anger Management (no kind slows
# rage decay) and Flurry (no player haste on a crit). More kinds than the Recruit tree's:
#   weapon_damage_pct      - physical damage dealt rises by that percent with `weapon` in hand
#   weapon_crit_pct        - melee crit chance rises by that percent with `weapon` in hand
#   skill_crit_damage_pct  - a skill's crit adds that percent of its bonus
#   skill_duration_pct     - the skill's auras last that percent longer
#   extra_swing_pct        - a landed white swing with `weapon` swings again that percent of the time
#   hit_stun_pct           - a landed white swing with `weapon` stuns that percent of the time
#   crit_taken_heal_pct    - a crit taken heals that percent of maximum health over the aura
#   crit_taken_damage_pct  - a crit taken raises melee damage by that percent for a while

