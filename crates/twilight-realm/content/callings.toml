# The Tier 1 tree: the real Arms, Fury and Protection pages cut at tier 5, so 29 points reach one
# tab's last talent with 9 to spare. An active talent's `skill` is cast as any skill once its rank
# is learned. A talent with `effects = []` and no `skill` is WIP: learnable and shown as
# "<Name> (WIP)", but the realm does not model it (Dual Wield Specialization: no off hand swings;
# Iron Will: nothing stuns or charms the player). More kinds than the Recruit tree's:
#   defense                - the Defense skill rises by that much
#   weapon_damage_pct      - physical damage dealt rises by that percent with `weapon` in hand
#   weapon_crit_pct        - melee crit chance rises by that percent with `weapon` in hand
#   skill_crit_damage_pct  - a skill's crit adds that percent of its bonus
#   skill_duration_pct     - the skill's auras last that percent longer
#   parry_pct, block_pct   - the parry chance, and the block chance with a shield, rise by that much
#   block_rage_pct         - a block gives 1 rage that percent of the time
#   extra_swing_pct        - a landed white swing with `weapon` swings again that percent of the time
#   hit_stun_pct           - a landed white swing with `weapon` stuns that percent of the time
#   crit_taken_heal_pct    - a crit taken heals that percent of maximum health over the aura
#   crit_taken_damage_pct  - a crit taken raises melee damage by that percent for a while

