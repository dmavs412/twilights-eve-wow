# Trinket Spells (spec #458): what a worn trinket does when it is clicked, and the buffs it puts
# up. Hand-written, not from master.csv, as creature_spells.toml is. Each is a spell of its own:
# tools/twilights-eve/build_spells.py reads this file and writes each one's client row into
# client_dbc_patch.json, and tools/twilights-eve/build_gear.py checks a Gear row's `use` against
# it and writes the item's use cooldown from it, so after an edit here run both again.
#
# A Gear row of data/twilights-eve/gear.csv names its spell in the `use` column. Only a worn
# trinket (slot 12 or 13) is clicked; one in a bag does nothing. A click is instant, triggers no
# global cooldown, keeps stealth, and is refused while dead or while a cast bar or a channel runs.
# Putting a trinket on starts a 30 s wait before it can be clicked, unless its own cooldown has
# longer to run.
#
# Ids run from 1,960,000 to 1,969,999, unique across this file, creature_spells.toml and
# master.csv.
#
# [[spell]], one per trinket:
# key          the name the realm knows it by
# spell_id     its own id
# name         the spell's name
# icon         a stock icon path, or a PNG in data/twilights-eve/art/
# visual       the stock spell whose look (SpellVisual) it takes, or 0 for none
# description  the tooltip's "Use:" line
# cooldown_ms  from the click: the item can't be clicked again until it runs out; it is kept in
#              the save, and the item's tooltip and the client's sweep read the same number
# effect       optional: what the click does. Without one, the click only starts the cooldown.
#              Its kinds, which any trinket may name:
#              roll                     one of `faces` (each an effect) drawn evenly, shown in
#                                       chat as a /random of 1 to the face count
#              lose_current_health_pct  `pct` percent of the current health, rounded down; it
#                                       never drops below 1
#              heal_max_health_pct      a heal of `pct` percent of the maximum health
#              energize_max_power_pct   `pct` percent of the power bar's maximum (rage, energy or
#                                       mana)
#              aura                     the [[aura]] row `key` goes on the wearer
#
# [[aura]], one per buff a trinket puts up, in the shape of a Calling's aura (callings::AuraDef),
# so it goes on through the same code a skill's does:
# key          the name an effect names it by
# spell_id     its own id, the buff the client shows
# name         the buff's name
# icon         as a spell's
# description  optional: the buff's tooltip
# duration_ms  how long it lasts
# charges      optional: the casts that use it up, as an aura row's
# effects      what it does while it is on, as an aura row's effects. A mod_cast_speed_pct with no
#              family_bits reaches every Calling skill's cast bar. A next_cast with an empty
#              `skill` list reaches every Calling skill but the ones that pass it by: auto-repeat
#              shots, channelled skills, and skills that move the caster (a charge, a leap or a
#              blink). Its `repeat = true` makes that cast go off a second time at once, at the
#              same target, free.

[[spell]]
key = "loaded_die"
spell_id = 1960000
name = "Morgan's Loaded Die"
icon = 'Interface\Icons\INV_Misc_Dice_01'
visual = 0
description = "Roll a die. Each face does something different."
cooldown_ms = 300000
effect = { kind = "roll", faces = [
  { kind = "lose_current_health_pct", pct = 30 },
  { kind = "heal_max_health_pct", pct = 20 },
  { kind = "energize_max_power_pct", pct = 25 },
  { kind = "aura", key = "quick_hands" },
  { kind = "aura", key = "blood_luck" },
  { kind = "aura", key = "sixes" },
] }

[[spell]]
key = "apprentices_hourglass"
spell_id = 1960004
name = "Apprentice's Hourglass"
icon = 'Interface\Icons\INV_Misc_PocketWatch_01'
visual = 0
description = "In 6 sec, return to where you stand now, with the health and power you have now."
cooldown_ms = 300000
effect = { kind = "aura", key = "falling_sand" }

[[spell]]
key = "echo_shard"
spell_id = 1960005
name = "Vael's Echo Shard"
icon = 'Interface\Icons\INV_Enchant_ShardNexusLarge'
visual = 0
description = "Your next skill within 20 sec goes off a second time."
cooldown_ms = 120000
effect = { kind = "aura", key = "echo" }

# The Loaded Die's three buffs (faces 4 to 6). The names are placeholders.
[[aura]]
key = "quick_hands"
spell_id = 1960001
name = "Quick Hands"
icon = 'Interface\Icons\Ability_Rogue_SliceDice'
description = "Swings, shots and casts 25% faster."
duration_ms = 15000
effects = [
  { kind = "mod_melee_haste_pct", pct = 25 },
  { kind = "mod_ranged_haste_pct", pct = 25 },
  { kind = "mod_cast_speed_pct", pct = 25 },
]

[[aura]]
key = "blood_luck"
spell_id = 1960002
name = "Blood Luck"
icon = 'Interface\Icons\Spell_Shadow_LifeDrain02'
description = "Your hits heal you for 20% of the damage they deal."
duration_ms = 15000
effects = [{ kind = "leech_pct", pct = 20 }]

[[aura]]
key = "sixes"
spell_id = 1960003
name = "Sixes"
icon = 'Interface\Icons\Spell_Shadow_UnholyStrength'
description = "Damage dealt doubled."
duration_ms = 15000
effects = [{ kind = "mod_damage_done_pct", pct = 100 }]

# The Apprentice's Hourglass's buff. When it runs out on its own, the wearer snaps back to where
# they clicked, with the health and power they had then; dying, going through a door, a
# Hearthstone or a worldport, or clicking it off ends it with no snap. The name is a placeholder.
[[aura]]
key = "falling_sand"
spell_id = 1960006
name = "Falling Sand"
icon = 'Interface\Icons\Spell_Nature_TimeStop'
description = "When the sand runs out, you return to where you turned the hourglass."
duration_ms = 6000
effects = [{ kind = "rewind" }]

# Vael's Echo Shard's buff. The next Calling skill goes off a second time at once, at the same
# target, free and off the global cooldown, and the second cast never echoes again. Auto Shot,
# wand shots, channelled skills and skills that move the caster pass it by and leave it on. The
# name is a placeholder.
[[aura]]
key = "echo"
spell_id = 1960007
name = "Echo"
icon = 'Interface\Icons\Spell_Nature_Purge'
description = "Your next skill goes off a second time."
duration_ms = 20000
charges = 1
effects = [{ kind = "next_cast", skill = [], repeat = true }]
