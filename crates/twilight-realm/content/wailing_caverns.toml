# The Wailing Caverns, the slice's one Dungeon (ticket #16), by hand from
# data/twilights-eve/wailing_caverns_run.json (docs/reference/wailing-caverns.md). tests/content_wailing_caverns.rs
# checks that the two agree.
#
# Map 43 is WMO-only: there is no terrain, so every z here is the server's and the client re-grounds
# units on its own collision.

# `Map.dbc` 43 and `AreaTable.dbc` 718.
map = 43
zone = 718

# Lady Anacondra's spawn: her kill always drops one blue of the run's level band, the five levels
# up to the runner's (`rules::loot::boss_band`), out of `boss_loot` and the world's blues.
boss = 300999
# Her own pool, for the band the caverns are built for: the reference's `proposed_boss_pool` in
# loot_items.json, twenty real Wailing Caverns blues a level ~20 Warrior can use. Seven are the instance's own boss drops,
# whose templates are in dungeon_items.toml; the rest are world blues in items.toml.
boss_loot = [6627, 13245, 10410, 6460, 6631, 6449, 6463, 12997, 12989, 12975, 12994, 12982, 2194, 12976, 12978, 12990, 1121, 12988, 2059, 3021]

# `AreaTrigger.dbc` 228 on Kalimdor, and where vmangos' `areatrigger_teleport` sends the player.
[entrance]
trigger = 228
map = 1
position = [-753.596, -2212.78, 21.54]
radius = 13.0
to = { map = 43, position = [-158.441, 131.601, -74.255], orientation = 5.847 }

# `AreaTrigger.dbc` 226 inside, back out to the entrance.
[exit]
trigger = 226
map = 43
position = [-172.181, 138.98, -66.647]
radius = 12.0
to = { map = 1, position = [-738.462, -2217.8, 16.919], orientation = 6.021 }

# The run's creatures (vmangos `creature_template`). Solo-tuned: the reference's elites carry 3x
