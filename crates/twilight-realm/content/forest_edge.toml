# Forest's Edge, the Phased Dungeon of Hogger's siege (spec #169, issue #170). Hand-written
# The palisade rows were generated along the rim; the rest is authored.
#
# One box in the world frame, the hollow around vanilla Hogger's spawn (-9946, 604, 38) out to
# the Westfall hills on the south and west and the rim on the north and east. The one way in
# and out is the Portal on the north-east rim, toward Westbrook Garrison, where the walkable
# approach from the Maclure vineyards meets the hollow.
# The guids are this file's own (79xxxx).

id = 2
name = "Forest's Edge"
map = 0
# Elwynn Forest, for its creatures' Zone Factor.
zone = 12
origin = [0.0, 0.0, 0.0]
yaw = 0.0

[[footprint]]
x = [-10080.0, -9910.0]
y = [530.0, 680.0]
z = [12.0, 63.0]

[portal]
position = [-9911.0, 556.0, 36.25]
orientation = 0.0

# The invisible wall (#259): no one walks across the footprint's edge, in or out, except within
# gap_yd of the Portal. The palisade's own gap is y 547 to 564 on the east rim, 8.5 yd each way.
[wall]
gap_yd = 8.0

# The Noise meter (#171): a stacking debuff on the Run, shown on every character in the Phase.
# The debuff borrows Piercing Howl (12323, spell_shadow_deathscream) for its alarm icon and name;
# its stock tooltip text still talks of slowing, which a later ticket can replace with a row of
# its own.
[meter]
name = "Noise"
max = 20
client_spell = 12323
clock_stack_every_s = 30.0
on_first_damage = 1
on_death = 1
hide_drain_every_s = 2.0
# A sleeper (#172) wakes when a character is within base + per_stack x stacks yards (plus its own
# wake_radius_mod).
wake_base_yd = 3.0
wake_per_stack_yd = 1.5


# Hiding spots (#170): inside the Phase only, spaced along the routes from the Portal past
# Hogger's camps. Displays: 6133 WestfallHayStack01 and 461 DuskwoodHayStack (large haystacks),
# 6145 and 6146 HayBail01/02, 3678 WestfallWagon01. No hollow-log GameObject exists in the 1.12
# display set. The Noise ticket gives them their effect.

