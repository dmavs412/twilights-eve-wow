# The Quiet Wing, the Stockade's west wing: a Phased Dungeon for levels 36 to 40 under Stormwind
# City (spec #575, docs/specs/stockade/README.md). Hand-written, from the game data.
#
# On the Stockade's instance map, 34 (instance_maps.toml, ADR 0032 amended 2026-11-04), beside
# the riot (stockade_riot.toml), which holds the east wing. North is +x and west is +y: this
# dungeon's footprint is the hall's west wing, at y above 0 a level below the corridor, and the
# stairs down to it. The Watch holds the gate hall and the corridor, open world. Map 34 has no
# terrain, so every Z here is written from the vmangos dump with `grounded = false`, each naming
# the stock spawn it came from; ground_check.py leaves the rows alone.
#
# The quiet wing (#582): the hall's west wing runs from the foot of the west stairs to the round
# room at its end, about 15 degrees off the y axis through (131, 0). Down it: two Writ Warders at
# the stairs' foot; the four writ cells, the first past the stairs on alternating sides, each
# holding a witness behind its bars, with two patrol pairs in the hall between them; Sister Quill
# in the scribe's room, a cell halfway along; three packs of the Hushed in the lower gallery, the
# wing's far half; and the Hush alone in the drain, the round room at the wing's end, Dextren
# Ward's old spot at its mouth and the grate in its floor. The grate appears once Quill is dead.
# Nothing here has an aggro line. Places come from the stock spawns of the wing (`creature` rows
# of map 34), not from map.html's schematic walls; each row names the one it was fitted to.
#
# Guids: creatures 973101 to 973123 (973001 to 973027 are the riot's), the GameObject 983011 (the
# entry is the guid). Templates 97206 to 97214 in mobs.toml.

id = 17
name = "The Quiet Wing"
levels = [36, 40]
map = 34
zone = 717
origin = [0.0, 0.0, 0.0]
yaw = 0.0

