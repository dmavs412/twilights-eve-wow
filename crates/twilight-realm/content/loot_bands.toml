# The Loot Band roll (spec #448, ADR 0026): what a kill on Eastern Kingdoms rolls for, in place
# of the vanilla pools. Each band covers the mob levels in `levels`; a mob above the last band
# rolls the last band. 8% of kills drop one of the band's `white`; 4% drop one of its `green`,
# those whose `level` is within one of the mob's level clamped into the band's green levels. In
# band 1 the greens run from 5 to 8; in every later band they sit at the band's set level, so
# every green qualifies. Every entry is a row of data/twilights-eve/gear.csv; a green's `level` is
# its item level. tests/northshire_loot.rs checks each band against the sheet.

# Northshire: the 22 Token whites and the 21 World greens.
[[band]]
levels = [1, 10]
white = [
  900200, 900201, 900202, 900203, 900204, 900205, 900206, 900207, 900208, 900209, 900210,
  900211, 900212, 900213, 900214, 900215, 900216, 900217, 900218, 900219, 900220, 900221,
]
green = [
  { entry = 900300, level = 6 },
  { entry = 900301, level = 7 },
  { entry = 900302, level = 8 },
  { entry = 900303, level = 8 },
  { entry = 900304, level = 7 },
  { entry = 900305, level = 6 },
  { entry = 900306, level = 8 },
  { entry = 900307, level = 7 },
  { entry = 900308, level = 8 },
  { entry = 900309, level = 5 },
  { entry = 900310, level = 6 },
  { entry = 900311, level = 5 },
  { entry = 900312, level = 6 },
  { entry = 900313, level = 5 },
  { entry = 900314, level = 8 },
  { entry = 900315, level = 7 },
  { entry = 900316, level = 5 },
  { entry = 900317, level = 8 },
  { entry = 900318, level = 8 },
  { entry = 900319, level = 6 },
  { entry = 900320, level = 7 },
]

