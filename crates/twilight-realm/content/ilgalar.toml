# Tower of Ilgalar, a Phased Dungeon for levels 34 to 38 in Redridge (the lore bible's "Zone arcs
# and dungeons"). Hand-written, from the game data.
#
# The building is the stock `redridge_magetower.wmo`, Morganth's workshop, placed by the ADT's
# MODF at (-9282.4, -3329.7, 116.3) with heading 84.5, so `origin` is that point and `yaw` is
# -95.5 (heading plus 180), as Jasperlode's. Each footprint box is one indoor WMO group's MOGI
# bounding box in that frame, z widened by a yard each way; the comment above it names the group.
# The portal stands in the doorway the WMO's portal 2 draws between the building and the outside.
#
# The tower is a working machine (#643, spec #637): three encounters, about 15 minutes. Feed
# valves on the ground floor and the ramp keep the hum going upstairs; the Blackrock Overseer
# guards the emptied strongbox on the middle storey; Morganth waits on the top floor beside the
# Anchor, and every 20 s of his fight he calls a Servant of Ilgalar for each valve still open.
# The tower keeps running after he dies.
#
# The floors, from `tools/twilights-eve/wmo_floor.py`: the ground floor at z 115.67 (group 4;
# group 1 at the door); the ramp, group 4, rising round the tower's inside; the middle storey at
# about z 141.3 (group 3); the top floor at z 150.09 (group 2). wmo_floor.py lists each slab's
# underside too, about a yard below its walking face (140.34 under the middle storey, 149.23 under
# the top floor, a yard under each stretch of ramp); every row here stands on the face. Interior
# rows are `grounded = false` with that floor's Z.
#
# Guids: creatures 974101 to 974114, GameObjects 983041 to 983050 (the entry is the guid), and
# the Anchor at the Steppes spec's 794101. Templates 97240 to 97244 here, spells in
# creature_spells.toml's Tower of Ilgalar section.

id = 8
name = "Tower of Ilgalar"
levels = [34, 38]
map = 0
zone = 44
origin = [-9282.4, -3329.7, 116.3]
yaw = -95.5

