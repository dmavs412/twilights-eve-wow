# Rumours (spec #284, ADR 0014). A kill inside a Rumour's `bounds` (or of one of its `droppers`)
# rolls it; the winner's loot gains a note and the Audience (the credited players) is told where
# a giver waits. The rows are the data ticket's; the rank factors are here.
#
# One Rumour:
#
#   [[rumour]]
#   id = 1
#   name = "A Hermit's Request"
#   grade = "easy"                  # easy, hard or deadly
#   kind = "ordinary"               # or "calling", with calling = { from = "...", to = "..." }
#   map = 0
#   bounds = [[-9160.0, -480.0, -8500.0, 120.0]]   # [x0, y0, x1, y1] boxes on `map`
#   chance = 0.5                    # percent per kill, times the mob's rank factor
#   droppers = [{ entry = 69, chance = 3.0 }]       # their own percent replaces `chance`
#   giver = 97010                   # a friendly mob template; needs no spawn row
#   points = [                      # two to four spots for the giver; x and y only
#     { x = -8975.0, y = -185.0, landmark = "the river bank below the Abbey", note = 980030 },
#     { x = -8835.0, y = -160.0, landmark = "the wolf glade east of the Abbey", note = 980031 },
#   ]
#   quests = [94901]                # the steps, in order; each a `kind = "rumour"` quest
#   timer_min = 30                  # optional; 30 + 15 per extra step by default; none for calling
#
# Each point's `note` is a quest item with `max_count = 1`, non-empty `pages` and a `description`
# that names the landmark. One note belongs to one point only.

# What a kill's chance is multiplied by, by the creature's rank: rank 0 is normal, 1 and 2 are
# elite, 3 is a boss.
[rank_factor]
normal = 1.0
elite = 3.0
boss = 3.0

# What a `kind = "rumour"` quest's own XP is multiplied by, by its Rumour's Grade (a calling
# Rumour pays at 1). The Tier XP Rate and Heat Level apply after, as for every quest.
[grade_xp]
easy = 1
hard = 2
deadly = 3

# Where a last-step chest draws from: an easy Rumour one row of `green`, a hard one a row of
# `blue`, a deadly one two. `green` names the World greens of `northshire_loot.toml`; `blue` lists
# gear rows (the Dungeon pool of the Abbey's Abbot).
[chest_pools]
green = "northshire_world"
blue = [900500, 900501, 900502, 900503, 900504, 900505, 900506, 900507, 900508, 900509, 900510, 900105, 900511, 900512, 900513, 900514, 900515, 900516, 900517, 900518, 900519]

# A step's spawns, keyed by the quest id, written after the Rumour they belong to. Each rolls one
# of its own points; `count` places that many at the same point (1 by default); a creature's
# level is the giver's unless `level` is set.
#
#   [[rumour.spawn]]
#   quest = 94903
#   creature = 97013                # a mob template
#   points = [{ x = -8992.0, y = -325.0 }, { x = -9010.0, y = -300.0 }]
#
#   [[rumour.spawn]]
#   quest = 94905
#   object = { entry = 980120, display = 1011 }   # an entry in that quest's `use`
#   count = 3
#   points = [{ x = -8788.0, y = -170.0 }, { x = -8762.0, y = -140.0 }]
