[[quest]]
id = 97310
kind = "story"
giver_object = 983011
ender = 1719
level = 40
title = "The Drain"
objectives = "Kill the hooded man in the drain and bring what he carries to Warden Thelwater."
details = "The grate is up. Someone came in this way, from the canal, and the wet footprints go on toward the lowest room. Past the gallery where the quiet ones walk, nothing moves at all."
progress = "What was down there?"
completion = "Hooded. One of them, inside my walls, with the names of four people the Keep sent me, in a clerk's hand, and that mark under them. Rook's buyer, Quill's master, the same hands. I can't open a writ cell. Only the hand that wrote the writ can. But nobody comes through my door for them again, and nobody comes up my drain."
money = 2000
choices = [905080, 905081, 905082, 905083]
zone_or_sort = 717
kill = [[97210, 1]]
collect = [{ item = 980131, count = 1 }]

[[quest]]
id = 97311
kind = "story"
giver = 1719
ender = 240
after = 97310
level = 40
title = "Not Up the Hill"
objectives = "Carry the Book of Takings and the Writ of Names to Marshal Dughan in Goldshire."
details = "Rook's letters, Quill's book and this writ: one seal, three hands, and all of it should go up the hill by the rule. Take it to Dughan. He's keeping the letters where nothing goes missing; let him keep the rest. One day someone in this city is going to have to read them all at once."
progress = "From Thelwater again?"
completion = "The book and the writ, with the letters. That's the Watch's captain, the Keep's scribe and the cult's own hand, and the one seal on all three. I'll keep them together. Whatever office that is, it has four people in a cellar who saw the grey, and it wanted them quiet enough to pay for it twice. Somebody is going to have to walk into that Keep and ask. Not today."
money = 1500
zone_or_sort = 717
gives = [[980130, 1], [980131, 1]]
collect = [{ item = 980130, count = 1 }, { item = 980131, count = 1 }]

