# ── The Deeprun Tram (#586) ──────────────────────────────────────────────────────────────────────
#
# One quest, 97313 (#593, docs/specs/deeprun-tram/README.md "Before the run"); the issue's text is
# the contract. Wender Cogg's reply in the quiet wing (97308 above) sends the player to Station
# Master Brannoc, a Hub NPC in the Dwarven District's tram station hall (hub.toml 9300082). The
# station bell starts the run (deeprun_tram.toml) and the Conductor (97218) ends it. The choices
# are the first four rows of the Conductor's set (#592, gear.csv). `money` is copper and a
# placeholder. `zone_or_sort` 2257 is the Deeprun Tram's AreaTable id.
[[quest]]
id = 97313
kind = "story"
giver = 190082
ender = 190082
level = 38
title = "Down the Line"
objectives = "Ring the station bell on the Stormwind platform and stop whatever comes out of the tunnel, then return to Station Master Brannoc."
details = "Cogg stopped the line because the rails run into grey halfway to Ironforge. Fair enough. But every night since, I hear a tram come in from that side, stop at my platform, and go back. Nobody gets off that I can see in the morning. There's a bell on the platform. Ring it, and see what answers."
progress = "Still hearing them?"
completion = "The Conductor. I knew him. He took the last tram out the night the grey came, and I thought he died with it. Those crates were going somewhere, $C, and somebody in this city packed them. I'll have the Watch look at the manifests. Keep this, from the line's own stores."
money = 1500
choices = [905100, 905101, 905102, 905103]
zone_or_sort = 2257
kill = [[97218, 1]]
