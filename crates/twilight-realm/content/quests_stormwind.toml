# ── The Deeprun Tram (#586) ──────────────────────────────────────────────────────────────────────
#
# One quest, 97313 (#593, docs/specs/deeprun-tram/README.md "Before the run"); the issue's text is
# the contract. Wender Cogg's reply in the quiet wing (97308 above) sends the player to Station
# Master Brannoc, a Hub NPC in the Dwarven District's tram station hall (hub.toml 9300082). The
# station bell starts the run (deeprun_tram.toml) and the Conductor (97218) ends it. The choices
# are the first four rows of the Conductor's set (#592, gear.csv). `money` is copper and a
# placeholder. `zone_or_sort` 2257 is the Deeprun Tram's AreaTable id.
[[quest]]
id = 97313
kind = "story"
giver = 190082
ender = 190082
level = 38
title = "Down the Line"
objectives = "Ring the station bell on the Stormwind platform and stop whatever comes out of the tunnel, then return to Station Master Brannoc."
details = "Cogg stopped the line because the rails run into grey halfway to Ironforge. Fair enough. But every night since, I hear a tram come in from that side, stop at my platform, and go back. Nobody gets off that I can see in the morning. There's a bell on the platform. Ring it, and see what answers."
progress = "Still hearing them?"
completion = "The Conductor. I knew him. He took the last tram out the night the grey came, and I thought he died with it. Those crates were going somewhere, $C, and somebody in this city packed them. I'll have the Watch look at the manifests. Keep this, from the line's own stores."
money = 1500
choices = [905100, 905101, 905102, 905103]
zone_or_sort = 2257
kill = [[97218, 1]]

# ── Redridge and Duskwood: the way in (#595) ─────────────────────────────────────────────────────
#
# 97403 to 97405 (#604, spec #595 decisions 2 and 3) and 97421 to 97440 (#694, spec #674
# decision 12); the issues' text is the contract. The Tier 2 trainer who advanced the character
# and the poster beside the Writ Board each send it to both zones. #604 gave the two deliveries
# (97401, 97402) to Commander Wray; #694 deleted them, and each trainer has its own copy of the
# pair, offered `after` its Advancement Quest, so only to a character it advanced. The copies'
# `zone_or_sort` is their destination's (44 Redridge Mountains, 10 Duskwood), so the quest log
# files each under the zone it is done in. All are level 30, so only a Tier 2 character is offered
# them, and none is a prerequisite: each zone's first quests are offered without them. Solomon's
# request goes the other way, from Lakeshire to General Marcus Jonathan at the city gate
# (stormwind.toml, vmangos guid 79677), and from 37 Lord Ebonlocke's letter does the same (97406,
# 97407; #609). From 42 the evidence goes on to Marshal Dughan in Goldshire (97408 to 97410;
# #614), and from 46 Darkshire's relief letter follows it (97411; #619). The quest items are in
# quest_items.toml. `money` is copper. `zone_or_sort` 1519 is Stormwind City's AreaTable id.

# The poster beside the Writ Board. Display 17 is vanilla's Wanted Poster, a placeholder
# (docs/art-assets.md). It stands on the Trade District's street floor (wmo_floor.py group 277).
