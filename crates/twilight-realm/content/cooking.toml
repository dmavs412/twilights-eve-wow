# Cooking (spec #447, ADR 0025 amended 2026-10-27), as Davis's Kitchen prototype plays it
# (docs/specs/cooking/kitchen-prototype.html). Staged by the Pipeline lane; the content ticket moves
# it to crates/twilight-realm/content/cooking.toml and src/cooking.rs loads it. Generated from the
# prototype and the realm's item entries on 2026-10-27, so every name below is the realm's.
#
# [eat]: a meal is eaten from the bags out of combat; one Well Fed buff at a time.
#   use_spell        the stock Spell.dbc spell every meal row names, so the client lets it be used:
#                    25695 "Food", whose description is empty, so the tooltip shows only the row's
#   buff_spell       the aura the client shows while Well Fed: stock 19705 "Well Fed" (its text is
#                    stock until the Well Fed effect list adds real spells)
#   minutes, legendary_minutes
# [tier]: bands (1, 10, 20, 30); a tier recipe's meal quality is tier + 1 (white to purple).
# [[effect]]: the 11 Well Fed effects. family combat (a stat), ooc (off in combat) or gather;
#   values = the strength at each tier, placeholders until the Well Fed effect list.
# [[kitchen]]: key, name, cook (the hub NPC entry whose gossip opens it), starters (recipe keys).
# [category]: a cooking herb's category, for orders and the pantry.
# [[recipe]]: key, kind (tier, dish, legend or plant), meal (its item), ingredients (item entries,
#   in any order). tier: effect and tier. dish: effect, tier (the band of the fish's level) and
#   teacher (the fish whose first catch teaches it). legend: teacher, and double = { stat,
#   stat_value, ooc, ooc_value } or unique = { key, params }. plant: teacher (first pick), stat, specials.
# [mush]: the miss: its item and its regen value.
# [[cut]]: fish, bait: 1 fish cuts into `count` of its bait at a kitchen.
# [orders]: kitchen orders, rolled per character at dawn (prototype rollOrders).
# [[item]]: the meal and cut bait rows, in content/items.toml's format.

