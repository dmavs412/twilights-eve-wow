[orders]
# The fish order: a named fish this often, else "N fish of any kind".
named_fish_chance = 0.6
named_fish_qty = [3, 6]            # a rare fish asks for 1 or 2
named_fish_copper = [20, 8]        # qty x (base + per_level x fish level) x (1 + rarity value)
any_fish_qty = [6, 10]
any_fish_copper = 30               # per fish
# The meal order: dishes with a herb of one category in them (from the recipes the character
# knows, or the kitchen's starters), band 10 or higher half the time from character level 10.
meal_qty = [2, 3]
meal_copper = [100, 10]            # qty x (base + per_level x character level) x (1 + band-10 flag)
# The herb order: raw cooking herbs of one category the character can reach.
herb_qty = [3, 5]
herb_copper = [15, 3]              # qty x (base + per_level x character level)
# One order in three also pays a bonus: a recipe Rumour or one rare ingredient, half and half.
bonus_chance = 0.3333
# A character's first Goldshire fish order.
first_order = { item = 960401, qty = 3, copper = 84 }
