details = "Corin worked my saw for eight years. His wife walked into the grey last winter, and in the spring he walked up that ridge in a robe. They told him the Hush was a god, and that she was with it. I'll pay to see that tower emptied. Kill ten acolytes on the ridge, and I'll give you a bounty, again whenever you like."
progress = "Have the acolytes been thinned?"
