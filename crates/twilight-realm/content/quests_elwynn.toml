# ── The Farmlands (#223) ─────────────────────────────────────────────────────────────────────
#
# The feud between the Stonefields and the Maclures is a setup: Morgan the Collector pays the
# Defias in Twilight coin to keep the farmers fighting. Ids and ranges follow
# docs/specs/elwynn-10-30.

# Dughan sends the Collector's letter, found in the strongbox, to Guard Thomas. XP only.
[[quest]]
id = 94201
kind = "story"
giver = 240
ender = 261
after = 94103
level = 12
title = "The Collector's Letter"
objectives = "Show the Collector's letter to Guard Thomas at the Stonefield and Maclure crossroads."
details = "The letter from the strongbox is addressed to the Collector, at Brackwell. I don't know the name, but a man who patrols the farm roads all day might. Guard Thomas stands at the crossroads between the Stonefield and Maclure farms. Show him the letter and hear what he says."
progress = "-"
completion = "Morgan. Aye, I know the name. He's been buying up the Stonefields' debt and the Maclures' both for a year, quietly, a note at a time. Neither family knows the other owes him too. Let me think on that."
money = 0
tokens = 0
zone_or_sort = 12

# Ma Stonefield wants her neighbours' boar dead. No quest comes before it. 300 copper.
[[quest]]
id = 94202
kind = "story"
giver = 244
level = 12
title = "Princess"
objectives = "Kill Princess in the Maclure vineyard and bring her collar back to Ma Stonefield."
details = "That sow of the Maclures has been rooting up my fields since spring, and no one will do a thing about it. They call her Princess, as if she were a pet. She is the size of a calf and she gores anyone who comes near. Kill her and bring me her collar, so the Maclures can't pretend they didn't know."
progress = "Is the pig dead yet?"
completion = "Look at the collar. That isn't a Maclure stamp. It's a mark I've seen on letters the postman wouldn't leave with me. The pig was a gift to the Maclures, and someone let her loose on my land. I'd like to know who."
money = 300
tokens = 0
zone_or_sort = 12
kill = [[330, 1]]
collect = [{ item = 980008, count = 1, from = [330], chance = 100 }]

# Thomas has the player carry the collar to both farms. Their replies carry the story.
# XP only.
[[quest]]
id = 94203
kind = "story"
giver = 261
after = [94201, 94202]
level = 13
title = "Mend the Fence"
objectives = "Show Princess's collar to Ma Stonefield and to Joshua Maclure, then return to Guard Thomas."
details = "Morgan holds both families' debts, and the pig wore his mark. I think someone has been keeping these two farms at each other's throats on purpose. Take the collar to Ma Stonefield and to Joshua Maclure, and watch what they say when they see it. If I'm right, they'll find they have more in common than a fence."
progress = "Did they see the collar?"
completion = "So the feud was bought. Each of them thought the other did it. Now they know better. I'll tell them to mend that fence together, and I'll hold Morgan to account if I can."
money = 0
tokens = 0
zone_or_sort = 12
talk = [
  { npc = 244, option = "Do you know this collar, Ma Stonefield?", reply = "That's Princess's collar, with the same stamp I found on it. Joshua Maclure's pig, I thought, and a spiteful thing to do. But the stamp isn't his. Whoever sold him that sow wanted her loose on my land. Joshua may know more than he thinks." },
  { npc = 258, option = "Do you know this collar, Joshua?", reply = "Princess's collar. I never wanted that sow. Someone gave her to me and said she'd be a fine pet, and then she broke out and tore up Ma Stonefield's fields. I paid for that, and I never knew why she ran. Whoever stamped this collar owes both of us an apology." },
]

