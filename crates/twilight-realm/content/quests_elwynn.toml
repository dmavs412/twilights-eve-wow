# ── Crystal Lake and Fargodeep (#224) ────────────────────────────────────────────────────────
#
# Fargodeep's kobolds were driven out of Jasperlode Mine by the cult. Narg's journal says so, and
# the murlocs at Crystal Lake looted the sealed door's keystone. Ids and ranges follow
# docs/specs/elwynn-10-30.

# Morgan's ledger listed ore from Fargodeep. An item quest with placeholder rewards until the gear
# pass: 600 copper and 3 Tokens, no choices.
[[quest]]
id = 94301
kind = "story"
giver = 240
after = 94204
level = 14
title = "Narg's Orders"
objectives = "Kill Narg the Taskmaster at the bottom of Fargodeep Mine and bring his journal to Marshal Dughan."
details = "Morgan's ledger lists ore from Fargodeep, shipped to the Defias by the cartload. The kobolds there answer to a taskmaster called Narg, who keeps his orders in a journal and his pick at the bottom of the mine. Kill him and bring me the journal. I want to know who told a kobold to dig for the Defias."
progress = "Has Narg's journal come into your hands yet?"
