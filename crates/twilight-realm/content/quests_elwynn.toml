# ── The Farmlands' bounties (#232) ───────────────────────────────────────────────────────────

[[quest]]
id = 94205
kind = "bounty"
giver = 261
level = 13
title = "Thugs in the Pumpkin Patch"
objectives = "Kill 10 Defias Thugs, then return to Guard Thomas."
details = "The Defias have made a camp of the Brackwell pumpkin patch, and old Bridenbecker can't tend his own field. He has no sons left to help him. One died at the Abbey, and the other walked west the week after and never came back. I can't leave the crossroads. You can. Put down ten thugs, and I'll pay a bounty each time you come back."
progress = "Are there still thugs in the patch?"
completion = "Ten fewer in the pumpkins. They'll send more, and I'll pay for those too."
money = 316
zone_or_sort = 12
kill = [[38, 10]]

[[quest]]
id = 94206
kind = "bounty"
giver = 258
level = 13
title = "Boars in the Vineyard"
objectives = "Kill 10 Stonetusk Boars, then return to Joshua Maclure."
details = "My boy joined the Watch last month. He says a man ought to guard something now that there's less of it to guard. So it's me, the vines and the boars, and the boars are winning. They come down every night and take more than they can eat. Kill ten Stonetusks, and I'll pay you for it, and again whenever you like."
progress = "Have the boars been thinned?"
completion = "Ten fewer boars. The vines may live through the season yet. Here's your coin. If you see my boy in Goldshire, tell him the vines are fine."
money = 286
zone_or_sort = 12
kill = [[113, 10]]

[[quest]]
id = 94207
kind = "bounty"
giver = 246
level = 13
title = "Pumpkins for Bernice"
objectives = "Gather 8 Ripe Pumpkins from the Brackwell patch, then return to Bernice Stonefield."
details = "For as long as anyone can remember, Stormwind ate Westfall's wheat. Now that Westfall's gone grey, the city eats whatever Elwynn grows, and the buyers are at the gate before anything is ripe. The Brackwell patch is the best we have left, but the Defias have run off the pickers. Bring me ripe pumpkins, whole ones, and I'll pay for every one."
progress = "Have you got my pumpkins?"
completion = "Good and heavy. Half go on the city cart, and half stay here. We've had eleven at the table since my sister walked in from Westfall with her boys. Come back when the patch has grown more."
