details = "The Defias took the vineyard's ledger and tore it into pages, and my pickers say they carry the pages around with them. That ledger is the only record of what the Kul Tiran buyers owe us for last year's casks. They'll never pay now, not with the sea gone. But it's the only proof that forty families worked a full year for something. Bring back five pages."
progress = "Have you found my pages?"
completion = "These aren't our figures. Someone has scraped ours off and written over them in a careful hand: wages, names and sums paid. Someone is keeping the Defias' accounts, and he's no thug."
money = 0
zone_or_sort = 12
collect = [{ item = 980039, count = 5, from = [38], chance = 60 }]

