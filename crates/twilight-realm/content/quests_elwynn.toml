title = "The Smugglers' Ledger"
objectives = "Destroy 6 Twilight Supply Caches around the dock, the farmhouse and the silo at Jerod's Landing, then return to Marshal Dughan."
details = "Dobbs's ledger and Vael's notes tell the same story from two ends. Jerod's Landing is where the cult stores what it takes out of Elwynn before it goes upriver. Ore from Fargodeep, timber from Eastvale, pumpkins from the Farmlands and relics from the Abbey. Each cache is someone's work, taken from someone who needed it. Go to the Landing and break open six of them, and be quick about it. The smugglers rebuild."
progress = "Are the caches broken?"
completion = "Ore, timber, pumpkins and relics, every one stolen from a farm or a family I know by name. Six caches fewer, and the dock goes quiet for a night. Thank you."
money = 0
choices = [903070, 903071, 903072]
zone_or_sort = 12
use = [[980109, 6]]

