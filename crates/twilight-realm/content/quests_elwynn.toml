# ── Eastvale and Ridgepoint (#226) ───────────────────────────────────────────────────────────
#
# Where the cult stops hiding. Defias looters strip the logging camp for scaffolding timber, and
# Ridgepoint Tower flies the black-sun banner in daylight. Open world: no Phase, no Portal.

# Raelen sends the player after the overseer who ships the camp's timber. 600 copper.
[[quest]]
id = 94701
kind = "story"
giver = 10616
level = 21
title = "Timber for the Pit"
objectives = "Kill Defias Overseer Hadrik at the lumber mill and bring his manifest back to Supervisor Raelen."
details = "Half of what this camp cuts goes out on a Defias cart, and the city gets the rest. I've stopped asking why. The loads are cut to scaffold lengths, which are no use to a farmer or a shipwright, not that anyone is building ships. Their overseer, Hadrik, works the east sawmill and keeps a manifest of every load. Kill him and bring me that paper."
progress = "Has Hadrik's manifest come to hand?"
completion = "Scaffold lengths, every one, addressed to the Landing, for the pit. A pit with scaffolding is a dig, and a dig at Jerod's Landing is no Defias business. Here's your coin. Keep your eyes on the ridge."
money = 600
