# ── Goldshire's bounties (#231) ──────────────────────────────────────────────────────────────

[[quest]]
id = 94105
kind = "bounty"
giver = 963
level = 12
title = "Prowlers on the Road"
objectives = "Kill 10 Prowlers or Forest Spiders near Goldshire, then return to Deputy Rainer."
details = "Every week more people walk out of Stormwind looking for farm work, and they walk the forest road with nothing but a bundle and their children. Prowlers drag off the stragglers' goats, and the forest spiders make the road deadly after dark. I can't put a guard on every mile of it. Thin them out, and I'll pay a bounty each time. Prowlers or spiders, either will do."
progress = "Is the road any safer?"
completion = "Ten fewer teeth on the road. They'll creep back. They always do. My coin will be waiting when they do."
money = 260
zone_or_sort = 12
kill = [[118, 10], [30, 10]]

[[quest]]
id = 94106
kind = "bounty"
giver = 514
level = 12
title = "Silk for the Smith"
objectives = "Bring 8 Forest Spider Silk to Smith Argus."
details = "My bellows rope was Kul Tiran hemp, and the last ship that carried any never came back. Spider silk makes a better rope than hemp ever did, and the forest is full of spiders. Bring me silk, eight at a time, and I'll pay you fairly for the trouble. Mind the bites."
progress = "Have you got that silk?"
completion = "Strong stuff. That will keep my forge breathing through the week. Come back when you have more."
money = 280
zone_or_sort = 12
collect = [{ item = 980006, count = 8, from = [30], chance = 50 }]

[[quest]]
id = 94107
kind = "bounty"
giver = 963
level = 13
title = "Bandits on the Stormwind Road"
objectives = "Kill 10 Defias Bandits, then return to Deputy Rainer."
details = "The bandits on the Stormwind road used to rob merchants. There aren't many merchants left, so now they rob families carrying everything they own. Yesterday I watched a woman hand over her husband's wedding ring, and I was too far away to do a thing about it. Every bandit you put down is one fewer on that road. The bounty stands as long as there are bandits to hunt."
progress = "Are there still plenty of bandits about?"
completion = "Ten fewer bandits. If only there weren't always ten more. Here's your share."
money = 316
zone_or_sort = 12
kill = [[116, 10]]

[[quest]]
id = 94108
kind = "bounty"
giver = 241
level = 12
title = "Gold Dust for Remy"
objectives = "Bring 8 Gold Dust from Kobold Vermin and Kobold Tunnelers to Remy \"Two Times\"."
details = "The kobolds at the edge of Fargodeep dig up flecks of gold and don't know what to do with them. I do. Everyone in Goldshire is selling, and nobody is buying anything but gold. When the world gets smaller, gold gets heavier. Bring me the dust, eight at a time, and I'll make it worth your while. Twice, if you're quick about it."
progress = "Have you got my dust?"
completion = "Pure enough. Don't ask where it goes. Come back when you have more, and I'll pay you again."
money = 290
zone_or_sort = 12
collect = [{ item = 980007, count = 8, from = [6, 475], chance = 50 }]

# ── The Farmlands (#223) ─────────────────────────────────────────────────────────────────────
#
# The feud between the Stonefields and the Maclures is a setup: Morgan the Collector pays the
# Defias in Twilight coin to keep the farmers fighting. Ids and ranges follow
# docs/specs/elwynn-10-30.

# Dughan sends the Collector's letter, found in the strongbox, to Guard Thomas. XP only.
[[quest]]
id = 94201
kind = "story"
giver = 240
ender = 261
after = 94103
level = 12
title = "The Collector's Letter"
objectives = "Show the Collector's letter to Guard Thomas at the Stonefield and Maclure crossroads."
details = "The letter from the strongbox is addressed to the Collector, at Brackwell. I don't know the name, but a man who walks the farm roads all day might. Guard Thomas stands at the crossroads between the Stonefield and Maclure farms. Show him the letter, and hear what he says."
progress = "-"
completion = "Morgan. Aye, I know the name. He's spent the past year buying the debts of every farm that's struggling, and since the crown fixed the price of grain, that's every farm. The Stonefields owe him, and so do the Maclures. Neither family knows the other owes him too. Let me think on that."
money = 0
choices = [903010, 903011, 903012]
zone_or_sort = 12

# Ma Stonefield wants her neighbours' boar dead. No quest comes before it. 300 copper.
[[quest]]
id = 94202
kind = "story"
giver = 244
level = 12
title = "Princess"
objectives = "Kill Princess in the Maclure vineyard and bring her collar back to Ma Stonefield."
details = "Since the Westfall families came over the ridge, every acre in Elwynn has three people wanting it. I can't spare a single row of turnips, and the Maclures' sow has rooted up half of them since spring. They call her Princess. She's the size of a calf, and she gores anyone who comes near her. Kill her and bring me her collar, so the Maclures can't pretend they didn't know."
progress = "Is that pig dead yet?"
completion = "That's no Maclure stamp on this collar. It's the same mark that's on the letters about our debt, the ones the postman won't leave with me. Someone gave that sow to the Maclures and turned her loose on my land, and I'd like to know who."
money = 300
choices = [903013, 903014, 903015]
zone_or_sort = 12
kill = [[330, 1]]
collect = [{ item = 980008, count = 1, from = [330], chance = 100 }]

# Thomas has the player carry the collar to both farms. Their replies carry the story.
# XP only.
[[quest]]
id = 94203
kind = "story"
giver = 261
after = [94201, 94202]
level = 13
title = "Mend the Fence"
objectives = "Show Princess's collar to Ma Stonefield and to Joshua Maclure, then return to Guard Thomas."
details = "Morgan holds both families' debts, and the pig wore his mark. I think someone has kept these two farms at each other's throats on purpose. Take the collar to Ma Stonefield and to Joshua Maclure, and watch their faces when they see it. If I'm right, they'll find they have more in common than a fence."
progress = "Did they see the collar?"
completion = "So the feud was bought. Each of them thought the other had done it, and now they know better. There's too little land left in this world to waste it fighting over a fence. I'll tell them to mend it together, and I'll hold Morgan to account if I can."
money = 0
choices = [903016, 903017, 903018]
zone_or_sort = 12
talk = [
  { npc = 244, option = "Do you know this collar, Ma Stonefield?", reply = "That's Princess's collar, with the stamp I showed you. I thought Joshua Maclure set his pig on me out of spite. But the stamp isn't his. Whoever gave him that sow wanted her loose on my land. Joshua may know more than he thinks." },
  { npc = 258, option = "Do you know this collar, Joshua?", reply = "That's Princess's collar. I never wanted that sow. A man gave her to me and said she'd make a fine pet, and then she broke out and tore up Ma Stonefield's fields. I paid for every row, and I never knew why she ran. Whoever stamped this collar owes us both an apology." },
]

