title = "Eyes on the Ridge"
objectives = "Reach the three overlooks above Ridgepoint Tower without being seen, then return to Supervisor Raelen with Dughan's letter."
details = "Dughan's letter says the signpost points at Ridgepoint Tower, the old Alliance watch. My father stood watch there when I was young. I need to know what flies from it now. Go up to the north, east and south overlooks and look. Don't fight anything on the way. If they see you, the cult will know we know, and the whole ridge will be shut to us."
progress = "What do you see on the tower?"
completion = "Black-sun banners on the walls, in daylight, on an Alliance watchtower. Three or four of them, by your count, and nobody on the road thought to look up. My father would have wept. Thank you for not being seen."
money = 0
