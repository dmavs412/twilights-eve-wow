# ── Mirror Lake and Jerod's Landing (#226) ───────────────────────────────────────────────────
#
# Jerod's Landing is the cult's supply line out of Elwynn, and the pit in its barn is their second
# dig. Mirror Lake is the approach, held by Riverpaw gnolls. Open world: no Phase, no Portal.

# Remy's biggest debtor skipped town the night the Abbey fell. Dobbs takes it. XP only.
[[quest]]
id = 94801
kind = "story"
giver = 241
ender = 190065
after = 94102
level = 23
title = "Remy's Last Debtor"
objectives = "Find Dobbs, Remy's debtor, on the dock at Jerod's Landing."
details = "The man who owes me the most skipped town the night the Abbey fell. Dobbs is his name. He left his coat on my counter with a year of my bills in the pocket. I hear he's on the dock at Jerod's Landing now, among men I wouldn't drink with. I don't care about the money anymore. Dobbs drank at my counter for twenty years, and I want to know what he's mixed up in."
progress = "Did you find Dobbs?"
completion = "Remy sent you? Then either I'm forgiven or I'm a dead man, and I can't tell which. My wife took our girl to her mother's in Sentinel Hill the week before Westfall went, and I haven't had a letter since. These men pay me to write down every crate they load, and every crate goes upriver. Take what I know to Dughan. I've no one left to keep it for."
money = 0
choices = [903067, 903068, 903069]
zone_or_sort = 12

# Dughan sends the player to destroy six of the smugglers' stolen caches. XP only.
[[quest]]
id = 94802
kind = "story"
giver = 240
