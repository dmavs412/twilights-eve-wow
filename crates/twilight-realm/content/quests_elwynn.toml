details = "A grizzly hide makes the best apron a sawyer can wear. Mine has lasted twenty years, but the new men came to me with nothing. Clerks, a cooper and a dockhand who'd never held an axe. Bring me eight hides, and I'll pay for the lot."
progress = "Have you got the hides?"
completion = "Thick hides, and good ones. The new men can stop complaining about splinters. Come back for more."
money = 629
