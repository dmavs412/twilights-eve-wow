# Story Quests in Elwynn Forest (#85): the same schema as quests.toml, kind "story".

# ── Echo Ridge Mine and the Idol (#85) ───────────────────────────────────────────────────────
#
# The spec named these 92001 and 92002; Wailing Caverns' quests in quests.toml already hold
# those ids, so they are 94001 and 94002.

# Begun by the Smoldering Twilight Idol, which Geomancer Vurx drops; Marshal McBride on the Abbey
# steps takes it in.
[[quest]]
id = 94001
kind = "story"
giver = "item"
ender = 197
level = 7
title = "The Idol in the Deep"
choices = [900414, 900415, 900416]
objectives = "Bring the Smoldering Twilight Idol to Marshal McBride on the steps of Northshire Abbey."
details = "The idol is warm to the touch, though no fire burns near it. Dark wax has run down its sides and hardened, and something beneath it pulses like a slow heartbeat. The kobold who carried it wasn't digging for candles. Someone was paying him to dig. Marshal McBride, on the steps of the Abbey, should see this."
progress = "You've found something. I can see it on your face. Out with it."
completion = "I've seen that mark once before. It was painted on the undercroft door the morning after the Abbey fell, and the paint was still wet. Kobolds don't dig toward an abbey by chance. That mine runs under our feet, and whatever took the Abbey came up through the floor."
money = 0
zone_or_sort = 12
collect = [{ item = 980001, count = 1 }]

# McBride's next step: finding Brother Neals inside the Abbey is the task.
[[quest]]
id = 94002
kind = "story"
giver = 197
ender = 952
after = 94001
level = 8
title = "Into the Abbey"
choices = [900400, 900401, 900402, 900403]
objectives = "Find Brother Neals inside Northshire Abbey."
details = "We lost the Abbey in a single night, and until now we didn't know how. Brother Neals was at vespers when it fell, and no one has seen him come out. If any of the brothers lived, he's the one stubborn enough to have managed it. Go in through the front doors and find him. Then find out what's down there."
progress = "-"
completion = "Light be praised, a living face! They came up through the undercroft, chanting, and the candles never went out. Not once, not even with the doors thrown open. I've hidden by this stair for days. Listen to me. Whatever they're doing below, it isn't finished."
money = 0
zone_or_sort = 12

# ── Garrick Padfoot ──────────────────────────────────────────────────────────────────────────
#
# Once per character: Marshal McBride wants the elite Defias leader in the vineyards dead, and
# pays in one of Garrick's own weapons, one for each kind of fighter.
[[quest]]
id = 94003
kind = "story"
giver = 197
level = 10
title = "Padfoot's End"
objectives = "Kill Garrick Padfoot in the Northshire Vineyards, then return to Marshal McBride."
details = "The Defias in the vineyards answer to one man, Garrick Padfoot. He ran with the Brotherhood in Westfall, and he was east on business the week the Hush took it. Every friend he had is on the other side of the grey, and he's taken it out on my valley ever since. He's put more of my guards in the infirmary than the kobolds have. Bring him down, and you can have your pick of his hoard. Don't go alone if you can help it."
progress = "Is Padfoot still breathing?"
completion = "Padfoot's dead? Then the vineyards are ours again. I almost pity him. He lost everything, and all he could think to do was take from people who had a little left. He kept a fine stash for a thief. Take whichever suits your hand. You've earned it."
money = 500
zone_or_sort = 12
kill = [[103, 1]]
choices = [900101, 900102, 900103, 900104]

# ── The Abbot's Fall (#94) ───────────────────────────────────────────────────────────────────
#
# Brother Neals's next step after Into the Abbey: the Abbot at the top of the bell tower. Pays one of three choices.
[[quest]]
id = 94004
kind = "story"
giver = 952
ender = 952
after = 94002
level = 10
title = "The Abbot's Fall"
choices = [900520, 900521, 900522]
objectives = "Kill Abbot Ashworth at the top of the bell tower, then return to Brother Neals."
details = "It was the Abbot who let them in. He opened the undercroft himself and stood with them while they chanted. For a year he preached that the grey was the Light's mercy, closing the world gently, like a hand over a dying man's eyes. I thought it was grief talking. Now he keeps the bell tower, and when he rings that bell, the brothers he turned come running. Climb the stair and end it. I'll pray for what's left of him."
progress = "The bell. I keep hearing the bell."
completion = "Then it's quiet up there at last. Light forgive him, and forgive me for being glad. He taught me my letters, you know. Whatever they were digging for, they'll have to dig without him."
money = 0
zone_or_sort = 12
kill = [[96005, 1]]

# ── Northshire's bounties (#96, #98) ─────────────────────────────────────────────────────────
#
# Bounties: taken again as soon as they are handed in, offered from the Tier of their level, and
# paid half a level's XP and copper. The givers are the vanilla NPCs at their usual spots. Copper amounts are placeholders.

[[quest]]
id = 94005
kind = "bounty"
giver = 196
level = 3
title = "Wolves at the Fold"
objectives = "Kill 10 Young Wolves or Timber Wolves in Northshire Valley, then return to Eagan Peltskinner."
details = "There are more wolves every season, and they aren't ours. They come in thin and hungry from the west, out of the hills above Westfall, where my brother kept sheep before the Hush took it. Whatever is over there, they won't stay near it, so they come here, to my fold. I'll pay for every pack you thin, young or timber. It's all the same to me."
progress = "Are they still out there? I haven't slept through a night in weeks."
completion = "That will buy the fold a few quiet nights. More will come. They have nowhere else to go, the same as the rest of us. My coin will be here when they do."
money = 121
zone_or_sort = 12
kill = [[299, 10], [69, 10]]

[[quest]]
id = 94006
kind = "bounty"
giver = 196
level = 4
title = "Pelts for Peltskinner"
objectives = "Bring 8 Northshire Wolf Pelts to Eagan Peltskinner."
details = "The quartermaster in Goldshire buys every pelt I send him, and his price climbs every month. Our furs used to come down from Dun Morogh, but that road ends in grey now, and no one who has walked it has come back. Either Elwynn's wolves keep the Watch warm this winter, or nothing does. Bring me their pelts, whole if you can manage it."
progress = "Any pelts for me?"
completion = "Good, thick hides. That's a few more men warm at the gate this winter. Here is your share."
money = 135
zone_or_sort = 12
collect = [{ item = 980002, count = 8, from = [299, 69], chance = 50 }]

[[quest]]
id = 94007
kind = "bounty"
giver = 823
level = 5
title = "Vermin at Echo Ridge"
objectives = "Kill 10 Kobold Vermin or Kobold Workers at Echo Ridge Mine, then return to Deputy Willem."
details = "I've been a deputy for six weeks. Everyone with more years than me went to the city when the king's ship didn't come home, so now it's me watching Echo Ridge. The kobolds are digging faster than ever, and they're digging in a straight line, toward the Abbey. Kobolds never dig straight. The Marshal's posted a standing bounty. Vermin or workers, they all count."
progress = "Are they still digging out there?"
completion = "That will slow them down. It won't stop them, mind. Come back when they've dug a few more holes, and I'll have the bounty ready."
money = 158
zone_or_sort = 12
kill = [[6, 10], [257, 10]]

[[quest]]
id = 94008
kind = "bounty"
giver = 197
level = 7
title = "Thugs in the Vineyards"
objectives = "Kill 10 Defias Thugs in the Northshire Vineyards, then return to Marshal McBride."
details = "Half the thugs in those vineyards picked grapes in the same rows last summer. There's no wine trade with the ships gone, so there are no wages, and the Defias pay. I can't blame a man for eating, but I can't let him rob the valley either. I can't spare the guards, but I can spare the coin. There's a bounty on every thug you bring down, as often as you care to collect it."
progress = "Are the vineyards still crawling with Defias?"
completion = "Ten fewer thieves. Padfoot will find more. As long as there's no work, there will always be hungry men. My bounty will be here when he does."
money = 206
zone_or_sort = 12
kill = [[38, 10]]

# ── Abbey Relics (#96, #98) ──────────────────────────────────────────────────────────────────
#
# The Abbey's repeatable, levels 6 to 15, with no chain before it. Its relics drop by rank: a
# Corrupted Brother's at 35%, a Twilight Disciple's always, and the Abbot carries three.
[[quest]]
id = 94009
kind = "repeatable"
giver = 197
level = 10
title = "Abbey Relics"
objectives = "Recover 10 Twilight Relics from the Abbey's corrupted brothers and their masters, then return to Marshal McBride."
details = "Every brother they turned carries some trinket of theirs: a wax-sealed charm, a carved stone, a candle that won't go out. The disciples carry more. I want all of it out of the Abbey and burned. The brothers' families still come to the gate every morning, asking whether there's news. I'd like to be able to tell them the place is clean. Bring me what you find, and keep bringing it."
progress = "More of their filth, I hope?"
completion = "Into the fire with the rest. Each one we burn is one they can't use. Come back when the Abbey has filled up again."
money = 500
zone_or_sort = 12
collect = [{ item = 980003, count = 10, sources = [{ from = [96003], chance = 35 }, { from = [96004], chance = 100 }, { from = [96005], chance = 100, count = 3 }] }]

# ── Goldshire (#223) ─────────────────────────────────────────────────────────────────────────
#
# Marshal Dughan does not yet believe McBride's cult story, so the story quests send the player
# to talk before they send it to fight. Ids and ranges follow docs/specs/elwynn-10-30.

# McBride writes down what happened in the Abbey and hands the player the sealed report when the
# quest is taken; Dughan takes it. XP only.
[[quest]]
id = 94101
kind = "story"
giver = 197
ender = 240
after = 94004
level = 10
title = "McBride's Report"
objectives = "Carry Marshal McBride's sealed report to Marshal Dughan in Goldshire."
details = "It's all here: the idol in the undercroft, the robed men, and the Abbot ringing the bell to let them in. I've sent three riders to Stormwind since the Abbey fell, and not one has returned with an answer. Dughan is closer, and he can't claim he never received it. Put this in his hands and no one else's."
progress = "Have you got the report for Marshal Dughan?"
completion = "McBride's seal. A cult, he writes, with the Abbot ringing the bell for them. Brother Sammuel heard confessions in that Abbey for thirty years. I've had Defias in my fields since spring, and the Defias I understand. I'll read every word, but don't ask me to believe all of it."
money = 0
choices = [903000, 903001, 903002]
zone_or_sort = 12
gives = [[980004, 1]]
collect = [{ item = 980004, count = 1 }]

# Dughan wants proof before he raises an alarm: three townsfolk asked about the hammer-and-black-sun
# mark. Each reply carries one clue. XP only.
[[quest]]
id = 94102
kind = "story"
giver = 240
after = 94101
level = 11
title = "The Marshal's Doubt"
objectives = "Ask Innkeeper Farley, Smith Argus and Remy \"Two Times\" whether they have seen the hammer-and-black-sun mark, then return to Marshal Dughan."
details = "One idol and one frightened marshal's word. That isn't enough to rouse the Stormwind garrison, and it isn't enough for me. Ask around Goldshire. Farley hears everything that passes through the inn, Argus knows who buys his ore, and Remy knows who owes what. If that mark has been seen here, one of them has seen it."
progress = "Well? Has anyone in town seen that mark?"
completion = "A crate off a wrecked cart. Strangers buying ore by the cartload. A debtor who ran the very night the Abbey fell. That's three things I can't wave away. It's still a Defias matter, mind. But it's a matter."
money = 0
choices = [903003, 903004, 903005]
zone_or_sort = 12
talk = [
  { npc = 295, option = "Have you seen a hammer-and-black-sun mark?", reply = "That mark? Aye, I've seen it. It was on a crate that fell off a cart wrecked on the Stormwind road a week back. Nobody came for the crate, and nobody will say what was in it. I'd have gone to look myself, but I have families sleeping on my common-room floor, and someone has to feed them." },
  { npc = 514, option = "Has anyone been buying ore with a strange mark on it?", reply = "Strangers, buying ore by the cartload and paying in coin I've never seen the like of. Since the tram to Ironforge stopped running, every smith in the city has been begging for iron, and these men want raw ore instead. They won't say what they're building. I don't ask, and I don't sell them my good iron." },
  { npc = 241, option = "Have you seen a hammer-and-black-sun mark, Remy?", reply = "A mark like that? Can't say I have. But my biggest debtor skipped town the night the Abbey fell, and he left without his coat. I don't take that for a coincidence." },
]

# Farley sends the player to the cart; Dughan takes the strongbox in. 4 silver.
[[quest]]
id = 94103
kind = "story"
giver = 295
ender = 240
after = 94102
level = 12
title = "The Wrecked Cart"
objectives = "Recover the Sealed Strongbox from the Defias Highwayman at the wrecked cart on the Stormwind road, then take it to Marshal Dughan."
details = "The crate I told the Marshal about came off a cart that wrecked north of here on the Stormwind road. Now a Defias highwayman has camped beside it, and he's guarding something. Nobody guards an empty crate. Take whatever he's sitting on to the Marshal. I'd go myself, but the soup won't stir itself, and there are thirty mouths waiting on it."
progress = "Did you find that strongbox?"
completion = "Coin I've never seen before, and a letter addressed to the Collector, at Brackwell. The Defias don't pay in this coin. South, then. I'll keep an eye on Brackwell."
money = 400
choices = [903006, 903007, 903008, 903009]
zone_or_sort = 12
