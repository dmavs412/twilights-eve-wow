# Story Quests in Elwynn Forest (#85): the same schema as quests.toml, kind "story".

# ── Echo Ridge Mine and the Idol (#85) ───────────────────────────────────────────────────────
#
# The spec named these 92001 and 92002; Wailing Caverns' quests in quests.toml already hold
# those ids, so they are 94001 and 94002.

# Begun by the Smoldering Twilight Idol, which Geomancer Vurx drops; Marshal McBride on the Abbey
# steps takes it in.
[[quest]]
id = 94001
kind = "story"
giver = "item"
ender = 197
level = 7
title = "The Idol in the Deep"
objectives = "Bring the Smoldering Twilight Idol to Marshal McBride on the steps of Northshire Abbey."
details = "The idol is warm to the touch, though no fire burns near it. Twilight wax has run down its sides and hardened, and something pulses beneath it like a slow heartbeat. The kobold who carried it wasn't digging for candles. Someone was paying him to dig. Marshal McBride at the Abbey should see this."
progress = "You've got something there, haven't you? Out with it."
completion = "Twilight's Hammer. I'd hoped never to see that mark this side of the mountains. Kobolds don't dig toward an abbey by chance. That mine runs under our feet, and whatever took the Abbey came up through the floor."
money = 0
tokens = 0
zone_or_sort = 12
collect = [{ item = 980001, count = 1 }]

# McBride's next step: finding Brother Neals inside the Abbey is the task.
[[quest]]
id = 94002
kind = "story"
giver = 197
ender = 952
after = 94001
level = 8
title = "Into the Abbey"
objectives = "Find Brother Neals inside Northshire Abbey."
details = "We lost the Abbey in a night, and we never knew how. Now we do. Brother Neals was at vespers when it fell, and no one has seen him come out. If any of the brothers lived, he'd be the one stubborn enough to. Go in through the front doors, find him, and find out what's down there."
progress = "-"
completion = "Light be praised, a living face! They came up through the undercroft, chanting, and the candles never went out. I've hidden by this stair for days. Listen. What they're doing below isn't finished."
money = 0
tokens = 0
zone_or_sort = 12

# ── Garrick Padfoot ──────────────────────────────────────────────────────────────────────────
#
# Once per character: Marshal McBride wants the elite Defias leader in the vineyards dead, and
# pays in one of Garrick's own weapons, one for each kind of fighter.
[[quest]]
id = 94003
kind = "story"
giver = 197
level = 10
title = "Padfoot's End"
objectives = "Kill Garrick Padfoot in the Northshire Vineyards, then return to Marshal McBride."
details = "The Defias in the vineyards answer to one man: Garrick Padfoot. He's no common cutpurse. He's put more of my guards in the infirmary than the kobolds have, and he keeps what he takes. Bring him down, and you can have your pick of his hoard. Don't go alone if you can help it."
progress = "Padfoot still breathing?"
completion = "Padfoot's dead? Then the vineyards are ours again. He kept a fine stash for a thief. Take whichever suits your hand. You've earned it."
money = 500
tokens = 0
zone_or_sort = 12
kill = [[103, 1]]
choices = [900101, 900102, 900103, 900104]

# ── The Abbot's Fall (#94) ───────────────────────────────────────────────────────────────────
#
# Brother Neals's next step after Into the Abbey: the Abbot at the top of the bell tower. XP only.
[[quest]]
id = 94004
kind = "story"
giver = 952
ender = 952
after = 94002
level = 10
title = "The Abbot's Fall"
objectives = "Kill Abbot Ashworth at the top of the bell tower, then return to Brother Neals."
details = "It was the Abbot who let them in. He opened the undercroft himself and stood with them while they chanted. Now he keeps the bell tower, and when he rings that bell the brothers he turned come running. Climb the stair and end him. I'll pray for what's left of him."
progress = "The bell. I keep hearing the bell."
completion = "Then it's quiet up there at last. Light forgive him, and forgive me for being glad. Whatever they were digging for, they'll have to dig without him."
money = 0
tokens = 0
zone_or_sort = 12
kill = [[96005, 1]]

# ── Northshire's bounties (#96, #98) ─────────────────────────────────────────────────────────
#
# Bounties: taken again as soon as they are handed in, offered only between `min_level` and
# `max_level`, and paid half a level's XP, unshrunk anywhere in the range, a Token and a little
# copper. The givers are the vanilla NPCs at their usual spots. Copper amounts are placeholders.

[[quest]]
id = 94005
kind = "bounty"
giver = 196
level = 3
min_level = 1
max_level = 5
title = "Wolves at the Fold"
objectives = "Kill 10 Young Wolves or Timber Wolves in Northshire Valley, then return to Eagan Peltskinner."
details = "The wolves have grown bold since the Abbey went dark. They come right up to the fences now, and my pens won't hold forever. I'll pay a bounty on every pack you thin. Young ones or timber, it makes no difference to me."
progress = "The wolves still howling out there?"
completion = "That'll quiet them for a night or two. They'll be back; they always come back. So will my coin, if you will."
money = 50
tokens = 1
zone_or_sort = 12
kill = [[299, 10], [69, 10]]

[[quest]]
id = 94006
kind = "bounty"
giver = 196
level = 4
min_level = 2
max_level = 6
title = "Pelts for Peltskinner"
objectives = "Bring 8 Northshire Wolf Pelts to Eagan Peltskinner."
details = "A pelt's a pelt, and the quartermaster in Goldshire pays for every one I send. Trouble is, I can't skin what I can't catch. Bring me wolf pelts, whole ones if you can manage it, and I'll pay you a fair cut."
progress = "Got any pelts for me?"
completion = "Good, thick hides. These'll keep someone warm come winter. Here's your share."
money = 60
tokens = 1
zone_or_sort = 12
collect = [{ item = 980002, count = 8, from = [299, 69], chance = 50 }]

[[quest]]
id = 94007
kind = "bounty"
giver = 823
level = 5
min_level = 3
max_level = 7
title = "Vermin at Echo Ridge"
objectives = "Kill 10 Kobold Vermin or Kobold Workers at Echo Ridge Mine, then return to Deputy Willem."
details = "The kobolds at Echo Ridge are digging faster than ever, and now we know who's paying them. Every one you put down is one less shovel pointed at the Abbey. The Marshal's posted a standing bounty. Vermin or workers, they all count."
progress = "Still digging out there, are they?"
completion = "That'll slow them. It won't stop them, mind. Come back when they've dug a few more holes."
money = 80
tokens = 1
zone_or_sort = 12
kill = [[6, 10], [257, 10]]

[[quest]]
id = 94008
kind = "bounty"
giver = 197
level = 7
min_level = 5
max_level = 9
title = "Thugs in the Vineyards"
objectives = "Kill 10 Defias Thugs in the Northshire Vineyards, then return to Marshal McBride."
details = "The Defias in the vineyards think we're too busy with the Abbey to bother with them. They're half right. I can't spare the guards, but I can spare the coin. A bounty on every thug you bring down, as often as you care to collect."
progress = "The vineyards still crawling with Defias?"
completion = "Ten fewer thieves. Padfoot will find more; desperate men are never in short supply. Neither is my bounty."
money = 120
tokens = 1
zone_or_sort = 12
kill = [[38, 10]]

# ── Abbey Relics (#96, #98) ──────────────────────────────────────────────────────────────────
#
# The Abbey's repeatable, levels 6 to 15, with no chain before it. Its relics drop by rank: a
# Corrupted Brother's at 35%, a Twilight Disciple's always, and the Abbot carries three.
[[quest]]
id = 94009
kind = "repeatable"
giver = 197
level = 10
min_level = 6
max_level = 15
title = "Abbey Relics"
objectives = "Recover 10 Twilight Relics from the Abbey's corrupted brothers and their masters, then return to Marshal McBride."
details = "Every one of the brothers they turned carries some trinket of theirs, a wax-sealed charm, a carved stone, a candle that won't go out. The disciples carry more. I want them out of the Abbey and burned. Bring me what you find, and keep bringing it until that place is clean."
progress = "More of their filth, I hope?"
completion = "Into the fire with the rest. Each one we burn is one they can't use. Come back when the Abbey's filled up again."
money = 200
tokens = 3
zone_or_sort = 12
collect = [{ item = 980003, count = 10, sources = [{ from = [96003], chance = 35 }, { from = [96004], chance = 100 }, { from = [96005], chance = 100, count = 3 }] }]

# ── Goldshire (#223) ─────────────────────────────────────────────────────────────────────────
#
# Marshal Dughan does not yet believe McBride's cult story, so the story quests send the player
# to talk before they send it to fight. Ids and ranges follow docs/specs/elwynn-10-30.

# McBride writes down what happened in the Abbey and hands the player the sealed report when the
# quest is taken; Dughan takes it. XP only.
[[quest]]
id = 94101
kind = "story"
giver = 197
ender = 240
after = 94004
level = 10
title = "McBride's Report"
objectives = "Carry Marshal McBride's sealed report to Marshal Dughan in Goldshire."
details = "I've written down everything: the idol, the undercroft, the Abbot at the bell. Dughan keeps the peace in Goldshire, and he's the one who has to act on this. Take the road south and put the report in his hands and no one else's. He won't thank you for the news."
progress = "Have you got the report for Marshal Dughan?"
completion = "McBride's seal. So he finally put it all on paper. A cult under the Abbey and an Abbot turned traitor. I'll read every word. Don't expect me to believe all of it."
money = 0
tokens = 0
zone_or_sort = 12
gives = [[980004, 1]]
collect = [{ item = 980004, count = 1 }]

# Dughan wants proof before he raises an alarm: three townsfolk asked about the hammer-and-black-sun
# mark. Each reply carries one clue. XP only.
[[quest]]
id = 94102
kind = "story"
giver = 240
after = 94101
level = 11
title = "The Marshal's Doubt"
objectives = "Ask Innkeeper Farley, Smith Argus and Remy \"Two Times\" whether they have seen the hammer-and-black-sun mark, then return to Marshal Dughan."
details = "One idol and one frightened marshal's word. That's not enough to rouse the Stormwind garrison, and it's not enough for me. Go and ask around Goldshire. Farley hears everything that passes through the inn, Argus sees who buys his ore, and Remy knows who owes what. If that mark has been seen here, one of them has seen it."
progress = "Well? Did anyone in town see that mark?"
completion = "A crate off a wrecked cart. Strangers buying ore by the cartload. A debtor who left the very night the Abbey fell. Three things I can't wave away. It's still a Defias matter, mind. But it's a matter."
money = 0
tokens = 0
zone_or_sort = 12
talk = [
  { npc = 295, option = "Have you seen a hammer-and-black-sun mark?", reply = "That mark? Aye, I saw it. On a crate off a cart that wrecked itself on the Stormwind road, a week back. Nobody came for the crate, and nobody wants to say what was in it." },
  { npc = 514, option = "Has anyone been buying ore with a strange mark on it?", reply = "Strangers, buying ore in bulk and paying in coin I've never seen the like of. They won't say what they're building. I don't ask, and I don't sell them my good iron." },
  { npc = 241, option = "Have you seen a hammer-and-black-sun mark, Remy?", reply = "A mark like that? Can't say I have. But my biggest debtor skipped town the night the Abbey fell, and he left without his coat. I don't take that for a coincidence." },
]

# Farley sends the player to the cart; Dughan takes the strongbox in. 4 silver.
[[quest]]
id = 94103
kind = "story"
giver = 295
ender = 240
after = 94102
level = 12
title = "The Wrecked Cart"
objectives = "Recover the Sealed Strongbox from the Defias Highwayman at the wrecked cart on the Stormwind road, then take it to Marshal Dughan."
details = "That crate I told the Marshal about came off a cart that wrecked itself north on the Stormwind road. Now a Defias highwayman has taken up camp beside it, and he's guarding something. Crates don't need guarding unless there's something in them. Bring me what he's sitting on, or rather, bring it to the Marshal."
progress = "Did you find that strongbox?"
completion = "Twilight coin, and a letter addressed to the Collector, Brackwell. The Defias don't pay in this coin. South, then. I'll have my eye on Brackwell."
money = 400
tokens = 0
zone_or_sort = 12
collect = [{ item = 980005, count = 1, from = [96011], chance = 100 }]

