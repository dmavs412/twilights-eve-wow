# The Hub's friendly NPCs, written by hand: they live in the Crossroads and stream in and out
# with the player's view, as the mobs do. Each stands where a person living there would: Barg in
# the inn (the innkeeper's place by the bar is left free), Sarna at its door, each quest giver at
# the gate or tower that looks out on their Hunting Ground, the four Tier 1 trainers in the
# training yard, and the townsfolk at the gates, the
# watchtower, the inn, the empty flight tower, the well and about the town. The positions were
# read off the ADT's doodads and checked in the client with `WOW_PROBE_GOTO`.
#
# `guid` is the spawn's low guid, kept clear of the imported spawns' (0xF00000 up). `entry` is a
# creature entry of our own, outside 1.12's range, unless a real creature lends its name.
# `role` is what it is in the town (goods, tokens, trainer, giver, ambient), which its flags must
# fit (tests/content_hub.rs). `respec` marks the one trainer who sells the talent respec.
# `npc_flags` are `UNIT_NPC_FLAG_*` (0x1 gossip, 0x2 quest giver, 0x4 vendor, 0x10 trainer, 0x4000 repair),
# which pick the stock window a right-click opens. `faction_template` 35 is friendly to every race.
# `display_id` is a real 1.12 Horde NPC model (`CreatureDisplayInfo.dbc` with a
# `CreatureDisplayInfoExtra` row). `position` is WoW `[x, y, z]` on Kalimdor, z the ADT terrain's
# height there (the inn's floor for those inside): the host's ground replaces it, and where the
# host has none streamed in yet the NPC stands at it. `stock` is a vendor's list, in the merchant window's order. `greeting` opens a quest
# giver's quest list.

[[npc]]
guid = 0xF00001
entry = 190001
name = "Barg"
subname = "General Goods"
level = 30
display_id = 1316
faction_template = 35
role = "goods"
npc_flags = 0x4004
position = [-411.0, -2639.0, 96.0]
orientation = 4.71
# The four tiers of drink, then of food: 1, 5, 15 and 25.
stock = [159, 1179, 1205, 1708, 117, 4536, 4540, 2287, 4537, 4541, 3770, 4538, 4542, 3771, 4539, 4544]

# The training yard's four Tier 1 trainers, by the archery targets. Each one's gossip lists their
# own Line's Advancement Quests (content/quests.toml), and its greeting says what the Line is.
# 0x13 is gossip, quest giver and trainer. `text_id` is a greeting's `npc_text` id, the realm's
# own; `greeting` is its text.
#
# Uzzek, the Vanguard Trainer: creature 5810, the Barrens' warrior quest giver, lends his name and
# model (display 4391, an orc warrior). He alone sells the talent respec (`respec`,
# src/trainer.rs).
[[npc]]
guid = 0xF00010
entry = 5810
name = "Uzzek"
subname = "Vanguard Trainer"
level = 40
display_id = 4391
faction_template = 35
role = "trainer"
npc_flags = 0x13
position = [-437.0, -2684.0, 96.5]
orientation = 5.13
text_id = 64014
respec = true
greeting = "I train the Vanguard, $C: warriors who fight on rage, in plate, at the front of every battle. Strength is earned, and so is every scar. If the path you chose no longer serves you, I can help you forget it - for a price."

