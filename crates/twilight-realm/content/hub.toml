# The Hub's friendly NPCs, written by hand: they stand in the Crossroads for the whole session.
#
# `guid` is the spawn's low guid, kept clear of the imported spawns' (0xF00000 up). `npc_flags`
# are `UNIT_NPC_FLAG_*` (0x4 vendor, 0x4000 repair), which pick the stock window a right-click
# opens. `faction_template` 35 is friendly to every race. `display_id` is a dressed orc man
# (`CreatureDisplayInfo.dbc` with a `CreatureDisplayInfoExtra` row). WoW coordinates on Kalimdor.
# `stock` is a vendor's list, in the merchant window's order.

[[npc]]
guid = 0xF00001
entry = 190001
name = "Barg"
subname = "General Goods"
level = 30
display_id = 1316
faction_template = 35
npc_flags = 0x4004
position = [-438.6, -2645.4, 95.9]
orientation = 3.93
# The four tiers of drink, then of food: 1, 5, 15 and 25.
stock = [159, 1179, 1205, 1708, 117, 4536, 4540, 2287, 4537, 4541, 3770, 4538, 4542, 3771, 4539, 4544]

# The Warrior trainer: his gossip sells the respec (src/trainer.rs). Uzzek, creature 5810, the
# Barrens' warrior quest giver, lends his name and model (display 4391). 0x11 is gossip and
# trainer. Beside where a character starts, facing them.
[[npc]]
guid = 0xF00010
entry = 5810
name = "Uzzek"
subname = "Warrior Trainer"
level = 40
display_id = 4391
faction_template = 35
npc_flags = 0x11
position = [-446.0, -2648.0, 95.9]
orientation = 6.14
