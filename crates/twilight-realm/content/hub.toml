progress = [
  { from_pct = 0, text_id = 64302, text = "Word from Redridge: the tower on the hill is down, and the grey over Blackrock Pass has begun to thin. The Watch has a camp at the pass. Things are walking out of the mist, and the captain needs swords to put them down. They've barely started." },
  { from_pct = 25, text_id = 64303, text = "The camp at Blackrock Pass holds, and the mist keeps thinning. A quarter of the way, the captain writes. Perhaps a little more." },
  { from_pct = 50, text_id = 64304, text = "Half the pass is clear, by the captain's count. You can see the road climbing into the rocks now, where there was only grey." },
  { from_pct = 75, text_id = 64305, text = "Three parts done, the captain writes. The grey over the pass is a curtain now, not a wall." },
  { from_pct = 90, text_id = 64306, text = "Any day now. The last report says the mist over the pass is a rag. One more good push." },
]
reached = { text_id = 64307, text = "The pass is open, $C. The Burning Steppes lie beyond it, the first land the Hush has given back. Marshal Maxwell holds Morgan's Vigil on the far side." }

