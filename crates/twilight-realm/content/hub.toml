# The Hub's friendly NPCs, written by hand: they stand in the Crossroads, or out in a Hunting
# Ground for a quest to find them, and stream in and out with the player's view, as the mobs do.
#
# `guid` is the spawn's low guid, kept clear of the imported spawns' (0xF00000 up). `entry` is a
# creature entry of our own, outside 1.12's range, unless a real creature lends its name.
# `npc_flags` are `UNIT_NPC_FLAG_*` (0x1 gossip, 0x2 quest giver, 0x4 vendor, 0x10 trainer, 0x4000 repair),
# which pick the stock window a right-click opens. `faction_template` 35 is friendly to every race.
# `display_id` is a real 1.12 Horde NPC model (`CreatureDisplayInfo.dbc` with a
# `CreatureDisplayInfoExtra` row). `position` is WoW `[x, y, z]` on Kalimdor; the host's ground
# replaces z. `stock` is a vendor's list, in the merchant window's order. `greeting` opens a quest
# giver's quest list.

[[npc]]
guid = 0xF00001
entry = 190001
name = "Barg"
subname = "General Goods"
level = 30
display_id = 1316
faction_template = 35
npc_flags = 0x4004
position = [-438.6, -2645.4, 95.9]
orientation = 3.93
# The four tiers of drink, then of food: 1, 5, 15 and 25.
stock = [159, 1179, 1205, 1708, 117, 4536, 4540, 2287, 4537, 4541, 3770, 4538, 4542, 3771, 4539, 4544]

# The Warrior trainer: his gossip sells the respec (src/trainer.rs). Uzzek, creature 5810, the
# Barrens' warrior quest giver, lends his name and model (display 4391). 0x13 is gossip, quest
# giver and trainer: his gossip lists the Advancement Quests. Beside where a character starts.
# `text_id` is his gossip greeting's `npc_text` id, the realm's own; `greeting` is its text.
[[npc]]
guid = 0xF00010
entry = 5810
name = "Uzzek"
subname = "Warrior Trainer"
level = 40
display_id = 4391
faction_template = 35
npc_flags = 0x13
position = [-446.0, -2648.0, 95.9]
orientation = 6.14
text_id = 64014
greeting = "Strength is earned, $C, and so is every scar. If the path you chose no longer serves you, I can help you forget it - for a price."

# The Token vendor: the greens of the buyer's level band (content/token_vendor.toml), priced in
# the Twilight Tokens in the bags. `tokens` says so; it has no `stock` of its own and no repairs.
# The display is a dressed orc woman.
[[npc]]
guid = 0xF00002
entry = 190002
name = "Sarna Duskwhisper"
subname = "Token Vendor"
level = 30
display_id = 1312
faction_template = 35
npc_flags = 0x4
position = [-445.0, -2645.6, 95.9]
orientation = 5.53
tokens = true

