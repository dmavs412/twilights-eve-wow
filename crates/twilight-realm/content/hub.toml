# The Hub's friendly NPCs, written by hand: they live in the Crossroads, or out in a Hunting
# Ground for a quest to find them, and stream in and out with the player's view, as the mobs
# do. Each in the town stands where a person living there would: Barg in the inn, the innkeeper
# by the bar barrels, Sarna at its door, each quest giver at the gate or tower that looks out on
# their Hunting Ground, the four Tier 1 trainers in the training yard, and the townsfolk at the
# gates, the
# watchtower, the inn, the empty flight tower, the well and about the town. The positions were
# read off the ADT's doodads and checked in the client with `WOW_PROBE_GOTO`.
#
# `guid` is the spawn's low guid, kept clear of the imported spawns' (0xF00000 up). `entry` is a
# creature entry of our own, outside 1.12's range, unless a real creature lends its name.
# `role` is what it is in the town (goods, innkeeper, tokens, trainer, giver, ambient), which its
# flags must fit (tests/content_hub.rs). `respec` marks the one trainer who sells the talent
# respec. `npc_flags` are `UNIT_NPC_FLAG_*` (0x1 gossip, 0x2 quest giver, 0x4 vendor, 0x10
# trainer, 0x80 innkeeper, 0x4000 repair),
# which pick the stock window a right-click opens. `faction_template` 35 is friendly to every race.
# `display_id` is a real 1.12 Horde NPC model (`CreatureDisplayInfo.dbc` with a
# `CreatureDisplayInfoExtra` row). `position` is WoW `[x, y, z]` on Kalimdor, z the ADT terrain's
# height there (the inn's floor for those inside): the host's ground replaces it, and where the
# host has none streamed in yet the NPC stands at it. `stock` is a vendor's list, in the merchant window's order. `greeting` opens a quest
# giver's quest list. `faces` is an optional `[x, y]` spot the NPC stands facing, replacing
# `orientation`. A wanderer never takes a step with something solid in the way.

[[npc]]
