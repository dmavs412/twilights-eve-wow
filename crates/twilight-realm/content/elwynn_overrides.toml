# the tunnel from the cave mouth and in the interior, guids 80973 to 80995 (Kobold Miners and
# Geomancers, Mine Spiders, Mother Fang), each found by placing the spawn in the WMO's frame. The
# wolves, bears and miners outside the mouth stay.
