  # it, and the stock level 35 to 44 spawns (958, 959, 11072) on its upper floors. 80928 and 80936
  # stand outside its boxes and stay.
  80924, 80925, 80926, 80927, 80929, 80930, 80931, 80932, 80933, 80934, 80935, 80937,
  # Eyes on the Ridge (#247): four stock wolf and boar spawns (Prowlers 81234, 81368, 81408 and the
