# Hand-written changes laid over the generated content/elwynn.toml, which is never edited.

# Creature entries whose Elwynn spawns are deleted: Northshire Abbey became a Phased Dungeon
# (#78), and these NPCs left it with no replacements. The seven class trainers, then Brother
# Danil, Dermot Johns, Godric Rothgar, Janos Hammerknuckle, Merissa Stilwell, Brother Paxton and
# Brother Neals. Eagan Peltskinner stays: his spot on the east lawn is outside the footprint, and
# he gives two of Northshire's bounties (#98). Last, Princess (330), whose friendly vanilla spawn
# the elite one below replaces (#232).
removed = [198, 375, 911, 6373, 459, 925, 915, 152, 190, 1213, 78, 11940, 951, 952, 330]

