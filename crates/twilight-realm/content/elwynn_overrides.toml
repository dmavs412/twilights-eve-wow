# Creature kits (#469): vanilla's spells, lines and idle emotes, laid over the template of
# `entry`, each field only when given. `spells` replaces the template's. A kit whose entry has
# no template fails the content load.

# Kobold Vermin, Kobold Worker and Kobold Laborer: vanilla's aggro line. The Vermin and the
# Laborer run at 15% health (#472), and the Laborer sunders armour.
