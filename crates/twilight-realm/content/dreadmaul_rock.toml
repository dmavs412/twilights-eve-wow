# Dreadmaul Rock, a Phased Dungeon for levels 55 to 58 in the Burning Steppes (the lore bible's
# "Zone arcs and dungeons"). Hand-written, from the game data.
#
# The building is the stock `md_ogremound.wmo`, placed by the ADT's MODF at (-7964.7, -2512.3,
# 133.8) with heading -202.5, so `origin` is that point and `yaw` is -22.5 (heading plus 180), as
# Jasperlode's. Each footprint box is one indoor WMO group's MOGI bounding box in that frame, z
# widened by a yard each way; the comment above it names the group. The portal stands in the
# doorway the WMO's portal 0 draws between the building and the outside.
#
# A shell for now (2026-10-27, Davis's call): one friendly Phase Tester stands in the first cave
# so a character can see the Phase, and the open-world creatures that stood inside the boxes are
# deleted. Guids: creatures 971001 up, one a dungeon.

