# Duels (spec #152, `GLOSSARY.md`): vanilla's duel between two players, the only PvP there is
# (#160). Hand-written, not from master.csv, and no build script.

# The client's duel spell: a challenge is its `CMSG_CAST_SPELL` at a player (`SPELL_EFFECT_DUEL`,
# Spell.dbc 7266 "Duel").
challenge_spell = 7266

# The countdown between the accept and the fight (`SMSG_DUEL_COUNTDOWN`), in seconds.
countdown_secs = 3

# How close the challenger must stand to challenge, and how far apart the two may stray before
# an unanswered challenge lapses, in yards (vanilla's duel spell range).
request_range_yd = 30.0

# The faction template each duellist's client sees the other wear while they fight, so it shows
# them hostile and lets the attack through (`FactionTemplate.dbc` 14, Monster, hostile to all).
# Everyone else keeps seeing both friendly (#160).
hostile_faction = 14
