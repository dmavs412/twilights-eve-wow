# Carts (spec #560): one wagon per route, back and forth all day on the realm's wall clock.
[cart]
speed_yd_s = 24
dwell_s = 30
seats = 5
use_range_yd = 5
wagon_display = 5392      # Gypsy Wagon (gameobject display, vanilla 180045)
horse_display = 14550     # Caravan Packhorse (vanilla creature 5525)
horse_ahead_yd = 4.5
driver_display = 4530     # a human man, the Caravan Merchant's (vanilla creature 5526)
driver_name = "Cart Driver"
locked_line = "No carts run on this server yet."

# A route's stops and path are written by tools/twilights-eve/road_path.py <route key>: it snaps
# each stop to the road texture within 15 yd, traces the road between them and writes every Z
# from the terrain. Keep one stop per line; the tracer rewrites their positions in order. A stop
# moves by editing its x and y and running the tracer again.

