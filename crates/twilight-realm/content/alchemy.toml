# Alchemy (spec #522, ADR 0025 amended 2026-11-01), as Davis's Alchemy prototype plays it
# (docs/specs/alchemy/alchemy-prototype.html). Staged by the Pipeline lane; the content ticket moves
# it to crates/twilight-realm/content/alchemy.toml and src/alchemy.rs loads it. Generated from the
# prototype's `realm` script and the realm's item entries on 2026-11-01, so every name below is the
# realm's. The prototype is the reference for every rule; the function each section mirrors is named.
#
# [props]: `order` the five product properties, in the prototype's PROPS order, which every list and
#   every entry block below follows; `toxic`, `purifying` the two values that make nothing (Toxic is the
#   chance a craft fails and the points it pays when it holds; each Purifying point cancels one Toxic
#   point in the same craft); `pairs` the ten hybrid pairs in PAIRS order.
# [budget]: a herb's values add up to base + floor(level / per_levels) + rarity[its rarity]. Its level
#   is the lowest `level` of its herbs.toml [[plant]] rows and its rarity the rarest of them
#   (Mageroyal: uncommon in Elwynn, common in Redridge, so uncommon). A load check fails a row that
#   misses its budget (prototype `_audit`, first check).
# [[herb]]: item (a herbs.toml item), values (property or Toxic or Purifying to points). These
#   19 are alchemy's herbs; Bird's Nest, Hill Truffle and Black Truffle are cooking herbs too.
# [notes]: Herb Notes. A herb used in `names_at` crafts shows which values it holds; in `values_at`,
#   their numbers (prototype `noteState`). Every craft counts every herb in it, a wash herb too.
# [log]: the Brew Log keeps a character's last `keep` makes.
# [grades]: names, the item `bands` (item_level), `quality` (white, green, blue, purple), `sell_price`
#   in copper by grade, `steps` (the Strength Steps), `standard` the grade whose item name has no
#   prefix ("Healing Potion", not "Standard Healing Potion").
# [ladder]: each family's threshold per grade, the same for every property (prototype LADDER). A make
#   gives the highest grade it meets, at that grade's step: points / threshold rounded down to a step,
#   x1 to x2 (`gradeFor`, `stepOf`). A hybrid's points are the lower of its two properties'.
# [toxic]: the one rule every craft rolls (prototype section 4). net = Toxic in - Purifying in, never
#   below 0; fail chance = net / (net + main points), 0 when net is 0; a fail is Murky Sludge. When it
#   holds, each net point pays `payoff` points into the product (a hybrid and a flask split them evenly
#   between their two properties). A Tincture or Essence carries floor(net x `keep`) Toxic and rolls
#   again wherever it goes. A make whose body is not herbs takes up to `wash` herbs as a wash: only their
#   Toxic and Purifying count. `carried_max` is the most Toxic a Tincture (5 herbs) or Essence (15
#   herbs) can carry: floor(keep x 3 x herbs), 3 being the most Toxic any herb holds; a load check
#   recomputes it from [[herb]].
# [use]: what the products do when used (prototype section 8). Durations are real seconds. A potion
#   or hybrid shares one cooldown; one oil per hand, procs on a melee hit at `oil_proc_chance` (Quieting
#   Oil every hit); one flask at a time, kept through death. `potion_spell`, `oil_spell`, `flask_spell`
#   are the stock Spell.dbc spells the item rows name so the client lets them be used; each has an
#   empty description, so the tooltip shows only the row's (as cooking's [eat] use_spell 25695 does);
#   `*_spell_name` are their Spell.dbc names for tests/content_spell_ids.rs. `potion_category` is the
#   stock potion cooldown group. `flask_aura_spell` is the stock aura the client shows while a flask is on
#   (its text is stock until flasks get spells of their own).
# [[make]]: the five makes (prototype MAKES): key, name, station, verb, rule (the window's text), the
#   body it takes (`herbs` = [min, max]; or `tinctures` / `essences` of one property for oils and
#   Essences), `fish` (any two [[fish]] items of fish.toml, never a legend), `wash` (most wash herbs),
#   and `opens_after`, the make whose first product opens it per character (the Mortar is open from
#   the start). An Essence takes either 15 herbs, or 3 Tinctures of one property and up to 2 wash herbs.
# [[table]]: the three alchemy tables: key, name, alchemist (the new hub NPC whose gossip opens it),
#   tiers (the grades whose Rumours the alchemist sells), line (said on a character's first visit).
# [rumour]: price in copper by grade. A Rumour gives one grade's exact threshold.
# [sludge]: Murky Sludge, the item every failed or empty craft makes.
# [[product]]: one per product kind: family (potion, oil, hybrid, tincture, essence, flask), key (a
#   property, a pair, or a flask's two Essences in PROPS order), name (the base name; a grade prefixes
#   it, except for a flask), icon (a PNG in data/twilights-eve/art/), icon_base, display_id (one per
#   kind: every row of a kind shares it, ADR 0025), entry (the first item entry of its block), block
#   (rows in the block), nums (each number at the four grades; a step multiplies it, rounded half up)
#   and text (the tooltip line: {n} a number, {n.0} {n.1} a pair's ends, {n*5} times 5 after the step).
#   A potion, hybrid or oil lists `effects`, run in order when it is drunk or its oil procs; each
#   names a `kind` and takes its numbers from `nums` by name (prototype `drink`, `swing`):
#     heal { amount }: heals the user (a range rolls between its ends).
#     restore_power { mana, power }: mana to a mana user; `power` rage or energy to any other.
#     shield { amount, secs, burst, burst_radius_yd, mana_per_hit, threat_pct }: absorbs damage
#       before health; replaces a smaller shield, never a larger one. `burst`: fire damage to
#       every enemy within the radius when it breaks; `mana_per_hit`: mana for each hit it
#       absorbs; `threat_pct`: the threat the user causes while it holds, in percent.
#     thrown_damage { amount, school, range_yd, radius_yd }: at the user's hostile target in range;
#       with `radius_yd`, every enemy that close to the target too. Refused with no target.
#     damage { amount, school }: an oil's proc, at the enemy hit.
#     drop_threat { amount, on }: the user's threat on the current target falls by `amount`;
#       `on = "each_hit"`: on every enemy the effect before it hit.
#     heal_over_time { tick | total, every_secs, secs }: `tick` each `every_secs`, or `total`
#       split evenly over the ticks.
#     heal_pct_of_damage { pct }: heals the user that share of the damage the effect before dealt.
#     sleep { secs }: the user cannot act for `secs`; damage wakes them and ends what heals them.
#     burn_mana { amount }: the target loses that much mana.
#     invisible { secs }: every creature drops the user from its threat list and cannot see them
#       for `secs`; an attack or a cast ends it.
#   An oil procs on a melee hit at [use] oil_proc_chance, or on every hit with `every_hit`. An
#   Essence names the flask `stat` it gives: armour, attack_power, spell_power, health_per_5
#   (health regenerated each 5 s, in combat too) or power_per_5 (mana, rage or energy each 5 s).
#
# Item rows are generated at load, one per entry in each block (ADR 0025: a step is its own row).
#   potion, oil, hybrid: index = grade x 5 + step                         (20 rows)
#   tincture:            index = (grade x 5 + step) x 8 + carried Toxic   (160 rows, Toxic 0 to 7)
#   essence:             index = (grade x 5 + step) x 23 + carried Toxic  (460 rows, Toxic 0 to 22)
#   flask of one Essence twice: the two Essences' states s1 <= s2 (s = grade x 5 + step),
#                        index = s1 x 20 - s1 x (s1 - 1) / 2 + (s2 - s1)  (210 rows)
#   flask of two:        s1 the first property's Essence, s2 the second's, index = s1 x 20 + s2  (400 rows)
# 8551 rows in all with Murky Sludge, entries 963000 to 971649. A flask takes its quality and band
#   from the higher of its two grades.

