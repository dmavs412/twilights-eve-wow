# The hand-written mobs: creature templates (vmangos `creature_template`) and where they stand.
# The Barrens' own spawns and templates, and the low camps' spawns, are generated into
# barrens.toml; the low camps borrow Mulgore's and Durotar's creatures, whose templates are here.
# A Phased Dungeon's own creatures may live in its file instead, as `[[template]]` rows in this
# schema with entries from the block its spec gave it. Such an entry defined twice fails to load.
#
# A template's `hostile` (default true) says whether it attacks a player who comes too close; a
# neutral creature only fights back. `rank` (default 0) is `CreatureEliteType`.
# `boss` (default false): its fights raise the Boss Bar (#280); independent of `rank`.
# `flags_extra` (default 0) is vmangos's: 0x4 `NO_PARRY` and 0x10 `NO_BLOCK` change the attack table.
# `shield` (default false): the creature carries one, the only way a mob blocks. The dumps hold no
# equipment, so no template sets it yet.

# Global difficulty: factors on every creature's health and melee damage, on top of its own
# multipliers. A creature's health and damage are its unit class's level-10 vanilla values times
# the Power Curve's P(level) (content/power_curve.toml, ADR 0012), then these. Armour is the
# vanilla table's at its level. `inert` training dummies keep vanilla stats. Halved from 3.2 and
# 3.0 on 2026-11-01, when a level 20 could not solo Azora: in the balance model a level 20 in
# level-20 greens kills a same-level Elwynn mob in 8 to 14 s and keeps 84 to 99% of its health.
[difficulty]
health = 1.6
damage = 1.5
# Damage fades in: `damage_at_1` at level 1, climbing in a straight line to `damage` at
# `fade_to`. Since the halving both are 1.5, so the factor is flat.
damage_at_1 = 1.5
fade_to = 10

# The Tier Step: health and damage on every creature of level `from` and up, the content Tier 2
# fights. A placeholder until Tier 2's Tier Bonus exists to fit it against.
[difficulty.tier_step]
from = 31
health = 1.5
damage = 1.5

# [health, damage] for each rank above normal, on top of the template's own multipliers.
[difficulty.rank]
elite = [2.0, 1.5]
rare_elite = [2.5, 1.75]
boss = [3.0, 2.0]
rare = [1.5, 1.25]

# Zone Factor (ADR 0012): health and damage for a creature standing in AreaTable.dbc's `area`.
# An area with no row takes its parent zone's (content/area_parents.toml), else 1.0. A Phased
# Dungeon's creatures stand in its file's `zone`.
[[zone]]
area = 12 # Elwynn Forest
health = 1.5
damage = 1.3

[[zone]]
area = 9 # Northshire Valley
health = 1.0
damage = 1.0

# Northshire's subzones whose DBC parent is Elwynn Forest, not Northshire Valley.
[[zone]]
area = 23 # Northshire River
health = 1.0
damage = 1.0

[[zone]]
area = 24 # Northshire Abbey
health = 1.0
damage = 1.0

[[zone]]
area = 34 # Echo Ridge Mine
health = 1.0
damage = 1.0

[[zone]]
area = 59 # Northshire Vineyards
health = 1.0
damage = 1.0

# Duskwood and Redridge Mountains (spec #466): Elwynn's factor again, on top of the Tier Step
# from 31. Their subzones take it through area_parents.toml.
[[zone]]
area = 10 # Duskwood
health = 1.5
damage = 1.3

[[zone]]
area = 44 # Redridge Mountains
health = 1.5
damage = 1.3

