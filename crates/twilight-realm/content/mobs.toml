# The hand-written mobs: creature templates (vmangos `creature_template`) and where they stand.
# The Barrens' own spawns and templates, and the low camps' spawns, are generated into
# barrens.toml; the low camps borrow Mulgore's and Durotar's creatures, whose templates are here.
#
# A template's `hostile` (default true) says whether it attacks a player who comes too close; a
# neutral creature only fights back. `rank` (default 0) is `CreatureEliteType`.

[[template]]
entry = 3101
name = "Vile Familiar"
# CreatureType.dbc: Demon.
creature_type = 3
display_id = 1185
# Monster: hostile to every player race.
faction_template = 14
unit_class = "paladin"
level_min = 3
level_max = 4
health_multiplier = 1.0
damage_multiplier = 1.0
armor_multiplier = 1.0
base_attack_time = 2000
# Multiples of the base walk (2.5 yd/s) and run (7 yd/s) speeds.
speed_walk = 1.0
speed_run = 1.143
detection_range = 10.0

