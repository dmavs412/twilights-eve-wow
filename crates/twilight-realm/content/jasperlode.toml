# Jasperlode Mine, the Phased Dungeon behind the sealed door (spec #224, issue #237). Hand-written.
#
# The mine is the stock md_spidermine.wmo, placed by the ADT's MODF at (-9154.65, -594.39, 62.90)
# with heading 8.5, so `origin` is that point and `yaw` is -171.5 (heading less 180), as the Abbey's
# is. The footprint is the WMO's own interior groups (its MOGI table, in the model's frame), minus
# the entrance: groups 4 (gnollgarrison01) and 6 (interior02) are the tunnel from the cave mouth,
# which stays open world, and every other group is inside the door. The door stands where the tunnel
# meets the first chamber (group 5, smallroom04), at model x 14, on the tunnel's axis (y 2.4, the
# line of the stock Kobold Miner that stood in the tunnel). The boxes stop at model x 12 so the door
# and the Portal, at x 14 and 12.6, stand outside them. Terrain heights are the stock spawns' (the
# floor is about 5 yd under the tunnel's in the first chamber and about 10 yd under it at the pit);
# the cover pillars, camp and packs are hand-placed on that floor, and each position needs a look in
# game. The Eye's pit is the deepest floor (model z -9.9), where the stock Mother Fang stood.
# The guids are this file's own (82xxxx).

