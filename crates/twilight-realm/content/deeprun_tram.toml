# The Deeprun Tram: a wave dungeon for levels 38 to 42 under Stormwind City (spec #586,
# docs/specs/deeprun-tram/README.md, ADR 0033). Hand-written, from the game data.
#
# On the tram's instance map, 369 (instance_maps.toml, ADR 0032 amended 2026-11-04). The
# footprint is the Stormwind station and the tunnel up to the mist wall: three platform strips
# along y (the west strip, benches at x -80 to -61; the centre strip, benches at x -20 to -17; the
# east strip, benches at x 20 to 40), track A at x -45.4 between the west and centre strips and
# track B at x 4.53 between the centre and east strips. The tunnel leaves the station toward lower
# y; the mist wall stands across both tracks at y 2400 (data/twilights-eve/mist_walls.json). The
# arrival point (x 67.8) and the exit trigger (x 80.2) stand east of the footprint, open world.
# Map 369 has no terrain, so every Z here is written from the vmangos dump with
# `grounded = false`, each naming the stock spawn it came from; ground_check.py leaves the rows
# alone. The platform floor is z -4.2965, the arrival point's and the vanilla benches'.
#
# The shell (#587): the station bell. The tram line (#589): the `[tram]` table below, cars on the
# timetable. What a car carries (#590): fighters, porters and the Tribute Pile, also in `[tram]`.
# The Conductor comes with the next ticket. Ringing the bell is the lever's pull, Run state; the
# tram line starts from it.
#
# Guids: creatures 973201 up (973101 to 973123 are the quiet wing's), GameObjects 983012 up (the
# entry is the guid). Templates 97215 up in mobs.toml. The tram's creatures have no guid here:
# the line numbers each one it makes.

id = 18
name = "The Deeprun Tram"
levels = [38, 42]
map = 369
zone = 2257
origin = [0.0, 0.0, 0.0]
yaw = 0.0
# Where a probe drops a character: on the platform inside the Phase, facing west.
start = [30.0, 2491.0, 3.14159]

# The three platform strips, both tracks and the tunnel up to the mist wall.
[[footprint]]
x = [-90.0, 50.0]
y = [2400.0, 2530.0]
z = [-25.0, 20.0]

# At the footprint's east edge, facing west onto the platform. Z: the arrival point's
# (areatrigger_teleport 2173), the platform floor.
[portal]
position = [50.0, 2491.0, -4.29649]
orientation = 3.14159

# The station bell on the centre strip, beside where the Tribute Pile will stand: vanilla's Horde
# Bell (display 3972), a placeholder in docs/art-assets.md. Ringing it is the lever's pull, from
# the Run's start; nothing holds it. Z: the Subway Benches on the centre strip, e.g. 176102
# (-20.6, 2480.5, -4.29).
[[gameobject]]
guid = 983012
display = 3972
position = [-18.5, 2484.0, -4.29]
grounded = false
orientation = 1.5708
sides = "inside"
use = "lever"
lever = { used_text = "The bell rings down the tunnel. Something far off answers it." }

# The tram line (#589, spec "The trams", ADR 0033): Run state that starts on the tick after the
# bell is rung. Each tram's cars roll in on one track, stand at the platform and back out, and the
# timetable follows the group's pace (Headway, GLOSSARY.md). Read by src/tram.rs. What a wave
# tram's car carries (#590, spec "What a car carries"): two fighters and a porter, who step off
# at its door on the centre strip side.
[tram]
bell = 983012              # the lever whose use starts the line
car_entry = 176080         # vanilla's Subway, GameObject type 11
car_display = 3831         # its GameObjectDisplayInfo
car_z = 6.90526            # the vanilla cars' Z
stops = [2512.2, 2492.8, 2472.9]   # car stops along y, lead first (vanilla 176083, 176082, 176080)
run_in_yd = 150.0          # each car starts this far before its stop, behind the mist wall
speed_yd_s = 30.0          # rolling in and backing out
dwell_s = 20.0             # standing at the platform
whistle_s = 3.0            # the departure warning, before dwell_s ends
first_s = 10.0             # bell to tram 1's arrival
gap_s = 40.0               # arrival to the next tram's arrival, after tram 1 and after a slow tram
fast_gap_s = 25.0          # the gap after a tram whose warning found nothing a tram brought alive
max_cars = 3               # the most cars a tram has
wave_trams = 6             # then one boss tram, one car, track a
lane_half_yd = 3.0         # a lane's half width either side of its track's x
lane_reach_yd = 10.0       # along y from a car's centre
lane_z_yd = 5.0            # above or below floor_z
floor_z = -4.2965          # the platform floor
wall_y = 2400.0            # a lane's south end: the mist wall
lane_north_y = 2525.0      # a lane's north end: the station's
hit_pct = 40               # of maximum health, unaffected by armour
hit_root_ms = 2000         # how long a hit player is rooted
hit_spell = 1900054        # the root's aura, in creature_spells.toml
hit_spell_name = "Tram Strike"
bell_sound = 7234          # SoundEntries BellTollDwarfGnome, an arrival's warning
whistle_sound = 6757       # SoundEntries SubwayStart, a departure's warning
lamp_display = 6038        # General Lantern 01, lit while a warning lasts; also a Lampman's lamp
fighter_slots = 2          # fighters a wave car carries
fighters = [97215, 97207, 97216]   # each fighter slot rolls one with equal odds
lampman = 97216                    # at most one a car
porter = 97217                     # one a car while any crate is left to escape
fighter_levels = [38, 40]
porter_level = 38
step_off_spacing_yd = 1.5  # a car's creatures stand this far apart along y at its door
wake_s = 1.0               # stepping off to acting
lift_s = 2.0               # a porter lifting a crate
carry_speed_pct = 70       # of a porter's walk speed, carrying
gilded_spell = 1900056     # the porter's gold glow, in creature_spells.toml
gilded_spell_name = "Gilded"
lamp_every_s = 12.0        # a Lampman's lamps: the first wake_s after stepping off, then this often
lamp_radius_yd = 6.0
lamp_slow_pct = 30
lamp_spell = 1900055       # the lamp's slow, in creature_spells.toml
lamp_spell_name = "Mist Lamp"
crate_display = 31         # vanilla's Sealed Crate
pile_guid = 983013         # the first crate's guid; crate k is pile_guid + k (to 983024)
# The Tribute Pile, on the centre strip beside the bell. Z: the Subway Benches on the centre
# strip, e.g. 176102 (-20.6, 2480.5, -4.29).
pile = [
  [-19.7, 2488.7, -4.29], [-18.5, 2488.7, -4.29], [-17.3, 2488.7, -4.29],
  [-19.7, 2489.9, -4.29], [-18.5, 2489.9, -4.29], [-17.3, 2489.9, -4.29],
  [-19.7, 2491.1, -4.29], [-18.5, 2491.1, -4.29], [-17.3, 2491.1, -4.29],
  [-19.7, 2492.3, -4.29], [-18.5, 2492.3, -4.29], [-17.3, 2492.3, -4.29],
]

# Each track: its x, the x of its cars' doors on the centre strip side (#590), and its lamp at the
# platform's south end. The lamp's guid follows the bell's (983012 up; the entry is the guid).
[[tram.track]]
key = "a"
x = -45.4
door_x = -40.0
lamp = [-45.4, 2458.0, -4.2965]
lamp_guid = 983027

[[tram.track]]
key = "b"
x = 4.53
door_x = 0.0
lamp = [4.53, 2458.0, -4.2965]
lamp_guid = 983028
