# Fishing (spec #323, ADR 0018): the cast, the Reeling Bar, Angler levels, the fish, the pools
# they are caught from, the Fishing Waters, lures and bait. `src/fish.rs` loads it; the realm's
# fishing rules read it.
#
# `item` rows are item templates in content/items.toml's format, as content/goods.toml writes
# them: every fish, pole, lure, bait and treasure item fishing hands out that no other content
# file already has (118, 858 and 929 are in given_items.toml). The stock rows are vmangos's
# `item_template`. A raw fish is food the way goods.toml writes food: `use_spell` and its
# `Spell.dbc` name, and `restores_health` over `duration_ms` from that spell's tooltip. The mana
# potions carry their tooltip spell but no `restores_mana`: the realm's potion restores health
# only, so a mana potion with one would be used up for nothing.
#
# [spell], the cast:
#   id                 the Fishing spell; its effect summons the bobber GameObject
#   pole_subclass      the weapon subclass a cast needs in the main hand (20, fishing pole)
#   bobber_entry       the bobber GameObject's entry, and its display
#   bobber_display
#   land_yd            [min, max] yards ahead of the caster the bobber lands
#   cast_secs          how long the bobber floats before it is lost unanswered
#   bite_secs          [min, max] seconds from landing to the bite
#
# [bar], the Reeling Bar. Fill and the catch zone are fractions of the track (0 to 1):
#   start_fill, fill_per_sec, drain_per_sec   the catch meter: where it starts, its rise while the
#                                             fish is inside the zone and its fall while outside
#   timeout_secs                              the fish escapes after this long
#   zone_base, zone_per_level, zone_max       catch-zone height: base + per Angler level, capped
#   difficulty_per_level_above                a fish's difficulty grows this much per level it is
#                                             above the Angler
#   gate_levels_above                         a fish this many levels above the Angler is not
#                                             hooked at all
#   treasure_base, treasure_per_level         the chance a treasure chest appears on the track
#   treasure_fill_secs                        seconds the zone must hold the chest to win it
#   treasure_appears_secs                     [min, max] seconds into the reel it appears
#
# [angler], Angler levels and XP:
#   cap                                       the highest Angler level
#   xp_base, xp_per_level                     XP to the next level: base + per_level x level
#   catch_xp_base, catch_xp_per_level         a catch's XP: base + per_level x the fish's level,
#   rarity_factor, perfect_factor             times its rarity's factor, times perfect_factor for
#                                             a catch with the meter never falling
#   legend_bonus_xp                           added for a Legendary Fish
#
# [[fish]], one per fish item:
#   item, style (smooth, mixed, sinker, floater or dart: how it moves on the track),
#   difficulty (0 to 100), rarity (common, uncommon or rare)
#
# [[pool]], one per zone (AreaTable id). Weights are vmangos `fishing_loot_template` chances; its
# `0.0` row takes the rest of 100. The fish weights and treasure weights of a pool sum to 100.
#   key, zone, fish = [{ item, weight, level }], treasure = [{ item, weight }], copper = [min, max]
#   A treasure chest pays a copper roll in `copper` and one roll on `treasure`.
#
# [[water]], the Fishing Waters: a named stretch of water, by `area` (AreaTable id) or by
# `circle = [map, x, y, radius]`. `pool` names its pool; without one it fishes its zone's.
#
# [[lure]], the stock lures: a `duration_secs` buff on the pole with one effect:
#   angler_levels   counts as this many Angler levels more
#   bite_wait_pct   the bite comes this percent sooner (negative) or later
#   zone_pct        the catch zone is this percent taller
#
# [[bait]], the custom baits at 960101 on, used up one per cast; the same effect keys as a lure,
# and `treasure_points` (percentage points more treasure chance). A bait with no effect is one a
# Legendary Fish asks for.

