title = "Into Ilgalar"
objectives = "Kill 12 gnolls on the tower's hill in eastern Redridge, then return to Marshal Marris in Lakeshire."
details = "You found the door. Now I want to see it from here. The Blackrock keep carrying crates up that hill, a few every night, and the gnolls on the slope let them through and turn everyone else back. I can't send eleven men up a hill full of gnolls. But clear the slope and I can put one man on the ridge with a glass, and the Watch can at least watch the door. While you're up there, listen."
progress = "Is the slope clear?"
completion = "Louder, you say. Like the whole hill is a bell somebody keeps striking. I've eleven men and not one of them is going through that door. If you go in, I'll want to know who's ringing it."
