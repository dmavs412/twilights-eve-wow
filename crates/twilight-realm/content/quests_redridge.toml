# Bounties: money only, no choices.

[[quest]]
id = 98111
kind = "bounty"
giver = 464
level = 30
title = "Teeth in the Grass"
objectives = "Kill 10 Redridge Thrashers or Tarantulas near Three Corners, then return to Guard Parker."
details = "The gnolls aren't the only thing on this road. Thrashers come out of the long grass and tarantulas drop off the rocks, and neither of them cares who you are. A family lost their mule to a thrasher yesterday, right in front of my hut. The Watch pays a bounty for every one killed. Thrashers or tarantulas, ten at a time, and I'll pay."
progress = "Road any quieter?"
completion = "Ten fewer things with teeth between here and Lakeshire. They'll be back by the end of the week. They always are. My coin will be here when they are, so come back then."
money = 900
zone_or_sort = 44
kill = [{ family = "Thrashers and tarantulas slain", entries = [712, 442], count = 10 }]

[[quest]]
id = 98112
kind = "bounty"
giver = 343
level = 31
title = "Flanks for the Pot"
objectives = "Bring 8 Goretusk Flanks from the Great Goretusks of Redridge to Chef Breanna in Lakeshire."
details = "Every barge that sinks is a barge of flour and salt pork I don't get, and every day there are more mouths in this town. Families from the west, workers for the bridge, Watchmen at all hours. I can't feed them on lake water. The great goretusks in the hills are tough old things, but I can make anything tender with enough time. Bring me flanks."
progress = "Flanks? The pot's waiting."
completion = "Tough as boots, just like I said. Give them a day in the pot with onions and nobody will know. That's supper for the bridge crew. Here's your coin, and come back when you have more."
money = 930
zone_or_sort = 44
collect = [{ item = 980307, count = 8, from = [547], chance = 50 }]

[[quest]]
id = 98113
kind = "bounty"
giver = 415
level = 32
title = "Silk for Lashing"
objectives = "Bring 8 Tarantula Silk from the Tarantulas of Redridge to Verner Osgood in Lakeshire."
details = "Rope's gone the way of everything else out here. What came on the barges is at the bottom of the lake, and what's left in town is rotten. Tarantula silk is thick as twine and twice as strong, if you can get it off the spider. I need it for lashing, for nets and for the bridge crew's scaffold. Eight lengths at a time, and I'll pay a fair price. Mind the bites."
progress = "Got that silk?"
completion = "Sticky stuff, but it'll hold. That's another week of lashing for the scaffold and a net or two besides. Here's your coin. The spiders aren't going anywhere, and neither is my offer."
money = 960
zone_or_sort = 44
collect = [{ item = 980308, count = 8, from = [442], chance = 50 }]

[[quest]]
id = 98114
kind = "bounty"
giver = 1070
level = 33
title = "Condors over Everstill"
objectives = "Kill 10 Dire Condors over Lake Everstill, then return to Deputy Feldon in Lakeshire."
details = "The condors used to stay up on the cliffs. Since the barges started going down, they've learned there's food floating on the lake. Now they take fish off the drying racks and dive at the children on the docks. The Watch has better things to do with its arrows. So do I. The magistrate has put a bounty on them. Ten at a time, and I'll pay each time."
progress = "Still circling?"
completion = "Ten fewer over the docks. The children can mend nets without looking up every minute. They'll be back once they've forgotten, and the bounty stands until then. Here's your pay."
money = 990
zone_or_sort = 44
kill = [[428, 10]]
