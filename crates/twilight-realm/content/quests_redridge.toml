# The named elite's item quest: blue Quest Line rows (#600). The Thresher has two spawns on the
# lake.
[[quest]]
id = 98107
kind = "story"
giver = 381
after = 98106
level = 34
title = "The Thresher"
objectives = "Kill the Lake Thresher in the deep water of Lake Everstill and bring its jaw to Dockmaster Baren in Lakeshire."
details = "The murlocs dive the barges, but they don't sink them. Something else does that first. Something big, out in the deep water, that cracks a keel like kindling. The crews swear it follows the boats out from the dock and waits until they're halfway across. They call it the Thresher. I used to think it was a story to scare the new hands. Now I've seen the keels. Kill it."
progress = "Is it dead?"
completion = "That's a jaw. Look at the size of it, and the keel still stuck in the teeth. I'm glad it's dead. I am. But it was in that lake before there was a Lakeshire, and now it isn't. Here, you earned this."
money = 1530
choices = [903300, 903301, 903302]
zone_or_sort = 44
kill = [[14357, 1]]
collect = [{ item = 980306, count = 1, from = [14357], chance = 100 }]

[[quest]]
id = 98108
kind = "story"
giver = 382
after = 98103
level = 33
title = "Blackrock Menace"
objectives = "Kill 10 Blackrock Outrunners and 6 Blackrock Renegades on the Lakeridge Highway, then return to Marshal Marris in Lakeshire."
details = "The Blackrock have outrunners on the Lakeridge Highway, south of the lake. They sit on the rocks above the road and watch our walls. They count the men on them, they count the gates, they count the boats. I've lost two scouts trying to drive them off. I want them gone before they finish counting, and the renegades with them. Eleven men can't do it. You can."
progress = "Still out there, counting?"
completion = "Every one of them had a purse, and every purse had this. Coin I've never seen, with faces no king ever wore. I'm told the Defias in Elwynn are paid in the same. Orcs don't take wages. Somebody's paying them anyway."
money = 1155
choices = [903211, 903212, 903213]
zone_or_sort = 44
