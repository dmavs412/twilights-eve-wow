# ── Redridge 30-35 (#595) ─────────────────────────────────────────────────────────────────────
# Three Corners, then Lakeshire's three problems. Every giver and ender is a vanilla Redridge
# spawn (content/redridge.toml). Worse Problems has no prerequisite, so a character who skipped
# Three Corners starts at the magistrate.

[[quest]]
id = 98101
kind = "story"
giver = 464
level = 30
title = "Gnolls at Three Corners"
objectives = "Kill 10 Redridge Poachers and 10 Redridge Mongrels near Three Corners, then return to Guard Parker."
details = "This is the Lakeshire Watch's post at Three Corners. Me, a bell and a hut. Every day families come up this road from Elwynn, walking east with everything they own on their backs. And every day the gnolls come down off those hills to meet them. Poachers for the packs, mongrels for whoever falls behind. I ring the bell and I run at them, and I'm one man. Thin them out, and the road might stay open another week."
progress = "Is the road clear?"
completion = "I heard fewer of them on the hill last night. That's the first quiet night since spring. The families will never know your name, but they'll get to Lakeshire. That's worth something. Here, take this."
money = 1050
choices = [903215, 903217, 903219]
zone_or_sort = 44
kill = [[424, 10], [423, 10]]

# Parker hands over his report on accepting; Feldon takes it in.
[[quest]]
id = 98102
kind = "story"
giver = 464
ender = 1070
after = 98101
level = 31
title = "Report to Lakeshire"
objectives = "Carry Guard Parker's report to Deputy Feldon in Lakeshire."
details = "Every week I send a report to Lakeshire. Every week it says the same thing: send more men. The last runner I sent never arrived. Nobody found him, and nobody found the report. So this one goes by hand, and yours is the hand I trust. Follow the road east along the river to Lakeshire and give it to Deputy Feldon. Tell him the bell still rings."
progress = "You've come from Three Corners? Let me see that."
completion = "Parker's hand. 'Send more men.' He always writes that, and there are never more men to send. You came up that road and you're still standing, which is more than the last runner managed. The magistrate wants to meet anyone who can fight. Go and see him."
money = 0
choices = [903204, 903206, 903209]
zone_or_sort = 44
gives = [[980301, 1]]
collect = [{ item = 980301, count = 1 }]

[[quest]]
id = 98103
kind = "story"
giver = 344
level = 31
title = "Worse Problems"
objectives = "Speak with Marshal Marris, Foreman Oslow and Dockmaster Baren in Lakeshire, then return to Magistrate Solomon."
details = "Stormwind writes to me about wolves. I have wolves. I also have orcs on the hills, a bridge in the lake and barges that sink in calm water. I've written all of it down three times and sent it west, and the answers say the city has every confidence in me. If you're here to help, hear it from the people doing the work. Marris has the Watch. Oslow has the bridge. Baren has the docks. Then come back and tell me which you'll take first."
progress = "Well?"
completion = "Orcs counting, stone nobody ordered and crates nobody names. That's Redridge. Pick one, and I'll find you coin for the rest."
money = 0
choices = [903214, 903216, 903218]
zone_or_sort = 44
talk = [
  { npc = 382, option = "What does the Watch need?", reply = "Men. I have eleven. The Blackrock have sent outrunners down the highway south of the lake twice this month, looking at our walls and counting. Orcs don't count unless someone is paying them to." },
  { npc = 341, option = "What happened to the bridge?", reply = "The old one went in the spring flood, and my crew's tools went with it. Then a wagon of good cut stone turned up from the city, paid for, and nobody here ordered it. I'm not asking. I'm building." },
  { npc = 381, option = "What's wrong with the barges?", reply = "Three barges this season, all heading east across Everstill, all loaded heavy, all gone down in flat water. The murlocs dive them before the crews are dry. I'd like to know what was in those crates. The crews won't say." },
]

[[quest]]
id = 98104
kind = "story"
giver = 341
after = 98103
level = 31
title = "The Lost Tools"
objectives = "Bring 6 Mason's Tools from the Murloc Flesheaters and Murloc Scouts of Lake Everstill to Foreman Oslow in Lakeshire."
details = "The spring flood took the old bridge, and it took my crew's tools with it. Chisels, mallets, levels, the lot, all at the bottom of the lake. You'd think they'd sit there and rust. They don't. The murlocs dive for anything that shines and carry it off to their huts on the shore. I've got stone and I've got men, and I've got nothing to cut it with. Get my tools back."
progress = "Any tools?"
completion = "That's my chisel. My father's mark is still on the handle, under the weed. A bit of oil and these will cut stone again. Now we can start on the bridge proper."
money = 1085
choices = [903204, 903206, 903208]
zone_or_sort = 44
collect = [{ item = 980302, count = 6, from = [422, 578], chance = 40 }]

[[quest]]
id = 98105
kind = "story"
giver = 341
after = 98104
level = 33
title = "The Everstill Bridge"
objectives = "Bring 6 Iron Pikes from Blackrock Outrunners and 6 Iron Rivets from Blackrock Grunts to Foreman Oslow in Lakeshire."
details = "The new bridge is nearly done, but the last span won't hold on stone alone. It needs iron, and the iron's gone. The old footings were full of it, and the Blackrock have been prying it loose at night and hammering it into spearheads. Their outrunners carry the pikes, and their grunts keep the rivets for the next batch. Take it back from them. Bridge iron belongs in a bridge."
progress = "Got that iron?"
completion = "That'll hold the last span. You'll want to know about the stone. It came on a wagon from the city with a note: 'For the Lakeshire bridge, with the compliments of a friend.' A house's seal on the wax. Not the crown's, and not one I know. The magistrate didn't ask, and nor did I. I kept the wax, though."
money = 1155
choices = [903215, 903217, 903219]
zone_or_sort = 44
collect = [
  { item = 980303, count = 6, from = [485], chance = 50 },
  { item = 980304, count = 6, from = [440], chance = 50 },
]

[[quest]]
id = 98106
kind = "story"
giver = 381
after = 98103
level = 33
title = "What's on the Lakebed"
objectives = "Kill 12 murlocs of Lake Everstill and bring 5 Marked Crate Lids to Dockmaster Baren in Lakeshire."
details = "Three barges down, and every time the murlocs are on the wrecks before the crews are dry. They dive the lakebed and carry the cargo off to their camps on the shore. I don't care about the cargo. I care what it was. My crews won't tell me, and they were paid well enough not to. The crates had lids, and lids have marks. Kill the murlocs and bring me the lids."
progress = "Find anything on them?"
completion = "This is off one of mine. That mark, the hammer over a black sun, burned into every lid. I hear Elwynn has trouble with that mark. So the crates go east across my lake, and the barges carrying them go down. I've stopped believing in calm-water accidents."
money = 1155
choices = [903200, 903201, 903202, 903203]
