details = "Every barge that sinks is a barge of flour and salt pork I don't get, and every day there are more mouths in this town. Families from the west, workers for the bridge, Watchmen at all hours. I can't feed them on lake water. The great goretusks in the hills are tough old things, but I can make anything tender with enough time. Bring me flanks."
progress = "Flanks? The pot's waiting."
