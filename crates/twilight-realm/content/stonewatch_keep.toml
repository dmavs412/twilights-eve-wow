# Stonewatch Keep, a Phased Dungeon for levels 45 to 48 in Redridge (the lore bible's "Zone arcs
# and dungeons"). Hand-written, from the game data.
#
# The building is the stock `ruinedkeep.wmo`, placed by the ADT's MODF at (-9387.8, -3029.3,
# 142.6) with heading -445.0, so `origin` is that point and `yaw` is 95 (heading plus 180), as
# Jasperlode's. Each footprint box is one indoor WMO group's MOGI bounding box in that frame, z
# widened by a yard each way; the comment above it names the group. The portal stands in the
# doorway the WMO's portal 0 draws between the building and the outside.
#
# The Blackrock hold the keep with the cult's coin and a black dragonspawn's brood beside them
# (#647, spec #637): three encounters, about 15 minutes. The gate hall, the right halls and the
# rear storage, where a Blackrock Quartermaster and a Twilight Paymaster count the Tribute crates;
# the staging area and the war room, where a Dragonspawn Envoy calls Black Broodlings from the
# brood cage every 20 s of his fight until its lever is pulled; and the top storey, where
# Gath'Ilzogg and Singe fight as one camp and the survivor enrages when the other dies.
#
# The floors, from `tools/twilights-eve/wmo_floor.py`: the gate hall at z 139.22 (group 13); the
# right halls (groups 7 and 10), the rear storage (group 8) and the staging area (group 15) at
# 140.68; the war room (group 2), a ramp that falls about 0.77 yd a yard from 156.8 at its north
# end to 150.1 at its south end; left_upper03 (group 3) at 149.50; the top storey (group 0) at
# 158.07. Every row is interior, `grounded = false` with that floor's Z.
#
# Guids: creatures 974301 to 974317, GameObjects 983061 to 983065 (the entry is the guid).
# Templates 97280 to 97288 here, spells in creature_spells.toml's Stonewatch Keep section.

