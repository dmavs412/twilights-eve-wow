# The Burning Steppes opening (#626): Toren's break and the Blackrock Pass Watch camp. Same schema
# as content/quests.toml.

# ── The break (#631) ──────────────────────────────────────────────────────────────────────────────
# Toren in Lakeshire's inn (Hub NPC 190083) gives Bring It Down once The Unsent Letter (98521,
# quests_redridge_dungeons.toml) is handed in to him (#626 decision 11). It is offered while the
# Anchor stands; a character who holds it after another group's break still finishes it. Holding it
# at the Anchor on Ilgalar's top floor starts the encounter `ilgalar_anchor` (encounters.toml).

[[quest]]
id = 99502
kind = "story"
giver = 190083
after = [98521]
until_milestone = "ilgalar_anchor_broken"
level = 49
title = "Bring It Down"
objectives = "Climb the Tower of Ilgalar to the Anchor on its top floor, hold it while the cult comes to save it, kill the Anchorwarden, and return to Toren in Lakeshire."
details = "The Anchor on the top floor still runs. Morganth's dead and it doesn't care. Here's how it breaks: you don't hit it, you make it work too hard. Stand at the stone and it pulls on everything near it to keep its tune. The cult will feel that the moment you start. They'll send tuners up the stair to steady it, and something worse after them. Kill them all, and the last one most of all. With no hands to hold the tune, the stone gives."
progress = "Is it still humming? Some nights I can hear it from here. I want to stop hearing it."
completion = "I felt it from here. The whole inn did; the cups jumped. It's done, then. It's really done. The grey won't go at once. He wrote that too. It thins, and what's been living behind it walks out first. Someone will have to hold the road while it goes."
money = 2450
zone_or_sort = 44
kill = [[97513, 1]]

# ── The Blackrock Pass Watch camp (#626) ─────────────────────────────────────────────────────────
# Captain Sela Marrow (Hub NPC 190090, #632) gives and takes the camp's three bounties once the
# Anchor breaks. Each hand-in feeds `steppes_open`'s Tally 15 until the Steppes open
# (milestones.toml); after that it still pays. Money is 30 x level.

[[quest]]
id = 99511
kind = "bounty"
giver = 190090
after_milestone = "ilgalar_anchor_broken"
level = 48
title = "Blackrock at the Pass"
objectives = "Kill 12 Blackrock raiders and flamecallers coming down Blackrock Pass, then return to Captain Sela Marrow at the Watch camp."
details = "The orcs were the first through. They must have sat behind the grey for years, waiting for it to lift. Twelve of them, and the road stays ours another night."
progress = "Still coming, are they?"
completion = "That's twelve fewer. Stormwind counts every one, and so do I."
money = 1440
zone_or_sort = 44
kill = [{ family = "Blackrock slain", entries = [97501, 97502], count = 12 }]

[[quest]]
id = 99512
kind = "bounty"
giver = 190090
after_milestone = "ilgalar_anchor_broken"
level = 49
title = "What Burns"
objectives = "Kill 12 flamekin and ember hounds in Blackrock Pass, then return to Captain Sela Marrow."
details = "There's fire walking in the pass, and dogs made of embers running with it. Whatever the mountain's doing beyond the grey, it's spilling over. Put twelve of them out."
progress = "Mind your boots. The ground stays hot for an hour."
completion = "Good. The grass on this side doesn't burn as easily as theirs, and I'd like to keep it that way."
money = 1470
zone_or_sort = 44
kill = [{ family = "Flamekin and ember hounds slain", entries = [97503, 97504], count = 12 }]

[[quest]]
id = 99513
kind = "bounty"
giver = 190090
after_milestone = "ilgalar_anchor_broken"
level = 50
# Level 50 is Tier 3's by default, and no Tier 3 Calling has a kit yet: offered from Tier 2.
min_tier = 2
title = "Wings Out of the Grey"
objectives = "Kill 10 Pass Broodlings in Blackrock Pass, then return to Captain Sela Marrow."
details = "Broodlings. Black ones, the size of a hound, coming down off the ridge as the mist thins. Something bigger is laying them somewhere up there. Ten of them, before they learn to fly properly."
progress = "Any bigger ones?"
completion = "Ten. I'll write it up. The city won't want to read it, but I'll write it up."
money = 1500
zone_or_sort = 44
kill = [[97505, 10]]
