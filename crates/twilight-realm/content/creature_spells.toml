# Creature Spells (ADR 0008): what creatures cast in a fight. Hand-written, not from master.csv,
# and no build script: Davis tunes these numbers by hand while testing.
#
# A creature template in mobs.toml (or any template source) names its spells with
# `spells = ["key", ...]`; one without casts nothing.
#
# key              the name a template uses
# client_spell_id  what the client shows: cast bar, icon, debuff (from the stock Spell.dbc)
# school           physical, holy, fire or shadow
# cast_time_ms     the cast bar; the creature stops swinging for it
# cooldown_ms      from the cast's end
# range_max        yards; the cast is interrupted if the target leaves it (0 for a self-cast)
# chance           percent per decision (one a second) while fighting and off cooldown
# below_health_pct optional: cast only while the caster's health is under this percent of its max
# effect           periodic_damage (a curse on the player, in the skills' own terms), or
#                  heal { pct_max_health } (the caster, no range or line of sight to check)

# Corruption rank 1's look. Placeholders: 6 ticks of 10, 60 shadow damage over 18 s.
[[spell]]
key = "corruption_creature"
client_spell_id = 172
school = "shadow"
cast_time_ms = 2000
cooldown_ms = 15000
range_max = 30.0
chance = 100
effect = { kind = "periodic_damage", tick_ms = 3000, duration_ms = 18000, tick = { base = 10 } }

# The Abbot's self-heal. Looks like Lesser Heal rank 1 (client_spell_id 2050). All placeholders:
# 15% of max health after a 3 s cast, every 20 s, and only once the caster is under 80% health,
# since a heal at full health wastes the cast (the decision code makes that a one-line check).
[[spell]]
key = "abbot_heal"
client_spell_id = 2050
school = "holy"
cast_time_ms = 3000
cooldown_ms = 20000
range_max = 0.0
chance = 100
below_health_pct = 80
effect = { kind = "heal", pct_max_health = 15 }

# The Twilight Disciple's. Looks like Shadow Word: Pain rank 1 (client_spell_id 589): instant.
# Placeholders: 6 ticks of 5, 30 shadow damage over 18 s, every 12 s.
[[spell]]
key = "shadow_word_pain_creature"
client_spell_id = 589
school = "shadow"
cast_time_ms = 0
cooldown_ms = 12000
range_max = 30.0
chance = 100
effect = { kind = "periodic_damage", tick_ms = 3000, duration_ms = 18000, tick = { base = 5 } }

# The Abbot's heavy curse. Looks like Corruption rank 2 (client_spell_id 6222). Placeholders:
# 6 ticks of 18, 108 shadow damage over 18 s, every 25 s.
[[spell]]
key = "abbot_corruption"
client_spell_id = 6222
school = "shadow"
cast_time_ms = 2000
cooldown_ms = 25000
range_max = 30.0
chance = 100
effect = { kind = "periodic_damage", tick_ms = 3000, duration_ms = 18000, tick = { base = 18 } }
