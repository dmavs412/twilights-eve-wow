# Creature Spells (ADR 0008, ADR 0011): what creatures cast in a fight. Hand-written, not from
# master.csv: Davis tunes these numbers by hand while testing. Each is a spell of its own, as a
# Calling's are: tools/twilights-eve/build_spells.py reads this file and writes each one's client
# row into client_dbc_patch.json, so after an edit to an id or a look, run it again.
#
# A creature template in mobs.toml (or any template source) names its spells with
# `spells = ["key", ...]`; one without casts nothing.
#
# key              the name a template uses
# spell_id         its own id, 1,900,000 up (1,000,000 up is from-scratch; the sheet's sit
#                  below 1,900,000), unique across this file and master.csv
# name             the cast bar's and the debuff's name
# icon             a stock icon path, or a PNG in data/twilights-eve/art/
# visual           the stock spell whose look (SpellVisual) it takes; nothing else is read from it
# aura_description optional: the debuff's tooltip, in Spell.dbc's $s1/$t1 terms
# school           physical, holy, fire, frost or shadow
# cast_time_ms     the cast bar; the creature stops swinging for it
# cooldown_ms      from the cast's end: a number, or [min, max] rolled anew at each cast's end (a
#                  cast cut short waits out min)
# range_max        yards; the cast is interrupted if the target leaves it (0 for a self-cast)
# chance           percent per decision (one a second) while fighting and off cooldown
# below_health_pct optional: cast only while the caster's health is under this percent of its max
# first_cast_ms    optional: not cast until this long after the creature enters combat
# warning          optional: sent as a raid warning to every character in the caster's Phase
#                  when the cast starts
# target           optional: "current" (the default, the character the creature fights) or
#                  "random" (a random living character in the caster's Phase within range_max;
#                  the creature keeps fighting the same character)
# effect           periodic_damage (a curse on the player, in the skills' own terms),
#                  heal { pct_max_health } (the caster, no range or line of sight to check),
#                  hit { pct_of_swing } (one blow at the character the creature fights, rolled on
#                  the table a swing uses, pct_of_swing percent of the caster's average swing; it
#                  takes the next swing's place),
#                  snare { pct, duration_ms } (the player runs pct percent slower),
#                  gaze { damage, radius } (when the cast lands, flat damage of the school to
#                  every character in the Phase within radius yards, except those behind a
#                  [[cover]] pillar of the dungeon file),
#                  nova { damage, radius } (a gaze that cover does not stop, centred on the
#                  caster), or
#                  fear { duration_ms } (the target flees from the caster for duration_ms, cannot
#                  act, and gets control back; damage does not break it),
#                  root { radius, duration_ms } (every character in the Phase within radius yards
#                  of the caster can't move for duration_ms; they can still cast and swing),
#                  ground_patch { radius, duration_ms, tick_ms, tick } (a fire patch at the
#                  target's position, shown to the Phase; every tick_ms for duration_ms each
#                  character within radius yards of it takes tick damage of the school; it does
#                  not follow anyone and outlasts its caster), or
#                  absorb { amount, duration_ms } (a self-cast, range_max = 0: a shield that
#                  damage comes off first and that ends early once amount is used up), or
#                  armor_debuff { amount, max_stacks, duration_ms } (each landing adds a stack, up
#                  to max_stacks, and starts duration_ms over; the target's armour is amount
#                  lower a stack, never below 0, until it runs out and every stack goes), or
#                  stance { damage_dealt_pct, damage_taken_pct, duration_ms } (a self-cast,
#                  range_max = 0: every swing and hit the caster lands changes by
#                  damage_dealt_pct percent, and every damage it takes, any school, after armour
#                  and absorbs, by damage_taken_pct percent; duration_ms 0 holds until it leaves
#                  combat or dies; a stance already up blocks the cast)

