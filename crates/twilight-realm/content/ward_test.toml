# The Ward Test: a Phased Dungeon with two stops, for the ward stone, appears-after and timed
# call scripts (#242) and the lever (#577) to try their mechanics where the shipped dungeons have
# none. Hand-written.
#
# A 40x40 yd open-air box centred on (-9800, 555) in Elwynn, 300 yd north of the Test Grounds.
# Terrain flatness and nearby spawns are unchecked; the ground there is taken as about z 47.
# Every position is a world coordinate. The stops are two 20x40 yd boxes east of the building.
#
# When a creature or GameObject is in the Run: from the start, unless it names `after_pinned` (a
# stop), `after_dead` or `until_dead` (a creature's guid), `after_used` or `until_used` (a
# lever's guid), or `after_milestone` or `until_milestone` (a row of content/milestones.toml, ADR
# 0034). An `after_milestone` row comes into a Run under way on the tick its Milestone is reached,
# and an `until_milestone` row leaves it then.
#
# A creature with `frozen_until = { guid = <boss>, pct = <1 to 99> }` (#637) starts each Run frozen
# in the grey, wearing `spell` (a Creature Spell key, "frozen_in_the_mist" when left out), and
# thaws the first time the creature of `guid`, alive, is at or below `pct`% of its health.

id = 90
name = "the Ward Test"
map = 0
origin = [-9800.0, 555.0, 0.0]
yaw = 0.0

[[footprint]]
x = [-20.0, 20.0]
y = [-20.0, 20.0]
z = [-200.0, 400.0]

[portal]
position = [-9818.0, 555.0, 47.2]
orientation = 0.0

# "water" is open from the start; "fire" opens when the ward stone at "water" is used.
[[stop]]
key = "water"
x = [-9700.0, -9680.0]
y = [535.0, 575.0]
z = [-200.0, 400.0]
arrival = [-9690.0, 555.0, 47.2, 0.0]
return_portal = [-9687.0, 555.0, 47.2, 3.14]

[[stop]]
key = "fire"
x = [-9600.0, -9580.0]
y = [535.0, 575.0]
z = [-200.0, 400.0]
arrival = [-9590.0, 555.0, 47.2, 0.0]
return_portal = [-9587.0, 555.0, 47.2, 3.14]

[[inner_portal]]
stop = "water"
position = [-9790.0, 565.0, 47.2]
orientation = 0.0
back = [-9788.0, 565.0, 47.2, 0.0]
open = true

[[inner_portal]]
stop = "fire"
position = [-9790.0, 545.0, 47.2]
orientation = 0.0
back = [-9788.0, 545.0, 47.2, 0.0]

# The water stop's guard, a level 1 Corrupted Brother: the ward stone holds until it is dead.
[[creature]]
guid = 800001
entry = 96003
level = 1
position = [-9690.0, 545.0, 47.2]
orientation = 3.14

# In the building from the moment the water stop is pinned.
[[creature]]
guid = 800002
entry = 96003
level = 1
position = [-9795.0, 545.0, 47.2]
orientation = 3.14
after_pinned = "water"

# In the building from the moment the guard is dead.
[[creature]]
guid = 800003
entry = 96003
level = 1
position = [-9795.0, 560.0, 47.2]
orientation = 3.14
after_dead = 800001

# A level 10 Brother that calls two level 1 Brothers every 20 seconds of a fight, until the lever
# at the water stop is pulled.
[[creature]]
guid = 800004
entry = 96003
level = 10
position = [-9810.0, 570.0, 47.2]
orientation = 3.14

[[creature.every]]
every_s = 20
entry = 96003
level = 1
count = 2
position = [-9805.0, 565.0, 47.2]
until_used = 810005

# In the building from the moment the lever is pulled.
[[creature]]
guid = 800005
entry = 96003
level = 1
position = [-9795.0, 540.0, 47.2]
orientation = 3.14
after_used = 810005

# In the building until the lever is pulled.
[[creature]]
guid = 800006
entry = 96003
level = 1
position = [-9800.0, 540.0, 47.2]
orientation = 3.14
until_used = 810005

# A level 10 Brother in the building's south-west corner, the boss of two Brothers frozen beside
# him: one thaws at 75% of his health, the other at 40%.
[[creature]]
guid = 800010
entry = 96003
level = 10
position = [-9815.0, 540.0, 47.2]
orientation = 0.0

[[creature]]
guid = 800011
entry = 96003
level = 5
position = [-9815.0, 537.0, 47.2]
orientation = 0.0
frozen_until = { guid = 800010, pct = 75 }

[[creature]]
guid = 800012
entry = 96003
level = 5
position = [-9812.0, 540.0, 47.2]
orientation = 0.0
frozen_until = { guid = 800010, pct = 40 }

# The ward stone at the water stop.
[[gameobject]]
guid = 810001
display = 461
position = [-9692.0, 562.0, 47.2]
orientation = 0.0
sides = "inside"
use = "ward"
ward = { stop = "water", needs_dead = 800001, held_text = "Gresh's magic holds the stone.", opens = "fire" }

# Scenery in the building that appears once the water stop is pinned.
[[gameobject]]
guid = 810002
display = 461
position = [-9795.0, 550.0, 47.2]
orientation = 0.0
sides = "inside"
after_pinned = "water"

# Scenery that appears once the guard is dead.
[[gameobject]]
guid = 810003
display = 461
position = [-9795.0, 555.0, 47.2]
orientation = 0.0
sides = "inside"
after_dead = 800001

# Scenery that stands until the guard is dead.
[[gameobject]]
guid = 810004
display = 461
position = [-9795.0, 560.0, 47.2]
orientation = 0.0
sides = "inside"
until_dead = 800001

# A lever at the water stop: held while the guard lives, then pulled once a Run.
[[gameobject]]
guid = 810005
display = 461
position = [-9684.0, 562.0, 47.2]
orientation = 0.0
sides = "inside"
use = "lever"
lever = { needs_dead = 800001, held_text = "The guard's chain holds the lever.", used_text = "The bars drop." }

# Scenery in the building that appears once the lever is pulled.
[[gameobject]]
guid = 810006
display = 461
position = [-9800.0, 550.0, 47.2]
orientation = 0.0
sides = "inside"
after_used = 810005

# Scenery in the building that stands until the lever is pulled.
[[gameobject]]
guid = 810007
display = 461
position = [-9800.0, 560.0, 47.2]
orientation = 0.0
sides = "inside"
until_used = 810005

# Scenery in the building that stands until the Ilgalar Anchor breaks (#629).
[[gameobject]]
guid = 810008
display = 461
position = [-9805.0, 550.0, 47.2]
orientation = 0.0
sides = "inside"
until_milestone = "ilgalar_anchor_broken"

# Its twin, in the building once the Anchor breaks.
[[gameobject]]
guid = 810009
display = 461
position = [-9805.0, 560.0, 47.2]
orientation = 0.0
sides = "inside"
after_milestone = "ilgalar_anchor_broken"
