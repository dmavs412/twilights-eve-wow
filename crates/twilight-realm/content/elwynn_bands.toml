# Hand-written. Elwynn Level Bands (#228, decision 11 of docs/specs/elwynn-10-30): each sub-zone
# gives the vanilla creatures that spawn in it a level from its band, in place of the template's
# own levels. Boxes are [x0, y0, x1, y1] in WoW coordinates on map 0 (x runs north, y runs west).
# A point inside `bounds` and outside every `exclude` box takes the band of the box that holds it,
# or of the nearest box when none does. Templates defined in mobs.toml keep their own levels.

# Elwynn Forest outside Northshire, from the Maclure farm in the south-west to Dead-Tooth Jack's
# camp in the east and Hogger's hollow in the north-west.
bounds = [[-10200.0, -1700.0, -9000.0, 830.0]]

# Never touched: Northshire Valley with Echo Ridge Mine and the Abbey (the same rectangle
# level_overrides.toml uses), and Forest's Edge, the one Phased Dungeon footprint in Elwynn
# (forest_edge.toml, x -10080..-9910, y 530..680).
exclude = [
  [-9160.0, -480.0, -8500.0, 120.0],
  [-10080.0, 530.0, -9910.0, 680.0],
]

# Goldshire: the town (Innkeeper Farley -9462,16; Marshal Dughan -9465,74; Smith Argus
# -9456,87), the road north to Northshire's gate (Donni Anthania's cats -9175,0), and the road
# west to the Westbrook turn (Deputy Rainer's Westbrook side starts at y 640).
[[band]]
name = "Goldshire"
level_min = 10
level_max = 13
boxes = [
  [-9560.0, -60.0, -9380.0, 160.0],
  [-9380.0, -40.0, -9160.0, 120.0],
  [-9560.0, 160.0, -9400.0, 560.0],
]

