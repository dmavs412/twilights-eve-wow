# Northshire Abbey, the first Phased Dungeon (ADR 0006, issue #78). Hand-written.
#
# The footprint is the building's own walls: the box of each interior group of
# nsabbey.wmo (its MOGI table), in the model's frame, placed as the ADT's MODF places the
# building, at `origin` turned `yaw` degrees about +Z (MODF heading less 180). Only the
# front door's portal joins the interior to the outside, so that door is the one way in
# and out; the bell tower's roof hatch is out of reach.

id = 1
map = 0
origin = [-8897.0, -178.3, 80.07]
yaw = -21.5

# The vestibule inside the front door, cut back to the doorway, which runs corner to corner
# from (-26.6, 25.2) to (-23.3, 28.5).
[[footprint]]
x = [-24.0, -12.2]
y = [14.0, 26.5]
z = [0.0, 14.9]

# The nave, the side chapel and the gallery above them. The nave's box is split around the
# doorway's corner, which it would otherwise hold.
[[footprint]]
