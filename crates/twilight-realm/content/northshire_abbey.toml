# The Abbot: the middle of the bell tower's top platform, model (-2, -4.5) on its floor (z 33.1),
# facing the tower stair, which comes up at its east side, model (5, -5). The top floor (group 10)
# is a cross: this is its south arm, x -7 to 3 and y -9 to 0, where the stair comes up and vanilla's
# Brother Neals stood (model (-3.5, -5)). His old point (-2, 5) stood on the raised block in the
# crossing, 10 yd from the stair (#315). He rolls the Abbey's gear (`rolls`).
[[creature]]
guid = 780015
entry = 96005
level = 10
position = [-8900.5, -181.8, 113.7]
orientation = 5.84
rolls = [{ chance = 5, one_of = [900599] }, { chance = 100, one_of = [900500, 900501, 900502, 900503, 900504, 900505, 900506, 900507, 900508, 900509, 900510, 900105, 900511, 900512, 900513, 900514, 900515, 900516, 900517, 900518, 900519] }]

# He calls no one: the bell that brought two Corrupted Brothers up the stair at half health
# came out on 2026-10-25, when the model showed no Calling at 10 in greens surviving them.

# Brother Neals (#85), the Abbey's one survivor and the ender of Into the Abbey: friendly, quest
# flags only. He stands caged at the back of the side chapel, the dead-end alcove off the nave's
# north end (model x -6 to 5, y 22 to 29), at model point (-0.5, 26.4) on the nave's floor
# (z 1.87, ceiling 22.8), facing the chapel's mouth. Nothing frees him. The old point at the foot
# of the tower stair, model (-3.5, -8.5), was moved for #347 so the key's hint sends the player
# through the nave.
[[creature]]
guid = 780005
entry = 952
level = 50
position = [-8887.8, -153.5, 81.94]
orientation = 4.74

# Brother Neals's cage (#347), around him at the back of the side chapel. Display 1787 is
# G_Cage02 (vmangos's Melizza's Cage), 2.6 by 2.7 yd and 3.1 yd tall. It has no `use`, so it is
# unselectable and a click on Neals reaches him.
[[gameobject]]
guid = 790902
display = 1787
position = [-8887.8, -153.5, 81.94]
orientation = 4.74
sides = "inside"

# The tower door: the gallery's doorway into the tower stair room (nsabbey.wmo portal 4, group 2
# to group 7, model (-4.0, -8.3), floor z 17.6, 3.1 yd wide and 5 yd tall). Group 7's one other
# doorway leads up to the tower top, so the door stands before the stair Disciple and the Abbot.
# Display 441 is the Scarlet Monastery's secret door, 3.0 yd wide and 5.4 yd tall.
[[locked_door]]
guid = 790901
display = 441
position = [-8903.8, -184.5, 97.69]
orientation = 5.908
# The doorway in the model frame, as the footprints are: the plane x = -4.0 between these y and z.
doorway = { x = -4.0, y = [-9.85, -6.75], z = [17.0, 23.0] }
opens_with = 980121
locked_text = "The tower door is locked. One of the corrupted brothers carries its key."

# The tower key: one of these brothers carries it, rolled when the Run starts. Brother Neals
# names the room of the one who has it.
[key]
item = 980121
hint_npc = 780005
holders = [
  { guid = 780006, hint = "They locked the tower stair. The brother who took the key went back toward the front doors. You must have passed him." },
  { guid = 780007, hint = "They locked the tower stair. The brother with the key paces the far west end of the nave." },
  { guid = 780008, hint = "They locked the tower stair. The brother who carries the key stands just outside this chapel." },
  { guid = 780009, hint = "They locked the tower stair. The key is on the brother at the south end of the nave." },
  { guid = 780011, hint = "They locked the tower stair. They gave the key to a brother in the back wing." },
  { guid = 780013, hint = "They locked the tower stair. The key went deep into the back wing, to the brother at its far end." },
]
