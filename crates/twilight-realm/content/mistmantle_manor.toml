# Mistmantle Manor, a Phased Dungeon for levels 32 to 36 in Duskwood (the lore bible's "Zone arcs
# and dungeons"). Hand-written, from the game data.
#
# The household went still on the night the dark came, and something under the house still hums
# (#641, spec #637). A run of about 15 minutes, three plain fights: the yard and the steward, the
# walled garden and the lady, and Stalvan in the house. No meter and no sleepers. The house is
# silent: only Stalvan speaks.
#
# One box in the world frame over the farm, Forest's Edge's form. The farm has no outbuildings in
# the game data. The box holds the house (the stock `duskwoodabandoned_human_farm.wmo`, placed by
# the ADT's MODF at (-10368.6, -1255.5, 31.8), its door at (-10362.6, -1257.0)), the fenced yard
# north of it (fences along x -10313, y -1191 to -1220; a gate torch at (-10315, -1199); a cart and
# barrels by the door) and the walled garden east of it (fences x -10379 to -10337, y -1299 to
# -1271). The house's one room floors at z 35.91 (wmo_floor.py); its rows keep that Z with
# `grounded = false`. Outdoor rows take their Z from ground_check.py --fix.
#
# Guids: creatures 974001 to 974014, GameObjects 983031 to 983035. Templates 97225 to 97229 below.

id = 10
name = "Mistmantle Manor"
levels = [32, 36]
map = 0
zone = 10
origin = [0.0, 0.0, 0.0]
yaw = 0.0

[[footprint]]
x = [-10392.0, -10298.0]
y = [-1307.0, -1183.0]
z = [25.0, 70.0]

# On the west edge, where the track from Darkshire meets the box, facing in.
[portal]
position = [-10345.0, -1184.0, 40.05]
orientation = 4.71

# No one walks across the box's edge, in or out, except within gap_yd of the Portal.
[wall]
gap_yd = 8.0

