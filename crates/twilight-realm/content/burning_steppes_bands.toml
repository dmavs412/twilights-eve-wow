# Hand-written. Burning Steppes Level Bands (#634, spec #626): each sub-zone gives the creatures of
# content/burning_steppes.toml that spawn in it a level from its band, in place of their vanilla
# levels. Boxes are [x0, y0, x1, y1] in WoW coordinates on map 0 (x runs north, y runs west), each
# the AreaTable sub-area's chunk extent from an ADT scan (2026-11-08).
# A point inside `bounds` and outside every `exclude` box takes the band of the box that holds it,
# or of the nearest box when none does; when two boxes hold the point, the band listed first wins.
# The boxes overlap, so the small sub-areas come first. A spawn outside `bounds` keeps the zone's
# Level Stretch from zones.toml. Friendly NPCs and critters keep their own levels, and a
# level_overrides.toml row beats a band.

# The whole zone: its spawns run x -8502..-7442, y -3052..-579, so every spawn takes a band and
# none keeps the Level Stretch. A spawn on plain "Burning Steppes" chunks takes the nearest box's
# band.
bounds = [[-8700.0, -4300.0, -7350.0, 1100.0]]

# zones.toml removed every creature inside Blackrock Stronghold's and Dreadmaul Rock's footprints.
exclude = []

# Morgan's Vigil: Ember Worg -8214,-2729; Black Broodling -8243,-2745; Black Drake -8238,-2679.
[[band]]
name = "Morgan's Vigil"
level_min = 50
level_max = 52
boxes = [[-8467.0, -2900.0, -8200.0, -2633.0]]

