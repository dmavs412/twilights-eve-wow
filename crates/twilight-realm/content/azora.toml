# The Tower of Azora (#244, spec #225): "Morganth's Reach", a Phased Dungeon for levels 19 to 22
# in the stock mage tower of Redridge's neighbour Elwynn, with three stops in Redridge. Hand-written.
#
# The footprint. The tower is the stock `magetower.wmo` placed at (-9537.7, -698.7, 65.4) heading
# -138. The WMO's MOGI group boxes could not be read (this session had no access to the game data),
# so the boxes come from the stock spawns inside the tower, placed in the building's frame with
# this file's origin and yaw (guids 80924 to 80937, tower-local x 15 to 43, y -13 to 13). One box a
# floor, with the floors read off those spawns' heights: the ground floor (local z 0), floor 75
# (local z 9.7), floor 90 (local z 25) and the top chamber (local z 33.8, where Theocritus stands
# today). Each box spans x 15 to 48 and y -20 to 16 in the tower's frame: the west edge at 15 keeps
# Toren (hub.toml, tower-local x 14.3) and the door outside the footprint. These are estimates, not
# the WMO's: Davis walks the floors and moves any wall that is wrong. The portal is the door's
# swirl, always open: anyone can walk in at any time.
#
# The tower is emptied: the stock Servants of Azora, Theocritus and the other stock spawns inside
# the boxes (guids 80924 to 80927, 80929 to 80935 and 80937) are in elwynn_overrides.toml's
# `removed_guids`. Servants 80928 and 80936 stand outside the boxes and stay.
#
# The stops are 40x40 yd boxes in Redridge, world coordinates on map 0. vmangos could not be opened
# either, so each spot is a remembered place, not a checked one: no ground height was looked up and
# every z is a guess. Davis stands in each and fixes it.
#   water  Lake Everstill's shallows, about (-9190, -2020), z 43.
#   fire   the Blackrock foothills on Redridge's northern edge, about (-8985, -2380), z 100.
#   shadow the ground at the foot of the Tower of Ilgalar, about (-9235, -2700), z 60. The cellar
#          beneath it is not known to be reachable geometry, so the ground at its foot stands in.
#
# Displays are in mobs.toml; the stock ones named there are unchecked against vmangos.
# Guids: creatures 970001 up, GameObjects 975001 up (the entry is the guid).

