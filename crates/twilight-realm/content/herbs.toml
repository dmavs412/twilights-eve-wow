# Herbalism (spec #435, ADR 0024): the Herb Patch, the Forager's Grid, Herbalist levels, the
# plants of each zone, the tools, the consumables and the perks. `src/herbs.rs` loads it; the
# realm's herbalism rules read it (no rule does yet).
#
# `item` rows are item templates in content/items.toml's format, as content/fish.toml writes them:
# every plant, find, tool and consumable herbalism hands out. The eleven stock herbs are vmangos's
# `item_template`. Every row sets `journal = "herbalism"` (ADR 0023): any way of receiving one
# puts it in the Herbalism Journal's Satchel, never a bag slot. The new rows wear Davis's painted
# icons: a synthetic `display_id` (995023 up), `icon` naming the PNG in data/twilights-eve/art/,
# and the stock display they used to borrow as `icon_base`. `description` says what a plant is
# for: "Cooking ingredient." or "Alchemy reagent.". Every plant's row sets `part`, the plant part
# the Forager's Grid draws it as: flower, leaf, root, berry, mushroom, nest, nut, honeycomb, sap or
# purse.
#
# [spell]:
#   learn              the spell teaching Herbalism adds to the spellbook (Herb Gathering)
#   find               the Find Herbs spell, which toggles herb tracking
#
# [patch], the Herb Patch GameObject:
#   entry, display     its entry, and the stock display it wears (419, "Stardust Covered Bush")
#   name               its name
#   respawn_secs       real seconds before a finished patch is replaced at a random free spot
#
# [grid], the Forager's Grid:
#   size               the grid is size x size tiles
#   pulls              pulls a patch gives
#   plants             [min, max] plants rolled into a patch
#   thorns             thorns in a patch
#   thorn_cost         extra pulls a pulled thorn costs
#   legendary_chance   the chance per patch that its zone's legendary replaces a rolled plant, in
#                      its Bloom
#   bloom_factor       a plant in its Bloom weighs and yields this much more
#   uncommon_boost,    weight added per Herbalist level above 1, as a fraction of the base weight,
#   rare_boost         to uncommon and rare plants
#   sweep_cost, sweep_length    the Sickle's Sweep: pulls spent, tiles in the line
#   probe_cost         the Trowel's Probe: pulls spent on a 3 x 3 area
#   snip_cost, snip_bonus       the Shears' Snip: pulls spent, extra yield
#
# [herbalist], Herbalist levels and XP:
#   cap                         the highest Herbalist level
#   xp_base, xp_per_level       XP to the next level: base + per_level x level
#   plant_xp_base, plant_xp_per_level   a pulled plant's XP: base + per_level x the plant's level,
#                               times its colour's factor
#   weed_xp, thorn_xp           XP for a pulled weed and for a pulled thorn
#   colours                     { up_to, factor } bands by how many levels the Herbalist is above
#                               the plant: the first band whose `up_to` is at or above the gap
#                               gives the factor; a larger gap gives 0
#   perk_every                  one perk slot per this many Herbalist levels
#   reveal_at                   the pick counts that unlock a plant's three tiers of facts
#   reset_base_copper           what the first perk reset costs; it doubles with each reset
#   titles                      { from, title } bands: the title of the last band whose `from` is
#                               at or below the level; the first `from` is 1 and they rise
#
# [[zone]], one per herb zone:
#   key, zone (AreaTable id), live (patches kept live per character)
#   points              the Herb Spots, { x, y, z } each. Z is the terrain's, so a patch grown
#                       where the host has no ground loaded still stands on the grass (#477).
#                       tools/twilights-eve/import_herb_spots.py wrote the line;
#                       ground_check.py checks each Z and `--fix` writes the terrain's
#
# [[plant]], one per pool row. Rarity, level, Bloom and weight belong to the zone's row, not the
# item:
#   zone      a [[zone]] key, or "any" for the shared finds of every zone
#   item      its item row
#   rarity    common, uncommon, rare or legendary
#   level     the Herbalist level it needs
#   bloom     night, dawn, day or dusk (see Blocks in fish.toml); absent for the shared finds
#   timed     true: it grows only in its Bloom (default false); a legendary is always timed
#   weight    its roll weight in the zone's pool
#   use       cooking or alchemy; the Lost Coin Purse has none
#   money     the Lost Coin Purse only: [min, max] copper it pays at once instead of entering the
#             Satchel
#
# [[tool]], the tool in the Tool slot gives its skill: item, skill (sweep, probe or snip).
# [[consumable]], one used per patch: item, effect (tea, sight, salve, draught, twine, charm or
# moonwater).
# [[perk]], one slot per `perk_every` levels: key, name, kind (boon or pact), text.

