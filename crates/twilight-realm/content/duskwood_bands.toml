# Hand-written. Duskwood Level Bands (spec #595): each sub-zone gives the creatures of
# content/duskwood.toml that spawn in it a level from its band, in place of their vanilla levels.
# Boxes are [x0, y0, x1, y1] in WoW coordinates on map 0 (x runs north, y runs west).
# A point inside `bounds` and outside every `exclude` box takes the band of the box that holds it,
# or of the nearest box when none does; when two boxes hold the point, the band listed first wins.
# A spawn outside `bounds` keeps the zone's Level Stretch from zones.toml. Friendly NPCs and
# critters keep their own levels, and a level_overrides.toml row beats a band.

# Every band box below, so a spawn outside them all keeps the Level Stretch.
bounds = [
  [-10175.0, -1650.0, -9883.0, 750.0],
  [-10260.0, -190.0, -10176.0, 100.0],
  [-10849.0, -1350.0, -10418.0, -1050.0],
  [-10416.0, -1683.0, -10217.0, -1450.0],
  [-10600.0, -1530.0, -10418.0, -1351.0],
  [-10416.0, -1417.0, -10217.0, -1183.0],
  [-11150.0, -1417.0, -10850.0, -1217.0],
  [-10790.0, -650.0, -10261.0, 100.0],
  [-10783.0, 183.0, -10617.0, 450.0],
  [-10817.0, 484.0, -10283.0, 750.0],
  [-11183.0, -750.0, -10950.0, -417.0],
  [-11183.0, 17.0, -10817.0, 483.0],
  [-11240.0, -317.0, -10917.0, 16.0],
  [-10583.0, 101.0, -10250.0, 483.0],
]

# The two Phased Dungeon footprints the boxes reach: Mistmantle Manor (mistmantle_manor.toml's
# footprint turned by its yaw of 90.5 about -10368.6,-1255.5) and Forest's Edge (forest_edge.toml,
# x -10080..-9910, y 530..680), which the Darkened Bank box reaches at its western end. Raven Hill
# Deeps lies under Raven Hill Cemetery's box and is not excluded: its footprint is the crypt below
# the graves, and zones.toml already removed every creature inside it.
exclude = [
  [-10378.0, -1263.0, -10361.0, -1248.0],
  [-10080.0, 530.0, -9910.0, 680.0],
]

# The Darkened Bank: the long northern strip along the river (Starving Dire Wolf -10177..-9997;
# Pygmy Venom Web Spider -10160..-9956; Venom Web Spider -10153..-9979; Rabid Dire Wolf
# -10180..-10041). The main box starts at x -10175, short of Brightwood Grove's Nightbane Worgen
# and Black Ravager at -10178,-746 and -10178,-898 and of Raven Hill Cemetery's undead (Bone Chewer
# -10193,137). The second box takes the wolves south of the river bend (Rabid Dire Wolf
# -10245..-10186, -116..-61; Starving Dire Wolf -10227..-10186, -73..95) and stops at y 100,
# short of the cemetery's Brain Eaters at y 108.
[[band]]
name = "The Darkened Bank"
level_min = 30
level_max = 32
boxes = [
  [-10175.0, -1650.0, -9883.0, 750.0],
  [-10260.0, -190.0, -10176.0, 100.0],
]

