title = "The Hungry Dead"
objectives = "Kill 10 Flesh Eaters in Raven Hill Cemetery, then return to Jitters."
details = "The grey men are one thing. The flesh eaters are another. They crawl out of the cemetery on all fours and come sniffing at the hamlet's back doors, and one got into Widow Harlan's pantry last week. She hasn't stopped screaming since, and neither have I, inside. The hamlet put a little money together. Kill ten of the hungry ones and it's yours. Kill ten more and we'll find more money."
progress = "Did you kill the hungry ones?"
completion = "Ten. I'll tell the widow. She'll go on screaming, but quieter. The hamlet's money is yours, and the bounty stands as long as the cemetery keeps them coming."
money = 1140
zone_or_sort = 10
kill = [[3, 10]]

