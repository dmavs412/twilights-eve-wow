title = "Ravager Stew"
objectives = "Bring 8 Ravager Haunches to Tavernkeep Smitts in Darkshire."
details = "No meat comes down the Stormwind road these days, and the Watch eats more than a herd of cattle. So I make do. The young ravagers out at the Yorgen Farmstead are tough and lean, but a ravager haunch stews well if you give it the whole night. Bring me eight haunches and I'll pay for every one. The stew pot doesn't wait."
progress = "Got my haunches?"
completion = "Good meat, that. Into the pot by sundown, not that we get a sundown here, and on the Watch's plates by morning. Come back when the pot's low. It's always low."
