title = "Ogres the Wrong Way"
objectives = "Bring 6 Crate Seals from the Splinter Fist ogres to Watcher Paige on the south road."
details = "Dodds found the coin. I found the ogres. The Splinter Fists of Vul'Gol never leave their mound except to raid, and they never carry anything but clubs. Now they walk the old road north every night, two by two, with crates on their backs. Ogres don't haul for themselves. Somebody pays them. I want to know what is in those crates and where they go. Every lid has a seal on it. Bring me six."
progress = "Got the seals?"
completion = "They carry the crates into the cemetery. Not out of it. Into it. Somebody is paying ogres to haul timber and iron to men who dig among graves. And this seal on the lids is a crown. Somebody is building something out there."
money = 1365
