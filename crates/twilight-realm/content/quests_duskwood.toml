# ── Duskwood 40-45 (#595) ────────────────────────────────────────────────────────────────────────
#
# Duskwood's night was made, and made badly. Sirra asks the three watchers who stood a post that
# night what they remember, and sends her account to Lord Ello, who will not send it on; Jitters
# follows the Grey Robe Surveyors' stakes to the crypt under Raven Hill's mausoleum; and Calor
# wants the worgen of Brightwood Grove and their leader dead. The Surveyors' camps are in
# content/zones.toml (#611). The quest items are in content/quest_items_duskwood.toml.

[[quest]]
id = 98801
kind = "story"
giver = 268
after = 98606
level = 40
title = "Twelve Years Ago"
objectives = "Ask Watchers Royce, Keller and Hartin what they remember of the night the dark came, then return to Sirra Von'Indi."
details = "Since you found the Mistmantles' house, I've been reading everything we wrote about that night, and it isn't enough. Three of the Watch stood a post that night and still stand one now. Royce, Keller and Hartin. They don't talk about it. They might talk to you. Ask them what they remember, not what they think it means. I'll do the thinking."
progress = "Did they talk?"
completion = "Dogs that hide, a bell under the ground, the dead woken by accident. That isn't a curse. Curses don't ring."
money = 0
choices = [903244, 903246, 903248]
zone_or_sort = 10
talk = [
  { npc = 999, option = "What do you remember of the night the dark came?", reply = "The dogs. Every dog in Darkshire went under a bed an hour before. Then the birds stopped. Then it was dark, like a lid coming down, and it never came off." },
  { npc = 885, option = "What do you remember of the night the dark came?", reply = "A sound from the north, under the ground, like a bell somebody struck and never stopped. I felt it in the gate posts. It's still there, if you put your hand on the stones by that house." },
  { npc = 886, option = "What do you remember of the night the dark came?", reply = "The dead in the gardens sat up. Not all at once. One by one, as if something had woken them by accident and they didn't know what to do about it." },
]

