[[quest]]
id = 98705
kind = "story"
giver = 311
level = 37
title = "Sven's Camp"
objectives = "Kill 8 Skeletal Fiends and 6 Carrion Recluses on the west side of Raven Hill Cemetery, then return to Sven Yorgen at his camp."
details = "This is all I have now. A tent, a fire and my boy. I had a farm once, up the hill, until the night the dark came. We ran and never went back. The river was the only place the dead didn't follow. They follow now. Skeletons come down off the cemetery's west side to stand at the edge of my firelight, and the spiders come with them. My boy doesn't sleep. Clear the west side for me, the bones and the spiders both."
progress = "Are they still coming?"
completion = "Quiet, for once. My boy is asleep. You don't know what that's worth. Sit a moment. There's something else I've wanted to ask of someone for a long time, and I think you might be the one."
money = 1295
choices = [903224, 903226, 903229]
zone_or_sort = 10
kill = [[531, 8], [949, 6]]

[[quest]]
id = 98706
kind = "story"
giver = 311
after = 98705
