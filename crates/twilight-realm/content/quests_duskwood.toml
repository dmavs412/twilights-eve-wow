# ── Darkshire's bounties (#595) ──────────────────────────────────────────────────────────────────

[[quest]]
id = 98611
kind = "bounty"
giver = 272
level = 31
title = "Gooey Spider Legs"
objectives = "Bring 8 Gooey Spider Legs to Chef Grual in Darkshire."
details = "No carts come down the Stormwind road any more, and the Night Watch can't fight on turnips. So I cook what the wood gives me, and the spiders give me legs. Big, pale, gooey ones. Boil them long enough with salt and they taste almost like crab. Don't make that face. Bring me eight legs from the venom web spiders, the big ones or the pygmies, and I'll pay you for every batch."
progress = "Got my legs?"
completion = "Lovely and gooey. That's supper for the whole Watch tonight, and nobody will ask what's in it. They never do. Come back when the pot's empty again. In this town, it always is."
money = 930
zone_or_sort = 10
collect = [{ item = 980403, count = 8, from = [217, 539], chance = 50 }]

[[quest]]
id = 98612
kind = "bounty"
giver = 2142
level = 31
title = "Foam at the Mouth"
objectives = "Kill 10 Rabid Dire Wolves, then return to Watcher Callahan."
details = "My post is this road, and my trouble is the wolves that foam at the mouth. A rabid dire wolf doesn't stop when it's hurt and doesn't run when it's beaten. One bit a carter's horse last week, and two days later we had to put the horse down. I can't stop them coming out of the trees. I can pay to have them put down before they bite anyone else. Ten at a time, as often as you like."
progress = "Seen any of the foaming ones?"
completion = "Ten. Good. Burn your gloves if any of that foam got on them, and I mean it. The bounty stands. There'll be more of them by the end of the week."
money = 930
zone_or_sort = 10
kill = [[565, 10]]

[[quest]]
id = 98613
kind = "bounty"
giver = 270
level = 32
title = "The Council Votes on Spiders"
objectives = "Kill 10 Venom Web Spiders, then return to Councilman Millstipe in Darkshire."
details = "The council has voted, again, on the matter of the spiders. The vote was unanimous. The spiders were not consulted. The venom web spiders have spun across the old orchard paths, and a family can't walk to its own trees without a sword. The council has no swords, but it does have a small budget. Kill ten of the large ones and the council will pay you. Then I suspect it will vote again."
progress = "Have you dealt with the spiders?"
completion = "Ten fewer spiders. I'll put it in the minutes. The council thanks you, formally, and pays you, less formally. Come back when the webs are up again. They will be."
money = 960
zone_or_sort = 10
kill = [[217, 10]]

[[quest]]
id = 98614
kind = "bounty"
giver = 302
level = 33
title = "Dust for the Doorstep"
objectives = "Bring 8 Bone Dust to Blind Mary."
details = "Who's there? Don't tell me, I know the sound of a sword belt. Listen, dear. The dead in the gardens are nothing but old bones now, and old bones grind to dust. Lay a line of bone dust across the doorstep and the dead won't cross it. Everyone in Darkshire laughs at me for it, and every one of them comes asking for a pinch. Bring me eight handfuls from the skeletons, and I'll see you're paid."
progress = "Is that bone dust I smell?"
completion = "That's the stuff. Fine and dry. I'll have every doorstep on my lane lined by dark, not that the dark ever ends here. Come back when you've ground some more. I'll always need more."
money = 990
zone_or_sort = 10
collect = [{ item = 980404, count = 8, from = [48, 203], chance = 50 }]

# ── Duskwood 35-40 (#595) ────────────────────────────────────────────────────────────────────────
#
# West of Darkshire, Raven Hill's cemetery is dug every night. Jitters sends the player to look and
# finds men in grey under a crown, not the cult's hammer; the Night Watch on the south road follows
# the Defias and the ogres hauling crates into the cemetery; and Sven Yorgen, burned out the night
# the dark came, wants Morbent Fel dead and his ledger read. The Grey Robes' camps are in
# content/zones.toml (#606); Morbent's level is in content/level_overrides.toml. The quest items
# are in content/quest_items_duskwood.toml.

# The two spots are two of the Grey Robes' dig camps in Raven Hill Cemetery.
[[quest]]
id = 98701
kind = "story"
giver = 288
level = 36
title = "Raven Hill's Watch"
objectives = "Look at the open graves by the west wall and the fresh earth by the north wall of Raven Hill Cemetery, then return to Jitters in Raven Hill."
details = "You hear it too? No? You will, after dark. Spades. Every night, out in the cemetery, the scrape of spades on stone. Somebody is digging up our dead, or the dead are digging themselves out, and I don't know which I'd rather. Everyone in the hamlet says go and look, Jitters. I jump at my own shadow. I know it. You don't. Go and look at the west wall and the north wall, where the earth is fresh, and tell me what's out there."
progress = "Well? What did you see?"
completion = "Men. Not the dead. Men in grey, with lanterns, digging."
money = 1260
