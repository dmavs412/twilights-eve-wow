objectives = "Kill 10 Black Widow Hatchlings in Twilight Grove, then return to Lars."
details = "Sven doesn't like me going near the grove, so I don't. But I've seen it from the riverbank. Spiders, little black ones, hundreds of them, hatching out of the trees. Little ones grow into big ones. Big ones come down to the river. I've saved some coin from fishing. Kill ten of the hatchlings for me before they grow up, and don't tell Sven I paid you."
progress = "Did you go to the grove?"
completion = "Ten! That's ten that won't ever be big. Here, it's all fish money, but it's real. Don't tell Sven. And come back if they hatch again. They always hatch again."
