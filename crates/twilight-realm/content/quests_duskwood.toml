[[quest]]
id = 98703
kind = "story"
giver = 888
level = 38
title = "Night Runners"
objectives = "Kill 10 Defias Night Runners and 6 Defias Night Blades around Addle's Stead, then return to Watcher Dodds on the south road."
details = "The west road should carry farm carts and the odd brave pedlar. After dark it carries nothing at all, because the Defias at Addle's Stead won't let it. Night Runners on the fences, Night Blades in the barn, and anyone who walks past ends up in a ditch. That isn't banditry. Bandits want travellers. These want the road empty, so nobody sees what moves on it. Go out to the Stead and thin them. Bring back anything they carry."
progress = "Is the west road open?"
completion = "Sixteen fewer. And look at this, out of their purses. Coins, but not Stormwind's, not anybody's I know. Fresh-struck, no king's head, no mint. Somebody is paying the Defias in money nobody has ever seen. I'll show Paige."
money = 1330
choices = [903225, 903227, 903230]
zone_or_sort = 10
kill = [[215, 10], [909, 6]]

