[package]
name = "twilights-eve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Twilight's Eve: Callings, the benilla client booted into the Local Realm"

[lints]
workspace = true

[features]
default = ["dev"]
dev = ["benilla-app/dev"]

[dependencies]
benilla-app = { path = "../benilla-app", default-features = false }

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "twilights-eve"
path = "src/main.rs"
test = false
