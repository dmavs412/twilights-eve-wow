[package]
name = "benilla-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WoW 1.12.1 auth (SRP6) + world wire protocol and the benilla-auth CLI"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
benilla-srp = { path = "../benilla-srp" }
flate2 = "1.0"
# The transport seam's reads are `async` so the browser body can suspend on the JS event loop; the
# native sequencer drives the very same futures to completion with `block_on` on its own thread.
futures-lite = "2.6.1"
sha1.workspace = true
# Derives `SessionEventKind`, `SessionEvent`'s fieldless twin that the handler table keys on.
serde = { version = "1", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }

[dev-dependencies]
# The SRP probe example re-derives the handshake by hand, to vary what `benilla-srp` fixes.
num-bigint = "0.4.6"
rand = "0.8.6"
