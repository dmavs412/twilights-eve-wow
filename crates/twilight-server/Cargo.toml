[package]
name = "twilight-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Twilight's Eve's friends server: one Local Realm behind a TCP socket (ADR 0009)"

[lints]
workspace = true

[dependencies]
benilla-protocol = { path = "../benilla-protocol" }
twilight-realm = { path = "../twilight-realm", features = ["wire"] }
anyhow.workspace = true
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-wdt = { path = "../benilla-wdt" }
parry3d = "0.26"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }
