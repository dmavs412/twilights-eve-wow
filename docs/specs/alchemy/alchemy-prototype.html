// ---------- vials ----------
// The property vials: five product properties and Toxic, each a glass tube filled to its points. Rings on the glass mark the
// family's four grade thresholds; a gold ring is the target's. A hatched layer above the liquid is the payoff if the Toxic holds.
function vialsHtml(b, title, outcome) {
  const pct = v => Math.max(0, Math.min(100, v / b.scale * 100));
  const rings = realm.GRADES.map((g, i) => ({ v: realm.LADDER[b.ringFamily][i], g }));
  const ringsHtml = isTick => rings.map(r => `<span class="ring${isTick === r.v ? ' gold' : ''}" style="bottom:${pct(r.v)}%"><i>${r.v}</i></span>`).join('');
  const vial = (r, note) => `<div class="vcol${r.isMain ? ' main' : ''}${r.isTarget ? ' tgt' : ''}${r.tox ? ' toxv' : ''}" style="--pc:${r.colour}">
    <div class="vial" title="${esc(r.title)}">
      <span class="neck"></span>
      <div class="glass">
        ${ringsHtml(r.tick)}
        ${r.tick !== null && r.tick !== undefined && !rings.some(x => x.v === r.tick) ? `<span class="ring gold" style="bottom:${pct(r.tick)}%"><i>${r.tick}</i></span>` : ''}
        <span class="liquid" style="height:${pct(r.value)}%"></span>
        ${r.bonus ? `<span class="bonus" style="bottom:${pct(r.value)}%;height:${pct(r.bonus)}%"></span>` : ''}
        ${r.purified ? `<span class="purified" style="bottom:${pct(r.value)}%;height:${pct(r.purified)}%"></span>` : ''}
        ${r.unknown ? `<span class="q" style="bottom:${pct(r.value + (r.bonus || 0) + (r.purified || 0))}%">?</span>` : ''}
        <span class="shine"></span>
      </div>
    </div>
    <div class="vlab">${r.prop}</div>
    <div class="vval">${r.value ? r.text : r.unknown ? '?' : '<span class="muted">–</span>'}${r.bonus ? `<span class="vbonus">+${realm.fmtPts(r.bonus)}</span>` : ''}</div>
    <div class="vnote">${note || ''}</div>
  </div>`;
  const tox = b.toxic, mains = b.rows.filter(r => r.isMain);
  // The product line sits under the main vial (under the first of a flask's two). Everything else is read from the glass.
  const prodNote = o => !o ? '' : o.failed ? '<span class="bad">Murky Sludge</span>' : !o.ready ? `<span class="muted">${esc(o.note)}</span>` : o.sludge ? `<span class="muted">${esc(o.text)}</span>` : o.known ? `<span class="q-${o.quality}">${esc(o.name)} ${o.step}</span>${o.carried ? `<span class="muted"> · carries Toxic ${o.carried}</span>` : ''}` : `<span class="muted"><i>${esc(o.text)}</i></span>`;
  return `<div class="vials${b.result ? (outcome && outcome.failed ? ' failed' : ' result') : ''}">
    <div class="vrow">
      ${b.rows.map(r => vial({ ...r, title: `${r.prop} ${r.text}${r.bonus ? ` (+${realm.fmtPts(r.bonus)} if the Toxic holds)` : ''}` }, r === mains[0] ? prodNote(outcome) : r.isTarget && r.tick !== null && !r.isMain ? `<span class="muted">target ≥ ${r.tick}</span>` : mains.length === 0 && r === b.rows[0] && outcome && !outcome.ready ? `<span class="muted">${esc(outcome.note)}</span>` : '')).join('')}
      ${vial({ prop: 'Toxic', colour: TOX_COLOUR, value: tox.net, text: String(tox.net), unknown: tox.unknown, purified: Math.min(tox.raw, tox.purify), tox: true, tick: null, bonus: 0, title: `Toxic ${tox.net}${tox.purify ? ` (${Math.min(tox.raw, tox.purify)} purified)` : ''}` },
        outcome && outcome.failed ? '<span class="bad"><b>failed</b></span>' : tox.net ? `<span class="bad"><b>${tox.failText}</b> fail</span>` : tox.raw ? `<span style="color:${PUR_COLOUR}">purified</span>` : tox.unknown ? '<span class="muted">unknown</span>' : '<span class="muted">no roll</span>')}
    </div>
    ${title || (!b.result && b.unnoted) ? `<div class="vfoot">${title ? `<span class="ph">${esc(title)}</span>` : ''}${!b.result && b.unnoted ? `<span class="muted">${b.unnoted} unnoted herb${b.unnoted > 1 ? 's' : ''} not shown</span>` : ''}</div>` : ''}
  </div>`;
}

    <span class="pn">${esc(m.name)}</span><span class="ps">${esc(m.open ? m.station : 'Dark')}</span></button>`;
  return `<section class="frame">

      <div class="pgrp"><span class="pg-l">Making · consumables</span><div class="picks">${makes.filter(m => m.group === 'consumables').map(pick).join('')}</div></div>
    </div>

      <div class="say">${esc(st.alchemist)}: ${esc(st.line)}</div>
      <div class="shop">
        <span class="pg-l">Rumours for sale</span>
        ${rum.length ? `<select id="rumour" data-ch="rumour">${rum.map(r => `<option value="${esc(r.key)}" ${r.key === ui.rumourKey ? 'selected' : ''}>${esc(r.name)} — ${Math.floor(r.price / 10000) ? Math.floor(r.price / 10000) + 'g ' : ''}${Math.floor(r.price / 100) % 100}s</option>`).join('')}</select>
        <button class="btn small" data-act="rumour">Buy rumour</button>` : '<span class="muted">Nothing left to tell at this table.</span>'}
        <span class="muted" style="font-size:13px">A Rumour gives one grade's exact threshold. ${esc(st.alchemist)} knows the ${realm.tables().find(t => t.id === st.table).tiers.map(plain).join(', ')} grades.</span>

function workspace(m) {
  const slots = ui.slots[m.id], target = ui.target[m.id], res = ui.result[m.id];
  if (!m.open) return `<div class="work closed"><p class="opens">${esc(m.name)}s are dark. ${esc(m.opensBy)}</p></div>`;
  const p = realm.preview(m.id, slots, target);
  const grades = realm.gradeKeys().filter(g => g.family === m.family), hybrids = m.id === 'potion' ? realm.gradeKeys().filter(g => g.family === 'hybrid') : [], last = ui.last[m.id];
  const opt = g => `<option value="${esc(g.key)}" ${g.key === target ? 'selected' : ''}>Target: ${esc(g.name)}${g.learned ? '' : g.rumoured ? ' (rumour)' : ' (?)'}</option>`;
  return `<div class="work">
    <div class="wh"><span class="sn">${esc(m.station)}</span><span class="sr">${esc(m.name)} · ${esc(m.rule)}</span></div>
    ${res ? vialsHtml(res.bars, `Result · ${res.name}`, { ready: true, failed: res.failed, known: true, name: res.name, step: '', quality: res.quality }) : vialsHtml(realm.bars(m.id, slots, target), '', p)}
    <div class="wctl">
      ${m.family !== 'flask' ? `<select class="tsel" id="target-${m.id}" data-ch="target" data-make="${m.id}" title="Target">
        <option value="">Target: none (most points wins${m.id === 'potion' ? '; a hybrid forms when two properties clear its ladder' : ''})</option>
        ${hybrids.length ? `<optgroup label="Single potions">${grades.map(opt).join('')}</optgroup><optgroup label="Hybrid potions">${hybrids.map(opt).join('')}</optgroup>` : grades.map(opt).join('')}</select>` : '<span></span>'}
      <span class="cookrow"><button class="btn big" data-act="make" data-v="${m.id}" ${p.ready ? '' : 'disabled'}>${esc(m.verb)}</button>
        ${last ? `<button class="btn ghost small" data-act="again" data-v="${m.id}" title="${esc(stacks(last).map(x => `${realm.nameOf(x.key)} ×${x.count}`).join(', '))}">Same again</button>` : ''}
        ${slots.length ? `<button class="btn ghost small" data-act="clear" data-v="${m.id}">Clear</button>` : ''}</span>
    </div>
    ${trayHtml(m)}
  </div>`;
}

function journalTab() {
  const subs = [['herbs', 'Herb Notes'], ['potion', 'Potions'], ['hybrid', 'Hybrids'], ['oil', 'Weapon oils'], ['tincture', 'Tinctures'], ['essence', 'Essences'], ['flasks', 'Flasks'], ['log', 'Brew Log']];

    <div class="sub">${subs.map(([id, l]) => `<button class="btn small ${ui.jtab === id ? '' : 'ghost'}" data-act="jtab" data-v="${id}">${l}</button>`).join('')}</div>

// Herb Notes as bar profiles: a bar per value the note names, filled once the value is known. The scale is the herb's budget
// once known (the bars then add up to a full width), 8 before that.
function herbPages() {
  return `<div class="pages">${realm.herbNotes().map(h => {
    const scale = h.budget || 8;

    <div class="ph2">${ico(h.key)}<div><h3><span class="namechip q-${h.rarity}">${esc(h.name)}</span></h3><div class="kind">level ${h.level} · ${h.rarity} · ${esc(h.zones)}</div></div></div>
    ${h.state === 'none' ? '<p class="pnote"><i>Unknown. Use it in any craft to find out what it holds.</i></p>' : `<div class="hbars">${h.props.map(p => `<div class="hbar" style="--pc:${p.colour}"><span class="bl">${p.prop}</span><span class="bt">${p.value === null ? '<span class="bq" style="left:0">?</span>' : `<span class="bf" style="width:${Math.min(100, p.value / scale * 100)}%"></span>`}</span><span class="bv">${p.value === null ? '?' : p.value}</span></div>`).join('')}</div>`}

}
// Recipe pages as ladders: one bar per property, each grade a segment with its threshold (or ?), pips for the steps made.

    <div class="dbg"><span class="lab">Gold (copper)</span><div class="r"><input type="number" id="dgold" min="0" value="${st.gold}" data-ch="gold"></div></div>
    <div class="dbg"><span class="lab">Give herbs or fish</span>
      <select id="dgive" data-ch="giveKey">${items.map(k => `<option value="${esc(k)}" ${k === ui.giveKey ? 'selected' : ''}>${esc(realm.nameOf(k))}</option>`).join('')}</select>
      <div class="r"><input type="number" id="dgiven" min="1" value="${ui.giveN}" data-ch="giveN"><button class="btn small" data-act="give">Give</button><button class="btn ghost small" data-act="bundle">Forager's bundle for my level</button></div></div>
    <div class="dbg"><span class="lab">Combat</span><div class="r"><label class="toggle"><input type="checkbox" id="dcombat" data-ch="combat" ${st.inCombat ? 'checked' : ''}> In combat</label></div>
      <div class="r"><input type="number" id="ddmg" min="1" value="${ui.dmg}" data-ch="dmg"><button class="btn small" data-act="dmg">Take damage</button></div></div>
    <div class="dbg"><span class="lab">Learning</span><div class="r"><button class="btn small" data-act="openall">Open every make</button><button class="btn small" data-act="fillnotes">Fill every Herb Note</button></div>
      <select id="dgrade" data-ch="gradeKey">${realm.gradeKeys().map(g => `<option value="${esc(g.key)}" ${g.key === ui.gradeKey ? 'selected' : ''}>${esc(g.family)}: ${esc(g.name)}</option>`).join('')}</select>
      <div class="r"><button class="btn small" data-act="teach">Teach grade</button><button class="btn small" data-act="rumourfree">Rumour grade</button></div></div>
    <div class="dbg"><span class="lab">Tables</span><div class="r"><button class="btn small" data-act="hidden">${ui.hidden ? 'Hide' : 'Show'} hidden tables</button><button class="btn small" data-act="audit">Run realm._audit()</button></div>
      ${a ? `<div class="auditbox ${a.ok ? 'ok' : 'bad'}"><b>${a.ok ? 'Audit passed' : 'Audit FAILED'}</b>: ${a.passed} of ${a.total} checks.
        ${a.failures.map(f => `<div class="bad">✗ ${esc(f.text)}</div>`).join('')}
        ${a.notes.length ? `<details><summary>${a.notes.length} notes (grades that need a roll or stop short of x2 in band)</summary>${a.notes.map(n => `<div>${esc(n)}</div>`).join('')}</details>` : ''}
        <details><summary>All ${a.total} checks</summary>${a.checks.map(c => `<div class="${c.ok ? '' : 'bad'}">${c.ok ? '✓' : '✗'} ${esc(c.text)}</div>`).join('')}</details></div>` : ''}</div>
    <div class="dbg"><span class="lab">Save</span><div class="r"><button class="btn small" data-act="reset">Reset everything</button></div></div>
  </div></aside>`;
}
function hiddenTables() {
  const h = realm.hiddenTables(), a = ui.audit;
  const G = realm.GRADES.map(g => g === 'Standard' ? 'Plain' : g);
  const tbl = (head, rows) => `<div class="scroll"><table class="jt dark"><thead><tr>${head.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return `<div class="banner-wrap" data-act="hidden"><div class="frame banner hid" data-act="noop">
    <div class="fh">Hidden tables <button class="btn ghost small" data-act="hidden">Close</button></div>
    <div class="fb" style="display:grid;gap:14px;text-align:left">
      <div><div class="pg-l">Herbs</div>${tbl(['Herb', 'Level', 'Rarity', 'Budget', 'Values'], h.herbs.map(x => [esc(x.name), x.level, x.rarity, x.budget, esc(x.values)]))}</div>
      <div><div class="pg-l">The Toxic rule</div>${h.toxic.map(l => `<div>${esc(l)}</div>`).join('')}</div>
      <div><div class="pg-l">Thresholds, the same for every property</div>${tbl(['Family', ...G], h.ladders.map(l => [l.family, ...l.cells]))}</div>
      ${h.effects.map(t => `<div><div class="pg-l">${t.family} effects at x1 · each grade is ×${h.gradeMult} the one below · a step multiplies every number</div>${tbl(['Product', ...G], t.rows.map(r => [esc(r.name), ...r.cells.map(esc)]))}</div>`).join('')}
      <div><div class="pg-l">Flask stat per Essence at x1</div>${tbl(['Essence', 'Stat', ...G], h.flasks.map(r => [r.prop, esc(r.label), ...r.cells]))}</div>
      <div><div class="pg-l">Rumour prices</div>${tbl(['Grade', 'Price'], Object.entries(h.rumourPrices).map(([g, p]) => [plain(g), money(p)]))}</div>
      ${a ? `<div><div class="pg-l">Best step reachable in each grade's band (from the audit)</div>${tbl(['Grade', 'Best step'], Object.entries(a.bestStep).map(([k, s]) => { const [f, p, g] = k.split('|'); return [esc(realm.nameOf(`${f}|${p}|${g}|1`)), s ? realm.fmtStep(s) : '—']; }))}</div>` : '<div class="muted">Run the audit to see the best step each band reaches.</div>'}
    </div></div></div>`;
}

// ---------- actions ----------
function addToStation(k, n) {
  const id = ui.making, m = makeOf(id), room = realm.room(id, k, ui.slots[id], m.fill);
  ui.tab = 'bench'; delete ui.result[id];
  const add = Math.min(room, n);
  if (add > 0) { for (let i = 0; i < add; i++) ui.slots[id].push(k); return; }
  const kind = realm.kindOf(k);
  push([{ t: 'error', text: !m.accepts[kind] ? `A ${m.name} does not take ${KIND_LABEL[kind] ? KIND_LABEL[kind].toLowerCase() : 'that'}.` : realm.count(k) <= ui.slots[id].filter(x => x === k).length ? `No ${realm.nameOf(k)} left to add.` : `The ${m.station} is full.` }]);
}
function setTarget(gk) {
  const [family] = gk.split('|'), id = realm.MAKE_OF_FAMILY[family];
  if (!id) return;
  ui.target[id] = gk; ui.making = id; ui.tab = 'bench';
}
function dropMissing() { for (const id of Object.keys(ui.slots)) { const used = {}; ui.slots[id] = ui.slots[id].filter(k => { used[k] = (used[k] || 0) + 1; return realm.count(k) >= used[k]; }); } }

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  hideTip();
  switch (a) {
    case 'noop': e.stopPropagation(); return;
    case 'tab': ui.tab = v; break;
    case 'jtab': ui.jtab = v; break;
    case 'debug': ui.debug = !ui.debug; break;
    case 'hidden': ui.hidden = !ui.hidden; break;
    case 'making': ui.making = v; break;
    case 'add': addToStation(v, 1); break;
    case 'fill': addToStation(v, 99); break;
    case 'less': { const [id, k] = [v.split('|')[0], v.slice(v.indexOf('|') + 1)]; const i = ui.slots[id].lastIndexOf(k); if (i >= 0) ui.slots[id].splice(i, 1); delete ui.result[id]; break; }
    case 'none': { const [id, k] = [v.split('|')[0], v.slice(v.indexOf('|') + 1)]; ui.slots[id] = ui.slots[id].filter(x => x !== k); delete ui.result[id]; break; }
    case 'clear': ui.slots[v] = []; delete ui.result[v]; break;
    case 'target': setTarget(v); break;
    case 'make': {
      const inputs = ui.slots[v].slice(), res = realm.make(v, inputs, ui.target[v]);
      push(res.msgs);
      if (res.ok) { ui.last[v] = inputs; ui.slots[v] = []; dropMissing(); ui.flash = true; ui.result[v] = { bars: res.events.bars, name: res.events.resultName, failed: res.events.failed, quality: res.events.product ? realm.qualityOf(res.events.product) : 'poor' }; }
      break;
    }
    case 'again': {
      const last = ui.last[v] || [], short = stacks(last).find(x => realm.count(x.key) < x.count);
      if (short) push([{ t: 'error', text: `Not enough ${realm.nameOf(short.key)} for that again (${realm.count(short.key)} of ${short.count}).` }]);
      else { ui.slots[v] = last.slice(); delete ui.result[v]; }
      break;
    }
    case 'skip': push(realm.advance(+v)); break;
    case 'swing': push(realm.swing()); break;
    case 'drink': push(realm.drink(v)); ui.flash = true; break;
    case 'oil-main': push(realm.applyOil(v, 'main')); break;
    case 'oil-off': push(realm.applyOil(v, 'off')); break;
    case 'flask': push(realm.useFlask(v)); ui.flash = true; break;
    case 'sell': push(realm.sellSludge()); break;
    case 'rumour': if (ui.rumourKey) push(realm.buyRumour(ui.rumourKey)); break;
    case 'give': push(realm.give(ui.giveKey, ui.giveN)); break;
    case 'bundle': push(realm.giveBundle()); break;
    case 'dmg': push(realm.takeDamage(ui.dmg)); break;
    case 'openall': push(realm.openAll()); break;
    case 'fillnotes': push(realm.fillNotes()); break;
    case 'teach': push(realm.teach(ui.gradeKey)); break;
    case 'rumourfree': push(realm.rumourFree(ui.gradeKey)); break;
    case 'audit': ui.audit = realm._audit(); break;
    case 'reset': realm.reset(); Object.keys(ui.slots).forEach(id => { ui.slots[id] = []; ui.target[id] = null; }); ui.last = {}; ui.result = {}; ui.log = []; ui.audit = null; ui.making = 'potion'; ui.tab = 'bench'; push(realm.setTable(realm.status().table)); break;
  }
  render();
});
$app.addEventListener('change', e => {
  const el = e.target;
  switch (el.dataset.ch) {
    case 'table': after(realm.setTable(el.value)); break;
    case 'target': { const id = el.dataset.make; ui.target[id] = el.value || null; render(); break; }
    case 'rumour': ui.rumourKey = el.value; break;
    case 'giveKey': ui.giveKey = el.value; break;
    case 'giveN': ui.giveN = Math.max(1, Math.floor(+el.value) || 1); break;
    case 'gradeKey': ui.gradeKey = el.value; break;
    case 'dmg': ui.dmg = Math.max(1, Math.floor(+el.value) || 1); break;
    case 'level': realm.setLevel(+el.value); render(); break;
    case 'gold': realm.setGold(+el.value); render(); break;
    case 'combat': after(realm.setCombat(el.checked)); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.hidden) { ui.hidden = false; render(); } });

// ---------- tooltip ----------
function showTip(el, x, y) {
  const d = realm.describe(el.dataset.tip);
  $tip.innerHTML = `<div class="tn q-${d.quality}">${esc(d.name)}</div>${d.lines.map(l => `<div class="${l.c || ''}">${esc(l.text)}</div>`).join('')}`;
  $tip.hidden = false;
  const r = $tip.getBoundingClientRect();
  let left = x + 16, top = y + 16;
  if (left + r.width > innerWidth - 8) left = Math.max(8, x - r.width - 12);
  if (top + r.height > innerHeight - 8) top = Math.max(8, y - r.height - 12);
  $tip.style.left = left + 'px'; $tip.style.top = top + 'px';
}
function hideTip() { $tip.hidden = true; }
document.addEventListener('mousemove', e => { const el = e.target.closest?.('[data-tip]'); if (el && !ui.hidden) showTip(el, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('scroll', hideTip, true);

push(realm.setTable(realm.status().table));
render();
</script>

</body></html>
