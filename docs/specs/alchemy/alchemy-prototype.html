<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Twilight's Eve Alchemy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: a 1.12 game screen, the frame shared with the Kitchen prototype. Discoveries, the two bag panels and Character on the left; one bench and the journal on the right.
   Dark stone panels with a bronze edge; parchment only for paper (the journal). One committed dark look, so no light theme. */
:root {
  color-scheme: dark;
  --ground: #0c0a08;
  --stone: #1c1813;
  --stone-hi: #2a241c;
  --edge: #6e5a39;
  --edge-dark: #2e2518;
  --text: #ebe1c8;
  --muted: #a3967b;
  --gold: #ffd100;
  --parch: #e6d3a5;
  --parch-dark: #cdb27b;
  --ink: #2c1e0e;
  --ink-muted: #6b5434;
  --q-poor: #9d9d9d;
  --q-common: #ffffff;
  --q-uncommon: #1eff00;
  --q-rare: #2f8cff;
  --q-epic: #a335ee;
  --q-legendary: #ff8000;
  --good: #3fdc3f;
  --bad: #ff4b3e;
  --tip-bg: rgba(6, 8, 22, .96);
  --font-display: "Marcellus SC", "Palatino Linotype", Georgia, serif;
  --font-body: "Alegreya Sans", "Trebuchet MS", Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--ground);
  background-image: radial-gradient(ellipse at 50% -10%, #2a2216 0%, transparent 60%);
  color: var(--text); font: 15px/1.4 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
button, select, input { font: inherit; color: inherit; }
.q-poor { color: var(--q-poor); } .q-common { color: var(--q-common); } .q-uncommon { color: var(--q-uncommon); }
.q-rare { color: var(--q-rare); } .q-epic { color: var(--q-epic); } .q-legendary { color: var(--q-legendary); }
.gold-t { color: var(--gold); } .muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.frame {
  background: linear-gradient(180deg, var(--stone-hi), var(--stone) 40%);
  border: 2px solid var(--edge); border-radius: 4px;
  box-shadow: inset 0 0 0 1px #000, inset 0 0 0 3px var(--edge-dark), 0 3px 10px #000;
  min-width: 0;
}
.fh {
  margin: 0; padding: 8px 12px 6px; font: 17px/1.2 var(--font-display); color: var(--gold);
  text-shadow: 0 1px 0 #000; border-bottom: 1px solid var(--edge-dark);
  display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap;
}
.fh small { font: 13px var(--font-body); color: var(--muted); text-shadow: none; }
.fb { padding: 10px 12px 12px; }

.btn {
  background: linear-gradient(180deg, #8c1a10, #5a0d07); border: 1px solid #c49a4a; border-radius: 3px;
  color: var(--gold); padding: 5px 12px; cursor: pointer; font: 14px var(--font-display);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 1px 2px #000; text-shadow: 0 1px 0 #000;
}
.btn:hover:not(:disabled) { filter: brightness(1.2); }
.btn:disabled { background: linear-gradient(180deg, #3b3530, #2a2622); color: #7d7468; border-color: #5c5245; cursor: not-allowed; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn.inl { padding: 2px 8px; font-size: 12.5px; }
.btn.ghost { background: rgba(0,0,0,.35); border-color: var(--edge); color: var(--text); }
select, input[type=number] { background: #0d0b08; border: 1px solid var(--edge); border-radius: 3px; padding: 4px 6px; min-width: 0; max-width: 100%; }

/* top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 12px; padding: 8px 14px; }
.brand { font: 24px/1 var(--font-display); color: var(--gold); text-shadow: 0 2px 0 #000; margin: 0; }
.brand span { display: block; font: 12px var(--font-body); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-top: 3px; text-shadow: none; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--edge-dark); border-radius: 3px; background: rgba(0,0,0,.35); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.combat { border-color: var(--bad); color: var(--bad); }
.clockbtns { display: inline-flex; gap: 4px; }
.money .g { color: #ffd700; } .money .s { color: #c7c7cf; } .money .c { color: #c8733b; }

.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 12px; min-width: 0; }

/* discoveries */
.disc { display: grid; gap: 4px; }
.drow { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.drow b { font-weight: 500; color: var(--text); text-align: right; }
.next { margin: 8px 0 0; padding: 7px 9px; background: rgba(0,0,0,.35); border: 1px solid var(--edge-dark); border-radius: 3px; font-size: 14px; }
.next .lbl { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); margin-bottom: 2px; }

/* character */
.stats { display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.stat { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: baseline; padding: 2px 4px; border-radius: 2px; }
.stat .v { color: var(--text); min-width: 2.5ch; text-align: right; }
.stat .b { color: var(--good); min-width: 3.5ch; text-align: right; font-weight: 700; }
.stat.up .v { color: var(--good); }
.stat .lbl { color: var(--gold); }
.hp { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; padding: 2px 4px 4px; border-bottom: 1px solid var(--edge-dark); margin-bottom: 4px; }
.effects { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--edge-dark); display: grid; gap: 3px; font-size: 14px; }
.eff { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.eff .on { color: var(--good); font-weight: 500; } .eff .off { color: #7f776b; }
.eff .tag { color: var(--bad); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.timer { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 400; }
.buffline { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; padding: 6px 8px; background: rgba(0,0,0,.35); border: 1px solid var(--edge-dark); border-radius: 3px; }
.nobuff { color: var(--muted); font-style: italic; font-size: 14px; margin: 0 0 8px; }
.cookrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.clog { margin-top: 8px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 30% { background: rgba(63, 220, 63, .28); } 100% { background: transparent; } }
}

/* icons: a square with a glyph, tinted by hue, bordered in the quality colour (products: the property colour) */
.ico {
  --h: 30; width: 30px; height: 30px; flex: none; position: relative; border-radius: 3px; border: 2px solid #8a8a8a;
  background: radial-gradient(circle at 35% 30%, hsl(var(--h) 55% 46%), hsl(var(--h) 50% 18%) 75%);
  box-shadow: inset 0 0 6px #000; display: grid; place-items: center; font: 11px var(--font-display); color: rgba(255,255,255,.92); text-shadow: 0 1px 2px #000;
}
.ico.b-poor { border-color: var(--q-poor); } .ico.b-uncommon { border-color: var(--q-uncommon); } .ico.b-rare { border-color: var(--q-rare); } .ico.b-epic { border-color: var(--q-epic); } .ico.b-legendary { border-color: var(--q-legendary); }

/* tabs */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: linear-gradient(180deg, #2b241b, #16130f); border: 2px solid var(--edge); border-bottom: none; border-radius: 6px 6px 0 0; padding: 6px 16px 4px; font: 15px var(--font-display); color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--gold); background: linear-gradient(180deg, #3a3022, var(--stone-hi)); }

/* bags and satchel */
.pantry { display: grid; gap: 10px; }
.pg { display: grid; gap: 4px; }
.pg-l { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.cards { display: flex; flex-wrap: wrap; gap: 6px; }
.card {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px; align-items: center; text-align: left;
  background: linear-gradient(180deg, #231d15, #15110c); border: 1px solid var(--edge-dark); border-radius: 3px; padding: 4px 9px 4px 4px; cursor: pointer; max-width: 100%;
}
.card:hover:not(:disabled):not(.static) { border-color: var(--gold); }
.card.static { cursor: default; }
.card .ct { display: grid; min-width: 0; }
.card .cn { font-weight: 500; line-height: 1.15; font-size: 14px; }
.card .cm { font-size: 12px; color: var(--muted); line-height: 1.15; font-variant-numeric: tabular-nums; }
.cardrow { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; max-width: 100%; }
.mat { display: inline-flex; gap: 3px; align-items: stretch; max-width: 100%; }
.mat.off { opacity: .35; }
.mat.used .card { border-color: var(--gold); }
.mat .card:disabled { opacity: .6; cursor: not-allowed; }
.mat.off .card:disabled { opacity: 1; }
.card .chips { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }
.mk { display: inline-block; padding: 0 4px; border-radius: 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .02em; line-height: 1.5; color: var(--pc); border: 1px solid var(--pc); opacity: .8; }
.mk.tgt { opacity: 1; background: rgba(255,255,255,.06); }
.mk.tox { color: var(--pc); } .mk.pur { color: #c9d6de; border-color: #c9d6de; }
.mk.dim { color: var(--muted); border-color: var(--edge-dark); font-weight: 400; font-style: italic; }
.dimnote { text-transform: none; letter-spacing: 0; font-style: italic; }

/* bench: a picker of what to make, then one workspace whose heart is the property bars */
.picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 16px; padding: 12px 12px 4px; }
.pgrp { display: grid; gap: 4px; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { display: grid; gap: 1px; text-align: left; padding: 5px 10px; min-width: 96px; background: linear-gradient(180deg, #231d15, #15110c); border: 2px solid var(--edge-dark); border-radius: 4px; cursor: pointer; }
.pick .pn { font: 15px var(--font-display); color: var(--text); }
.pick .ps { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pick.on { border-color: var(--gold); background: rgba(255, 209, 0, .08); } .pick.on .pn { color: var(--gold); }
.pick.closed { opacity: .45; cursor: not-allowed; background: repeating-linear-gradient(45deg, #110e0a 0 6px, #171310 6px 12px); }
.work { margin: 8px 12px 12px; border: 2px solid var(--edge); border-radius: 4px; background: rgba(0,0,0,.3); padding: 10px 12px 12px; display: grid; gap: 8px; }
.work.closed { opacity: .7; }
.work .wh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.work .sn { font: 19px var(--font-display); color: var(--gold); text-shadow: 0 1px 0 #000; }
.work .sr { font-size: 13px; color: var(--muted); }
.work .opens { margin: 0; color: var(--muted); font-style: italic; }
.trow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.trow .tsel { flex: 1 1 200px; max-width: 420px; font-size: 13px; padding: 3px 5px; }
.sslots { display: flex; flex-wrap: wrap; gap: 4px; }
.slot { min-height: 36px; border: 2px dashed #5b4b33; border-radius: 4px; background: #0d0b08; padding: 2px 7px; text-align: left; display: flex; align-items: center; gap: 7px; font-size: 14px; }
.slot .empty { color: #6d6150; font-style: italic; font-size: 13px; }
.slot.filled { border-style: solid; border-color: var(--edge); background: linear-gradient(180deg, #2b2419, #17130e); color: var(--text); }
.slot .sv { font-weight: 500; line-height: 1.15; min-width: 0; }
.sbtns { margin-left: 6px; display: inline-flex; gap: 3px; }
.aimb { font: 12px var(--font-body); min-width: 24px; text-align: center; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--edge-dark); background: #0d0b08; color: var(--muted); cursor: pointer; }
.aimb:hover { color: var(--text); border-color: var(--edge); }
/* vials: the bulk of the bench */
.vials { display: grid; gap: 6px; padding: 8px 10px 10px; border: 1px solid var(--edge-dark); border-radius: 4px; background: radial-gradient(ellipse at 50% 100%, rgba(255, 209, 0, .05), transparent 60%), rgba(0,0,0,.3); }
.vials.result { border-color: var(--good); background: radial-gradient(ellipse at 50% 100%, rgba(63, 220, 63, .08), transparent 60%), rgba(0,0,0,.3); }
.vials.failed { border-color: var(--bad); background: radial-gradient(ellipse at 50% 100%, rgba(255, 75, 62, .1), transparent 60%), rgba(0,0,0,.3); }
.vfoot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; padding-top: 4px; }
.vfoot .ph { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.vials.result .vfoot .ph { color: var(--good); } .vials.failed .vfoot .ph { color: var(--bad); }
.vials .bh2 { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.vials .ph { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.vials.result .ph { color: var(--good); }
.vrow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; padding-top: 4px; }
.vcol { display: grid; justify-items: center; gap: 2px; min-width: 0; --pc: var(--muted); }
.vial { position: relative; width: min(100%, 92px); aspect-ratio: 1 / 3.3; }
.vial .neck { position: absolute; top: 0; left: 24%; right: 24%; height: 7%; border: 2px solid rgba(214, 226, 236, .5); border-bottom: none; border-radius: 5px 5px 0 0; background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.14) 35%, rgba(0,0,0,.2) 75%); }
.vial .neck::before { content: ''; position: absolute; left: -14%; right: -14%; top: -4px; height: 5px; border-radius: 3px; background: linear-gradient(180deg, #8d7a55, #4a3d28); box-shadow: 0 1px 2px #000; }
.vial .glass { position: absolute; left: 0; right: 0; top: 7%; bottom: 0; overflow: hidden; border: 2px solid rgba(214, 226, 236, .5); border-top-color: rgba(214, 226, 236, .25); border-radius: 10px 10px 46% 46% / 8px 8px 22% 22%; background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.13) 32%, rgba(0,0,0,.28) 78%, rgba(0,0,0,.4)); box-shadow: inset 0 -10px 18px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.4), 0 2px 6px #000; }
.vial .liquid { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--pc) 78%, white) 0, var(--pc) 28%, color-mix(in srgb, var(--pc) 72%, black) 100%); box-shadow: inset 0 6px 10px rgba(255,255,255,.12); }
.vial .liquid::before { content: ''; position: absolute; left: 0; right: 0; top: -2px; height: 5px; border-radius: 50%; background: color-mix(in srgb, var(--pc) 55%, white); opacity: .85; }
.vial .liquid::after { content: ''; position: absolute; left: 18%; width: 10%; top: 10%; bottom: 8%; border-radius: 6px; background: rgba(255,255,255,.14); }
.vial .bonus { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(-45deg, var(--pc) 0 4px, transparent 4px 9px); opacity: .55; }
.vial .purified { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(-45deg, #c9d6de 0 3px, transparent 3px 8px); opacity: .45; }
@media (prefers-reduced-motion: no-preference) { .vial .liquid, .vial .bonus, .vial .purified { transition: height .45s ease-out, bottom .45s ease-out; } }
.vial .ring { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(214, 226, 236, .32); }
.vial .ring i { position: absolute; right: 4px; top: -7px; font: 9.5px var(--font-body); font-style: normal; color: rgba(214, 226, 236, .55); text-shadow: 0 1px 1px #000; }
.vial .ring.gold { border-top: 2px solid var(--gold); box-shadow: 0 0 4px rgba(255, 209, 0, .6); } .vial .ring.gold i { color: var(--gold); top: -9px; font-weight: 700; }
.vial .q { position: absolute; left: 50%; transform: translate(-50%, 4px); width: 20px; height: 20px; display: grid; place-items: center; font: 700 12px/1 var(--font-body); color: var(--pc); background: #15110c; border: 1px solid var(--pc); border-radius: 50%; margin-bottom: 4px; }
.vial .shine { position: absolute; top: 4%; bottom: 10%; left: 9%; width: 9%; border-radius: 8px; background: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,.04)); pointer-events: none; }
.vcol.main .vial .glass { border-color: color-mix(in srgb, var(--pc) 70%, white); box-shadow: inset 0 -10px 18px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.4), 0 0 14px color-mix(in srgb, var(--pc) 45%, transparent), 0 2px 6px #000; }
.vcol.toxv .vial .glass { border-color: rgba(92, 214, 92, .45); }
.vlab { font: 13px var(--font-display); color: var(--pc); text-shadow: 0 1px 0 #000; margin-top: 4px; text-align: center; }
.vcol.main .vlab { color: var(--gold); }
.vval { font-size: 20px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; text-align: center; }
.vval .vbonus { font-size: 13px; color: var(--pc); margin-left: 3px; }
.vnote { font-size: 12.5px; text-align: center; line-height: 1.2; min-height: 15px; max-width: 100%; }
.vcol.main .vnote { font-weight: 500; }
.vnote.bad, .vnote .bad { color: var(--bad); }
.novials { padding: 24px 12px; text-align: center; color: var(--muted); font-style: italic; border: 1px dashed var(--edge-dark); border-radius: 4px; }
.toxline { font-size: 13px; color: var(--muted); text-align: center; padding-top: 2px; }
.toxline .bad { color: var(--bad); }
.wctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.wctl .tsel { flex: 1 1 240px; max-width: 420px; font-size: 13px; padding: 4px 6px; }
.tray { display: grid; gap: 8px; padding: 8px 10px 10px; border: 1px solid var(--edge-dark); border-radius: 4px; background: rgba(0,0,0,.2); }
.tg { display: grid; gap: 4px; }
.tc { display: inline-flex; gap: 3px; align-items: stretch; max-width: 100%; }
.tc.used .card { border-color: var(--gold); }
.tc .card:disabled { opacity: .45; cursor: not-allowed; }
.tc .inb { display: inline-flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; padding: 0 2px; }
.tc .inb b { color: var(--gold); font-size: 12px; white-space: nowrap; }
.tc .fillb { align-self: center; }
@media (max-width: 520px) { .vial { aspect-ratio: 1 / 2.6; } .vial .ring i { display: none; } .vlab { font-size: 11px; } .vval { font-size: 15px; } }
.bars { display: grid; gap: 4px; padding: 8px 10px 9px; border: 1px solid var(--edge-dark); border-radius: 4px; background: rgba(0,0,0,.3); }
.bars.result { border-color: var(--good); background: rgba(63, 220, 63, .05); }
.bars .bh2 { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; margin-bottom: 2px; }
.bars .ph { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.bars.result .ph { color: var(--good); }
.bar { display: grid; grid-template-columns: 76px minmax(0, 1fr) 54px; gap: 6px; align-items: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.bar .bl { color: var(--pc); opacity: .7; }
.bar.main .bl, .bar.toxrow .bl { opacity: 1; } .bar.tgt .bl { font-weight: 700; }
.bar .bt { position: relative; height: 12px; background: #0d0b08; border: 1px solid var(--edge-dark); border-radius: 2px; }
.bar .bf { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pc); border-radius: 1px; box-shadow: inset 0 0 3px rgba(0,0,0,.5); }
.bar .bb { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, var(--pc) 0 3px, transparent 3px 6px); opacity: .7; }

<script>
// ============================================================
// realm — every alchemy rule lives here. The UI only asks.
//
// Rules index (spec #447 as amended in this prototype):
//   1. PROPS, TOXIC, PURIFY ... five product properties; Toxic is risk; Purifying cancels Toxic
//   2. HERBS, FISH ............ the herb table (every value, Toxic and Purifying included, adds up to the budget)
//   3. GRADES, LADDER ......... four grades on one ladder per product family, the same for every property
//   4. Toxic rule ............. failChance(), payoff(), carried(): the roll every craft makes, and what travels up the ladder
//   5. EFFECTS, HYBRIDS, FLASK_STAT .. effect numbers per grade; a step multiplies them. Ten hybrid potions, one per pair
//   6. MAKES, resolve ......... the five things the bench makes and what each turns its inputs into
//   7. make() ................. rolls, consumes items, teaches grades, opens makes, logs
//   8. character / advance / drink / applyOil / useFlask / swing
//   9. TABLES, rumours ........ the three tables and their Rumour vendors
//  10. _audit() ............... checks budgets and reachability, safe and risky
// ============================================================
const realm = (() => {
  'use strict';

  // ---------- 1. properties ----------
  // Five properties make products. Toxic makes nothing: it is the chance a craft fails, and the power it pays when it holds.
  // Purifying makes nothing either: each point cancels one Toxic point in the same craft.
  const PROPS = ['Restorative', 'Fortifying', 'Volatile', 'Arcane', 'Calming'];
  const TOXIC = 'Toxic', PURIFY = 'Purifying';
  const ALL_VALUES = [...PROPS, TOXIC, PURIFY];
  const PROP_HUE = { Restorative: 0, Fortifying: 38, Volatile: 22, Arcane: 270, Calming: 186, Toxic: 110, Purifying: 200 };
  const PROP_COLOUR = { Restorative: '#e85050', Fortifying: '#f0a830', Volatile: '#ff7a1a', Arcane: '#b56cff', Calming: '#3fd3e0', Toxic: '#5cd65c', Purifying: '#c9d6de' };

  // ---------- 2. herbs and fish ----------
  // Budget = 2 + floor(level / 5), +1 uncommon, +2 rare, +4 legendary. Every value, Toxic and Purifying included, adds up to it (audited).
  const RARITY_BONUS = { common: 0, uncommon: 1, rare: 2, legendary: 4 };
  const HERBS = [
    // name, level, rarity, found in, values, icon hue, icon glyph
    ['Peacebloom', 1, 'common', 'Elwynn', { Restorative: 2 }, 48, 'Pb'],
    ['Silverleaf', 1, 'common', 'Elwynn', { Arcane: 1, Calming: 1 }, 200, 'Sl'],
    ['Amber Sap', 1, 'uncommon', 'every zone', { Volatile: 2, Toxic: 1 }, 36, 'As'],
    ["Bird's Nest", 1, 'rare', 'every zone', { Restorative: 2, Calming: 1, Arcane: 1 }, 28, 'Bn'],
    ['Earthroot', 3, 'common', 'Elwynn, Redridge', { Fortifying: 1, Purifying: 1 }, 22, 'Er'],
    ['Mageroyal', 10, 'uncommon', 'Elwynn, Redridge', { Arcane: 4, Restorative: 1 }, 280, 'Mr'],
    ['Swiftthistle', 10, 'rare', 'Elwynn, Redridge', { Calming: 3, Volatile: 3 }, 95, 'St'],
    ['Briarthorn', 14, 'uncommon', 'Elwynn, Redridge, Duskwood', { Fortifying: 2, Toxic: 3 }, 130, 'Bt'],
    ['Moonpetal', 14, 'legendary', 'Elwynn, night only', { Arcane: 3, Calming: 3, Restorative: 2 }, 232, 'Mp'],
    ['Stranglekelp', 17, 'uncommon', 'Redridge', { Restorative: 3, Purifying: 3 }, 160, 'Sk'],
    ['Gravecap', 18, 'uncommon', 'Duskwood', { Volatile: 4, Toxic: 2 }, 78, 'Gc'],
    ['Hill Truffle', 18, 'rare', 'Redridge', { Fortifying: 5, Restorative: 2 }, 32, 'Ht'],
    ['Bruiseweed', 20, 'uncommon', 'Redridge, Duskwood', { Restorative: 5, Fortifying: 2 }, 300, 'Bw'],
    ['Emberbloom', 20, 'legendary', 'Redridge', { Volatile: 7, Fortifying: 3 }, 14, 'Eb'],
    ['Black Truffle', 22, 'rare', 'Duskwood', { Calming: 5, Arcane: 3 }, 262, 'Bk'],
    ['Wild Steelbloom', 23, 'uncommon', 'Duskwood', { Fortifying: 5, Volatile: 2 }, 212, 'Ws'],
    ['Grave Moss', 24, 'uncommon', 'Duskwood', { Arcane: 4, Toxic: 3 }, 118, 'Gm'],
    ['Kingsblood', 25, 'rare', 'Duskwood', { Restorative: 6, Volatile: 3 }, 350, 'Kb'],
    ["Widow's Lily", 25, 'legendary', 'Duskwood, night only', { Calming: 8, Toxic: 3 }, 296, 'Wl'],
  ].map(([name, level, rarity, zones, values, hue, glyph]) => ({ name, level, rarity, zones, values, hue, glyph, budget: 2 + Math.floor(level / 5) + RARITY_BONUS[rarity] }));
  const HERB = Object.fromEntries(HERBS.map(h => [h.name, h]));

  // Fish go into weapon oils, two at a time; their kind never matters.
  const FISH = [
    ['Goldshire Perch', 'common', 205, 'Gp'], ['Northshire Brook Trout', 'common', 190, 'Bt'], ['Brilliant Smallfish', 'common', 60, 'Bs'],
    ['Redridge Bluegill', 'common', 215, 'Rb'], ['Oily Blackmouth', 'uncommon', 240, 'Ob'], ['Ravenwood Chub', 'common', 160, 'Rc'],
  ].map(([name, rarity, hue, glyph]) => ({ name, rarity, hue, glyph }));
  const FISH_BY = Object.fromEntries(FISH.map(f => [f.name, f]));

  // ---------- 3. grades and ladders ----------
  // 'Standard' is the plain grade: its item name carries no prefix.
  const GRADES = ['Minor', 'Lesser', 'Standard', 'Greater'];
  const GRADE_BAND = { Minor: 1, Lesser: 10, Standard: 20, Greater: 30 };
  const BAND_TOP = { Minor: 9, Lesser: 19, Standard: 29, Greater: 30 };
  const STEPS = [1, 1.25, 1.5, 1.75, 2];
  const stepOf = ratio => ratio >= 2 ? 2 : ratio >= 1.75 ? 1.75 : ratio >= 1.5 ? 1.5 : ratio >= 1.25 ? 1.25 : 1;
  const GRADE_QUALITY = { Minor: 'common', Lesser: 'uncommon', Standard: 'rare', Greater: 'epic' };
  const gradeName = (grade, base) => grade === 'Standard' ? base : `${grade} ${base}`;
  const GI = g => GRADES.indexOf(g);
  // Each grade's threshold is four of its band's best uncommon herb (five at the Still), so a band's ordinary herbs reach their
  // own grade at about x1 and the next grade takes the band's rare, a legendary, or a Toxic roll. Bands are meant to hold.
  //   potions 4 / 12 / 20 / 28 · tinctures 5 / 15 / 25 / 35 · oils 2x the tincture ladder · essences 3x the tincture ladder
  // Greater has no clean herbs (nothing above level 25): it is the gamble grade, reached with Emberbloom or a Toxic roll.
  // A make always gives the highest grade it meets, at that grade's step (points / threshold, rounded down to x1 .. x2).
  // Hybrid potions: two properties that both clear the hybrid ladder make the pair's own potion instead of a single one, at the
  // lower of the two grades. The ladder is lower per property than a single potion's, so a hybrid is a real choice, not an accident.
  const LADDER = { potion: [4, 12, 20, 28], hybrid: [3, 9, 15, 21], tincture: [5, 15, 25, 35], oil: [10, 30, 50, 70], essence: [15, 45, 75, 105] };
  const PAIRS = [];
  for (let i = 0; i < PROPS.length; i++) for (let j = i + 1; j < PROPS.length; j++) PAIRS.push(`${PROPS[i]}+${PROPS[j]}`);
  const pairProps = pair => pair.split('+');
  const THRESHOLD = {};
  for (const f of Object.keys(LADDER)) { THRESHOLD[f] = {}; for (const p of f === 'hybrid' ? PAIRS : PROPS) { THRESHOLD[f][p] = {}; GRADES.forEach((g, i) => { THRESHOLD[f][p][g] = LADDER[f][i]; }); } }
  function gradeFor(family, prop, pts) {
    for (let i = GRADES.length - 1; i >= 0; i--) {
      const g = GRADES[i], N = THRESHOLD[family][prop][g];
      if (pts >= N) return { grade: g, step: stepOf(pts / N), N };
    }
    return null;
  }

  // ---------- 4. the Toxic rule ----------
  // One rule for every craft. Net Toxic = Toxic in minus Purifying in, never below 0. Every craft rolls once:
  //   fail chance = net Toxic / (net Toxic + main points). A fail is Murky Sludge.
  //   When it holds, every net Toxic point pays PAYOFF points into the product (a flask splits them between its two Essences).
  // Toxic travels: a Tincture or Essence carries floor(net Toxic x STILL_KEEP) of the craft that made it, and rolls again wherever
  // it goes next. Potions, oils and flasks are the end of the line. Any craft that takes no herbs for its body may add up to
  // WASH herbs as a wash: only their Toxic and Purifying count, everything else is lost. That is how a purifier helps an oil or a flask.
  const PAYOFF = 1, STILL_KEEP = 0.5, WASH = 2;
  const failChance = (tox, main) => tox <= 0 ? 0 : main <= 0 ? 1 : tox / (tox + main);
  const payoff = tox => tox * PAYOFF;
  const carriedToxic = tox => Math.floor(tox * STILL_KEEP);
  const pct = x => `${Math.round(x * 100)}%`;

  // ---------- 5. effects (placeholders on vanilla's scale; a step multiplies every number) ----------
  // Every effect is a Minor base, and each grade is GRADE_MULT times the one below (tidied: whole numbers, to 5 above 100, to 10
  // above 1000). So Minor Healing 70 to 90 becomes Lesser 175 to 225, plain 440 to 565, Greater 1090 to 1410.
  const GRADE_MULT = 2.5;
  const POTION_CD = 2, SHIELD_POTION_MIN = 2, SHIELD_OIL_MIN = 1, OIL_MIN = 30, FLASK_MIN = 120, OIL_PROC = 0.2;
  const tidy = n => n < 100 ? Math.round(n) : n < 1000 ? Math.round(n / 5) * 5 : Math.round(n / 10) * 10;
  const ladder = base => GRADES.map((g, i) => Array.isArray(base) ? base.map(x => tidy(x * GRADE_MULT ** i)) : tidy(base * GRADE_MULT ** i));
  const EFFECTS = {
    potion: {
      Restorative: { name: 'Healing Potion', glyph: 'Hp', nums: { heal: ladder([70, 90]) }, text: n => `Heals ${n.heal[0]} to ${n.heal[1]} at once.` },
      Arcane: { name: 'Mana Potion', glyph: 'Mp', nums: { mana: ladder([140, 180]), power: ladder(6) }, text: n => `Restores ${n.mana[0]} to ${n.mana[1]} mana, or ${n.power} rage or energy, at once.` },
      Fortifying: { name: 'Ironhide Potion', glyph: 'Ih', nums: { shield: ladder(60) }, text: n => `Shields you for ${n.shield} damage, for ${SHIELD_POTION_MIN} min.` },
      Volatile: { name: 'Blasting Potion', glyph: 'Bl', nums: { fire: ladder([30, 45]) }, text: n => `Thrown. Deals ${n.fire[0]} to ${n.fire[1]} fire damage.` },
      Calming: { name: 'Fade Potion', glyph: 'Fd', nums: { threat: ladder(150) }, text: n => `Drops your threat on the current target by ${n.threat}.` },
    },
    oil: {
      Restorative: { name: 'Leeching Oil', glyph: 'Lo', nums: { heal: ladder(15) }, text: n => `Chance on hit: heals you for ${n.heal}.` },
      Arcane: { name: 'Mana Oil', glyph: 'Mo', nums: { mana: ladder(20), power: ladder(2) }, text: n => `Chance on hit: restores ${n.mana} mana, or ${n.power} rage or energy.` },
      Fortifying: { name: 'Ironhide Oil', glyph: 'Io', nums: { shield: ladder(25) }, text: n => `Chance on hit: shields you for ${n.shield} damage, for ${SHIELD_OIL_MIN} min.` },
      Volatile: { name: 'Burning Oil', glyph: 'Bo', nums: { fire: ladder([10, 14]) }, text: n => `Chance on hit: ${n.fire[0]} to ${n.fire[1]} fire damage.` },
      Calming: { name: 'Quieting Oil', glyph: 'Qo', nums: { threat: ladder(10) }, text: n => `Every hit lowers your threat by ${n.threat}.` },
    },
  };
  // The ten hybrids, one per pair of properties. Each is its own potion with its own effect, on the same cooldown as every potion.
  const HYBRIDS = {
    'Restorative+Fortifying': { name: 'Trollblood Draught', glyph: 'Tb', nums: { tick: ladder(12) }, text: n => `Heals ${n.tick} every 2 s for 10 s (${n.tick * 5} in all).` },
    'Restorative+Volatile': { name: 'Bloodfire Bomb', glyph: 'Bf', nums: { fire: ladder([25, 35]) }, text: n => `Thrown. Deals ${n.fire[0]} to ${n.fire[1]} fire damage and heals you for half the damage dealt.` },
    'Restorative+Arcane': { name: 'Rejuvenating Draught', glyph: 'Rj', nums: { both: ladder(60) }, text: n => `Restores ${n.both} health and ${n.both} mana at once.` },
    'Restorative+Calming': { name: 'Deepsleep Potion', glyph: 'Ds', nums: { heal: ladder(150) }, text: n => `You sleep for 12 s and heal ${n.heal} over it. You cannot act while asleep.` },
    'Fortifying+Volatile': { name: 'Ember Shield', glyph: 'Em', nums: { shield: ladder(40), burst: ladder(20) }, text: n => `Shields you for ${n.shield} damage, for 2 min. When it breaks it bursts for ${n.burst} fire to enemies around you.` },
    'Fortifying+Arcane': { name: 'Mana Shield', glyph: 'Ms', nums: { shield: ladder(40), mana: ladder(15) }, text: n => `Shields you for ${n.shield} damage, for 2 min. Each hit it absorbs restores ${n.mana} mana.` },
    'Fortifying+Calming': { name: 'Steady Stance', glyph: 'Ss', nums: { shield: ladder(40) }, text: n => `Shields you for ${n.shield} damage, for 2 min, and halves the threat you cause while it holds.` },

        unknown: !trueSums && !!maybe[p] ? (vals[p] ? 'some' : 'all') : null,
        isMain: mainProps.includes(p), isTarget: tgtProps.includes(p), bonus: bonusOf(p),
        tick: tgtProps.includes(p) ? tick : null,

      toxic: { raw: vals[TOXIC] || 0, purify: vals[PURIFY] || 0, net: tox, unknown: !trueSums && (!!maybe[TOXIC] || !!maybe[PURIFY]), fail, failText: pct(fail), bonus },
    };
  }

  // ---------- 7. make ----------
  function learnGrade(family, prop, grade, step, msgs, events) {
    const gk = gradeKey(family, prop, grade), rec = S.grades[gk] || (S.grades[gk] = { learned: false, rumoured: false, steps: {} });
    const name = nameOf(key(family, prop, grade, 1));
    if (!rec.learned) { rec.learned = true; S.lastLearned = name; msgs.push({ t: 'learn', text: `New grade learned: ${name}. Its page now shows its threshold.` }); events.learned.push(gk); }
    rec.steps[step] = (rec.steps[step] || 0) + 1;
  }
  function openMake(id, msgs, events) { if (S.makes[id]) return; S.makes[id] = true; msgs.push({ t: 'learn', text: `${MAKE[id].name}s are open: ${MAKE[id].rule} at the ${MAKE[id].station}.` }); events.opened.push(id); }

  function make(makeId, keys, target) {
    const msgs = [], events = { learned: [], opened: [], product: null, sludge: false, failed: false };
    const err = slotCheck(makeId, keys);
    if (err) return { ok: false, msgs: [{ t: 'error', text: err }], events };
    const t = parseTarget(target), m = MAKE[makeId], r = resolve(makeId, keys, t ? t.prop : null);
    const herbNames = keys.filter(k => kindOf(k) === 'herb').map(k => parseKey(k).name), before = { ...S.notes };
    keys.forEach(k => { removeItem(k); if (kindOf(k) === 'herb') S.notes[parseKey(k).name] = (S.notes[parseKey(k).name] || 0) + 1; });
    [...new Set(herbNames)].forEach(n => {
      const was = before[n] || 0, now = S.notes[n];
      if (now >= 5 && was < 5) msgs.push({ t: 'learn', text: `Herb Note filled: ${n} now shows each value.` });
      else if (now >= 1 && was < 1) msgs.push({ t: 'info', text: `Herb Note started: ${n} names what it holds.` });
    });
    const roll = r.fail ? Math.random() : 1, failed = !r.sludge && r.fail > 0 && roll < r.fail;
    const entry = { t: fmtClock(S.clock), make: m.name, station: m.station, inputs: listInputs(keys), props: propsText(r.sums), tox: r.tox || 0, fail: r.fail ? pct(r.fail) : '', result: '', note: r.note || '' };
    if (r.sludge) {

    } else if (failed) {

      const heldTxt = r.tox ? ` It held through ${pct(r.fail)} Toxic and gained ${r.bonus}${r.prop ? ' ' + r.prop : ''}.` : '';

      if (r.family === 'flask') {
        const fk = flaskKind(r.product), first = !S.flasks[fk]; S.flasks[fk] = (S.flasks[fk] || 0) + 1;
        msgs.push({ t: 'product', text: `${nameOf(r.product)}, into your bags.${heldTxt}` });
        if (first) { S.lastLearned = nameOf(r.product); msgs.push({ t: 'learn', text: `New flask kind: ${nameOf(r.product)} (${Object.keys(S.flasks).length} of 15).` }); events.learned.push(fk); }
      } else {
        msgs.push({ t: 'product', text: `${nameOf(r.product)} ${fmtStep(r.step)}${r.carried ? ` carrying Toxic ${r.carried}` : ''}, into your bags.${heldTxt}` });
        if (t && (t.family === r.family || (t.family === 'potion' && r.family === 'hybrid') || (t.family === 'hybrid' && r.family === 'potion')) && (t.prop !== r.prop || t.grade !== r.grade)) msgs.push({ t: 'info', text: `Not the target. ${r.family === 'hybrid' && t.family === 'potion' ? `Both ${r.props[0]} and ${r.props[1]} cleared the hybrid ladder, so it became a hybrid.` : t.family === 'hybrid' && r.family === 'potion' ? `Only ${r.prop} cleared the hybrid ladder.` : t.prop !== r.prop ? `The herbs carried no ${t.prop}, so ${r.prop} led.` : `It reached ${r.grade === 'Standard' ? 'the plain grade' : r.grade}, not ${t.grade === 'Standard' ? 'plain' : t.grade}.`}` });

    }
    events.bars = bars(makeId, keys, target, r.sums);
    events.resultName = entry.result;
    events.failed = failed;

    return { ok: true, msgs, events };
  }

  // ---------- 8. character, clock and the dummy ----------
  function activeFlaskStats() {
    const out = { armour: 0, ap: 0, sp: 0, hregen: 0, mregen: 0, lines: [] };
    if (!S.flask) return out;
    parseKey(S.flask.key).essences.forEach(e => { const f = flaskStat(e.prop, e.grade, e.step); out[f.stat] += f.amount; out.lines.push(`+${f.amount} ${f.label} (${gradeName(e.grade, e.prop + ' Essence')} ${fmtStep(e.step)})`); });
    return out;
  }
  // A shield absorbs damage before health does. Shields do not stack: a new one replaces the old only if it is larger.
  const shieldLeft = () => S.shield && S.shield.until > S.clock && S.shield.left > 0 ? S.shield.left : 0;
  function giveShield(amount, minutes, from, extra = {}) {
    if (shieldLeft() >= amount) return `${from}: a ${amount} shield, but your ${shieldLeft()} shield is larger and stays.`;
    S.shield = { left: amount, until: S.clock + minutes, from, ...extra };
    const more = extra.burst ? ` It bursts for ${extra.burst} fire when it breaks.` : extra.manaPerHit ? ` Each hit it absorbs restores ${extra.manaPerHit} mana.` : extra.halfThreat ? ' Your threat is halved while it holds.' : '';

  }
  // Placeholder stat formulas; only the alchemy bonuses matter here.
  function character() {
    const L = S.level, f = activeFlaskStats();
    const stamina = 10 + L, maxHp = 40 + L * 8 + stamina * 10, maxMp = 60 + L * 15;
    if (S.hp === null || S.hp > maxHp) S.hp = maxHp;
    if (S.mp === null || S.mp > maxMp) S.mp = maxMp;
    const left = until => Math.max(0, until - S.clock);
    return {
      level: L, inCombat: S.inCombat, hp: S.hp, maxHp, mp: S.mp, maxMp, threat: S.threat,
      stats: [
        { name: 'Armour', total: L * 12 + f.armour, bonus: f.armour },
        { name: 'Attack power', total: L * 3 + f.ap, bonus: f.ap },
        { name: 'Spell power', total: f.sp, bonus: f.sp },
        { name: 'Stamina', total: stamina, bonus: 0 },
        { name: 'Health regen', total: 1 + Math.floor(L / 5) + f.hregen, bonus: f.hregen, unit: '/5 s' },
        { name: 'Mana regen', total: 2 + Math.floor(L / 4) + f.mregen, bonus: f.mregen, unit: '/5 s' },
      ],
      flask: S.flask ? { key: S.flask.key, name: nameOf(S.flask.key), quality: qualityOf(S.flask.key), left: left(S.flask.until), lines: f.lines } : null,
      oils: ['main', 'off'].map(hand => S.oils[hand] ? { hand, key: S.oils[hand].key, name: nameOf(S.oils[hand].key), quality: qualityOf(S.oils[hand].key), left: left(S.oils[hand].until) } : { hand, key: null }),

  }
  function expire(msgs) {
    if (S.flask && S.flask.until <= S.clock) { msgs.push({ t: 'info', text: `${nameOf(S.flask.key)} has worn off.` }); S.flask = null; }
    for (const hand of ['main', 'off']) if (S.oils[hand] && S.oils[hand].until <= S.clock) { msgs.push({ t: 'info', text: `${nameOf(S.oils[hand].key)} has worn off your ${hand} hand.` }); S.oils[hand] = null; }
    if (S.shield && S.shield.until <= S.clock) { if (S.shield.left > 0) msgs.push({ t: 'info', text: `The shield from ${S.shield.from} fades with ${S.shield.left} unused.` }); S.shield = null; }
  }
  function advance(min) {
    const msgs = [];
    S.clock += min;
    expire(msgs);
    const c = character(), ticks = min * 12; // regen is per 5 s
    const hr = S.inCombat ? activeFlaskStats().hregen : c.stats[4].total, mr = S.inCombat ? activeFlaskStats().mregen : c.stats[5].total;
    S.hp = Math.min(c.maxHp, S.hp + hr * ticks); S.mp = Math.min(c.maxMp, S.mp + mr * ticks);
    if (!S.inCombat && S.threat) S.threat = 0;
    save(); return msgs;
  }
  function drink(k) {
    const p = parseKey(k), msgs = [];
    if ((p.kind !== 'potion' && p.kind !== 'hybrid') || !count(k)) return [{ t: 'error', text: 'Nothing to drink.' }];
    if (S.potionCd > S.clock) return [{ t: 'error', text: `Potions are on cooldown for ${S.potionCd - S.clock} min.` }];
    const c = character(), e = effectOf(p.kind, p.prop, p.grade, p.step), n = e.nums, name = nameOf(k);
    removeItem(k); S.potionCd = S.clock + POTION_CD;
    const heal = h => { const was = S.hp; S.hp = Math.min(c.maxHp, S.hp + h); return S.hp - was; };
    const mana = m => { const was = S.mp; S.mp = Math.min(c.maxMp, S.mp + m); return S.mp - was; };
    const throwAt = (lo, hi) => { const d = between(lo, hi); S.inCombat = true; S.threat += d; pushCombat(`${name} bursts on the dummy for ${d} fire.`); return d; };
    switch (p.prop) {
      case 'Restorative+Fortifying': msgs.push({ t: 'info', text: `${name}: heals ${heal(n.tick * 5)} over 10 s.` }); break;
      case 'Restorative+Volatile': { const d = throwAt(n.fire[0], n.fire[1]); msgs.push({ t: 'info', text: `${name} thrown: ${d} fire, and it heals you for ${heal(Math.round(d / 2))}.` }); break; }
      case 'Restorative+Arcane': msgs.push({ t: 'info', text: `${name}: restores ${heal(n.both)} health and ${mana(n.both)} mana.` }); break;
      case 'Restorative+Calming': msgs.push({ t: 'info', text: `${name}: you sleep 12 s and heal ${heal(n.heal)}.` }); break;
      case 'Fortifying+Volatile': msgs.push({ t: 'info', text: giveShield(n.shield, SHIELD_POTION_MIN, name, { burst: n.burst }) }); break;
      case 'Fortifying+Arcane': msgs.push({ t: 'info', text: giveShield(n.shield, SHIELD_POTION_MIN, name, { manaPerHit: n.mana }) }); break;
      case 'Fortifying+Calming': msgs.push({ t: 'info', text: giveShield(n.shield, SHIELD_POTION_MIN, name, { halfThreat: true }) }); break;
      case 'Volatile+Arcane': { const d = throwAt(n.fire[0], n.fire[1]); msgs.push({ t: 'info', text: `${name} thrown: ${d} fire, and it burns ${n.mana} mana from the target (the dummy has none).` }); break; }
      case 'Volatile+Calming': { const d = throwAt(n.fire[0], n.fire[1]); const t = Math.min(S.threat, n.threat); S.threat -= t; msgs.push({ t: 'info', text: `${name} thrown: ${d} fire around the target, and your threat drops by ${t}.` }); break; }
      case 'Arcane+Calming': { const was = S.threat; S.threat = 0; msgs.push({ t: 'info', text: `${name}: invisible for 15 s. Threat cleared (was ${was}); you regain ${mana(n.mana)} mana.` }); break; }
      case 'Restorative': { const h = between(n.heal[0], n.heal[1]); S.hp = Math.min(c.maxHp, S.hp + h); msgs.push({ t: 'info', text: `${nameOf(k)} heals you for ${h}.` }); break; }
      case 'Arcane': { const m = between(n.mana[0], n.mana[1]); S.mp = Math.min(c.maxMp, S.mp + m); msgs.push({ t: 'info', text: `${nameOf(k)} restores ${m} mana.` }); break; }
      case 'Fortifying': msgs.push({ t: 'info', text: giveShield(n.shield, SHIELD_POTION_MIN, nameOf(k)) }); break;
      case 'Volatile': { const d = between(n.fire[0], n.fire[1]); S.inCombat = true; S.threat += d; pushCombat(`${nameOf(k)} bursts on the dummy for ${d} fire.`); msgs.push({ t: 'info', text: `${nameOf(k)} thrown: ${d} fire damage.` }); break; }
      case 'Calming': { const t = Math.min(S.threat, n.threat); S.threat -= t; msgs.push({ t: 'info', text: `${nameOf(k)} drops your threat by ${t}.` }); break; }
    }
    save(); return msgs;
  }
  function applyOil(k, hand) {
    if (kindOf(k) !== 'oil' || !count(k)) return [{ t: 'error', text: 'No such oil.' }];
    removeItem(k); S.oils[hand] = { key: k, until: S.clock + OIL_MIN }; save();
    return [{ t: 'info', text: `${nameOf(k)} on your ${hand} hand for ${OIL_MIN} min.` }];
  }
  function useFlask(k) {
    if (kindOf(k) !== 'flask' || !count(k)) return [{ t: 'error', text: 'No such flask.' }];
    const msgs = [];
    if (S.flask) msgs.push({ t: 'info', text: `${nameOf(S.flask.key)} is replaced; only one flask is active.` });
    removeItem(k); S.flask = { key: k, until: S.clock + FLASK_MIN }; save();
    msgs.push({ t: 'info', text: `${nameOf(k)} for ${FLASK_MIN} min. It survives death.` });
    return msgs;
  }
  // One swing: a main-hand hit and, since the dummy test assumes two weapons, an off-hand hit at half damage.
  function swing() {
    const msgs = [], c = character();
    S.inCombat = true;
    for (const [hand, mult] of [['main', 1], ['off', 0.5]]) {
      let dmg = Math.round(((4 + S.level * 1.5) * (0.85 + Math.random() * 0.3) + c.stats[1].total / 14 * 2) * mult); const notes = [];
      const o = S.oils[hand];
      if (o) {
        const p = parseKey(o.key), e = effectOf('oil', p.prop, p.grade, p.step).nums;
        if (p.prop === 'Calming') { const t = Math.min(S.threat + dmg, e.threat); S.threat -= t; notes.push(`${nameOf(o.key)}: threat −${t}`); }
        else if (Math.random() < OIL_PROC) {
          if (p.prop === 'Volatile') { const f = between(e.fire[0], e.fire[1]); dmg += f; notes.push(`${nameOf(o.key)} procs: +${f} fire`); }
          if (p.prop === 'Arcane') { S.mp = Math.min(c.maxMp, S.mp + e.mana); notes.push(`${nameOf(o.key)} procs: +${e.mana} mana`); }
          if (p.prop === 'Restorative') { S.hp = Math.min(c.maxHp, S.hp + e.heal); notes.push(`${nameOf(o.key)} procs: heals ${e.heal}`); }
          if (p.prop === 'Fortifying') { notes.push(`${nameOf(o.key)} procs: ${giveShield(e.shield, SHIELD_OIL_MIN, nameOf(o.key)).replace(/^[^:]+: /, '')}`); }

      const line = `${hand === 'main' ? 'Main hand' : 'Off hand'} hits the dummy for ${dmg}${notes.length ? ` (${notes.join('; ')})` : ''}.`;

    }

  }

  // ---------- 9. tables and rumours ----------
  function setTable(id) {
    if (!TABLES[id]) return [];
    S.table = id; const msgs = [];
    if (!S.visited[id]) { S.visited[id] = true; msgs.push({ t: 'say', text: `${TABLES[id].alchemist}: ${TABLES[id].line}` }); }
    save(); return msgs;
  }
  const FAMILIES = ['potion', 'hybrid', 'oil', 'tincture', 'essence'];
  const propsOf = f => f === 'hybrid' ? PAIRS : PROPS;
  const allGradeKeys = () => FAMILIES.flatMap(f => propsOf(f).flatMap(p => GRADES.map(g => gradeKey(f, p, g))));
  function rumoursFor() {
    const t = TABLES[S.table];
    return allGradeKeys().filter(gk => { const [, , g] = gk.split('|'); const r = gradeRec(gk); return t.tiers.includes(g) && !r.learned && !r.rumoured; })
      .map(gk => { const [f, p, g] = gk.split('|'); return { key: gk, name: nameOf(key(f, p, g, 1)), price: RUMOUR_PRICE[g], grade: g }; });
  }
  function rumour(gk, free) {
    const [f, p, g] = gk.split('|'), rec = S.grades[gk] || (S.grades[gk] = { learned: false, rumoured: false, steps: {} });
    if (rec.learned || rec.rumoured) return [{ t: 'error', text: 'You already know that one.' }];
    if (!free) { if (S.gold < RUMOUR_PRICE[g]) return [{ t: 'error', text: "You can't afford that rumour." }]; S.gold -= RUMOUR_PRICE[g]; }
    rec.rumoured = true; S.lastLearned = `a rumour of ${nameOf(key(f, p, g, 1))}`;

  }
  function sellSludge() {

    return [{ t: 'info', text: `Sold ${n} Murky Sludge for ${n * SLUDGE_PRICE}c.` }];
  }

  // ---------- journal views ----------
  // What the notes say a herb carries: names after 1 use, values after 5.
  const knownProps = name => { const st = noteState(name); return st === 'none' ? [] : Object.keys(HERB[name].values).map(p => ({ prop: p, value: st === 'full' ? HERB[name].values[p] : null, colour: PROP_COLOUR[p] })); };

      if (st !== 'none' && h.values[TOXIC]) lines.push({ text: 'Toxic can spoil a craft; when it holds, each point pays one point into the product.', c: 'muted' });
      if (st !== 'none' && h.values[PURIFY]) lines.push({ text: 'Purifying cancels Toxic point for point.', c: 'use' });
      lines.push({ text: `Uses noted: ${Math.min(5, S.notes[p.name] || 0)} of 5`, c: 'muted' });
    } else if (p.kind === 'fish') {
      lines.push({ text: 'Fish', c: 'muted' }, { text: 'Two go into every weapon oil.', c: 'use' });
    } else if (p.kind === 'potion' || p.kind === 'hybrid') {
      const e = effectOf(p.kind, p.prop, p.grade, p.step);
      lines.push({ text: `${p.kind === 'hybrid' ? `${p.props[0]} and ${p.props[1]} hybrid` : p.prop + ' potion'} · ${fmtStep(p.step)}`, c: 'muted' }, { text: e.text, c: 'use' }, { text: `Use: drink. Shares a ${POTION_CD}-minute cooldown with every potion.`, c: 'muted' });
    } else if (p.kind === 'oil') {
      const e = effectOf('oil', p.prop, p.grade, p.step);

    } else if (p.kind === 'tincture') {
      lines.push({ text: `${p.prop} Tincture · ${fmtStep(p.step)}`, c: 'muted' }, { text: `Carries ${fmtPts(ptsOf('tincture', p.prop, p.grade, p.step))} ${p.prop} points.`, c: 'gold' }, p.tox ? { text: `Carries Toxic ${p.tox}: it rolls again wherever it goes next.`, c: 'muted' } : { text: 'Clean. No Toxic.', c: 'use' }, { text: 'Three condense into an Essence. Two and two fish mix into a weapon oil.', c: 'muted' });
    } else if (p.kind === 'essence') {

      lines.push({ text: `${p.prop} Essence · ${fmtStep(p.step)}`, c: 'muted' }, { text: `Carries ${fmtPts(ptsOf('essence', p.prop, p.grade, p.step))} ${p.prop} points.`, c: 'gold' }, p.tox ? { text: `Carries Toxic ${p.tox}: the flask rolls on it.`, c: 'muted' } : { text: 'Clean. No Toxic.', c: 'use' }, { text: `In a flask: +${f.amount} ${f.label}.`, c: 'use' });
    } else if (p.kind === 'flask') {

      p.essences.forEach(e => { const f = flaskStat(e.prop, e.grade, e.step); lines.push({ text: `+${f.amount} ${f.label} (${gradeName(e.grade, e.prop + ' Essence')} ${fmtStep(e.step)})`, c: 'use' }); });

  }
  function bags() {
    return Object.keys(S.bags).map(k => {

      return { key: k, kind: p.kind, name: nameOf(k), quality: qualityOf(k), count: S.bags[k], icon: iconOf(k), step: p.step || null, tox: p.tox || 0, prop: p.prop || null, level: p.kind === 'herb' ? HERB[p.name].level : 0, knownProps: p.kind === 'herb' ? knownProps(p.name) : [] };

  }
  // A recipe page: one ladder per property, each grade a segment of it.
  function recipePage(family) {
    return propsOf(family).map(prop => ({
      prop, props: family === 'hybrid' ? pairProps(prop) : [prop], colour: PROP_COLOUR[family === 'hybrid' ? pairProps(prop)[0] : prop], colour2: family === 'hybrid' ? PROP_COLOUR[pairProps(prop)[1]] : null,
      base: familyBase(family, prop), top: THRESHOLD[family][prop].Greater,
      grades: GRADES.map(grade => {
        const gk = gradeKey(family, prop, grade), r = gradeRec(gk), known = r.learned;
        return {
          key: gk, grade, label: grade === 'Standard' ? 'Plain' : grade, name: nameOf(key(family, prop, grade, 1)), quality: GRADE_QUALITY[grade], learned: known, rumoured: r.rumoured,
          threshold: known || r.rumoured ? THRESHOLD[family][prop][grade] : null,
          steps: STEPS.map(s => ({ step: s, count: r.steps[s] || 0 })).filter(s => s.count),
          effect: known && (family === 'potion' || family === 'oil' || family === 'hybrid') ? effectOf(family, prop, grade, 1).text : null,
          itemKey: key(family, prop, grade, 1), make: MAKE_OF_FAMILY[family],
        };
      }),
    }));
  }
  function flaskPage() {
    const out = [];
    for (let i = 0; i < PROPS.length; i++) for (let j = i; j < PROPS.length; j++) {
      const a = PROPS[i], b = PROPS[j], fk = key('flask', a, b);
      out.push({ key: fk, name: flaskName(a, b), props: [a, b], made: S.flasks[fk] || 0, stats: [FLASK_STAT[a].label, FLASK_STAT[b].label] });
    }
    return out;
  }
  function herbNotes() {
    return HERBS.map(h => {
      const st = noteState(h.name), uses = S.notes[h.name] || 0;
      return { key: key('herb', h.name), name: h.name, level: h.level, rarity: h.rarity, zones: h.zones, uses, state: st, budget: st === 'full' ? h.budget : null, props: knownProps(h.name), icon: iconOf(key('herb', h.name)) };
    }).sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
  }
  function discoveries() {
    const open = Object.values(S.makes).filter(Boolean).length;
    const learned = allGradeKeys().filter(gradeKnown).length;
    const noted = HERBS.filter(h => (S.notes[h.name] || 0) >= 5).length;
    let next;
    if (!S.makes.tincture) next = 'Brew any potion to open the Still.';
    else if (!S.makes.essence) next = 'Distill five herbs into a Tincture to open Essences and the Oil Tin.';
    else if (!S.makes.flask) next = 'Condense an Essence (15 herbs, or 3 Tinctures) to open the Flask Rack.';
    else if (!Object.keys(S.flasks).length) next = 'Join two Essences into a flask.';
    else if (noted < HERBS.length) next = `${HERBS.length - noted} herbs still have blanks in their notes. Five uses fill a note.`;
    else next = 'Chase the Greater grades: dirty herbs that hold pay their Toxic back as points.';
    return { makesOpen: open, makesTotal: MAKES.length, herbsNoted: noted, herbsTotal: HERBS.length, gradesLearned: learned, gradesTotal: allGradeKeys().length, flasksMade: Object.keys(S.flasks).length, flasksTotal: 15, lastLearned: S.lastLearned || 'Nothing yet.', next };
  }
  function hiddenTables() {
    return {
      herbs: HERBS.map(h => ({ name: h.name, level: h.level, rarity: h.rarity, budget: h.budget, values: ALL_VALUES.filter(p => h.values[p]).map(p => `${p} ${h.values[p]}`).join(', ') })),
      ladders: Object.keys(LADDER).map(f => ({ family: f, cells: LADDER[f].slice() })),
      gradeMult: GRADE_MULT,
      toxic: [`Net Toxic = Toxic in − Purifying in, never below 0. Every craft rolls: fail chance = net Toxic ÷ (net Toxic + main points).`, `When it holds, each net Toxic point pays ${PAYOFF} points into the product (a flask splits them between its Essences).`, `A Tincture or Essence carries floor(net Toxic × ${STILL_KEEP}) and rolls again wherever it goes next. Potions, oils and flasks are the end of the line.`, `Essences from Tinctures, oils and flasks may add up to ${WASH} herbs as a wash: only their Toxic and Purifying count.`],
      effects: ['potion', 'hybrid', 'oil'].map(f => ({ family: f, rows: propsOf(f).map(p => ({ prop: p.replace('+', ' + '), name: EFFECTS[f][p].name, cells: GRADES.map(g => effectOf(f, p, g, 1).text) })) })),
      flasks: PROPS.map(p => ({ prop: p, label: FLASK_STAT[p].label, cells: GRADES.map(g => flaskStat(p, g, 1).amount) })),
      rumourPrices: RUMOUR_PRICE,
    };
  }

  // ---------- 10. audit ----------
  // Checks: every herb's values add up to its budget; ladders rise; and every Minor, Lesser and plain grade can be made at x1 with
  // herbs at or below its band. "Safe" means no roll anywhere on the way; otherwise the worst roll on the way is reported, and a
  // grade passes when that is 50% or less. Greater is the gamble grade: the audit reports its routes but never fails on it. Oils and Essences build from the Tinctures a band can make (carrying their Toxic), with the band's best
  // purifier available as a wash; 15-herb Essences are tried as three fives. Grades a band cannot push to x2 are notes, not failures.
  function* multisets(arr, k, start = 0, acc = []) {
    if (acc.length === k) { yield acc.slice(); return; }
    for (let i = start; i < arr.length; i++) { acc.push(arr[i]); yield* multisets(arr, k, i, acc); acc.pop(); }
  }
  function _audit() {
    const checks = [], notes = [], bestStep = {};

    HERBS.forEach(h => { const sum = Object.values(h.values).reduce((a, b) => a + b, 0); add(sum === h.budget, `${h.name}: ${sum} of budget ${h.budget}`); });
    const gname = (f, p, g) => nameOf(key(f, p, g, 1));
    const names = set => listInputs(set.map(h => key('herb', h)));
    for (const f of FAMILIES) { const t = GRADES.map(g => THRESHOLD[f][propsOf(f)[0]][g]); add(t.every((v, i) => i === 0 ? v > 0 : v > t[i - 1]), `${f} ladder rises: ${t.join(' < ')}`); }
    // hybrids: where each pair first becomes possible (reported, never failed: the herb table was not built around pairs)
    for (const pair of PAIRS) {
      const [a, b] = pairProps(pair); let found = null;
      for (const g of ['Minor', 'Lesser', 'Standard']) {
        const pool = HERBS.filter(h => h.level <= BAND_TOP[g] && (h.values[a] || h.values[b] || h.values[PURIFY])).map(h => h.name);
        for (let n = 2; n <= 4 && !found; n++) for (const set of multisets(pool, n)) { const r = resolve('potion', set.map(h => key('herb', h)), pair); if (!r.sludge && r.family === 'hybrid' && r.prop === pair && r.fail <= 0.5) { found = { g, set, grade: r.grade, step: r.step, fail: r.fail }; break; } }
        if (found) break;
      }
      add(true, `${HYBRIDS[pair].name} (${a} + ${b}): ${found ? `first in band ${GRADE_BAND[found.g]} with ${names(found.set)} → ${found.grade === 'Standard' ? 'plain' : found.grade} ${fmtStep(found.step)}${found.fail ? ` at ${pct(found.fail)}` : ''}` : 'no route in the herb table'}`);
      if (!found) notes.push(`${HYBRIDS[pair].name} has no route in the herb table.`);
    }
    const rollTxt = fail => fail > 0 ? `worst roll ${pct(fail)}` : 'safe';
    const tincOut = {};
    for (const p of PROPS) for (const g of GRADES) {
      const pool = HERBS.filter(h => h.level <= BAND_TOP[g] && (h.values[p] || h.values[PURIFY])).map(h => h.name);
      for (const [f, sizes] of [['potion', [2, 3, 4]], ['tincture', [5]]]) {
        const N = THRESHOLD[f][p][g];
        let safe = null, safeBest = 0, risky = null, riskyFail = 1, riskyBest = 0; const out = new Map();
        for (const n of sizes) for (const set of multisets(pool, n)) {
          const r = resolve(f, set.map(h => key('herb', h)), p);
          if (r.sludge || r.prop !== p) continue;
          if (f === 'tincture' && r.fail <= 0.5) { const id = `${ptsOf('tincture', p, r.grade, r.step)}|${r.carried}`; if (!out.has(id) || out.get(id) > r.fail) out.set(id, r.fail); }
          if (r.grade !== g) continue;
          if (r.fail === 0) { if (!safe) safe = set; safeBest = Math.max(safeBest, r.step); }
          else if (r.fail < riskyFail || (r.fail === riskyFail && r.step > riskyBest)) { risky = set; riskyFail = r.fail; riskyBest = Math.max(riskyBest, r.step); }
        }
        if (f === 'tincture') tincOut[gradeKey('tincture', p, g)] = [...out].map(([id, fail]) => { const [pts, tox] = id.split('|').map(Number); return { pts, tox, fail }; });
        const reached = !!safe || (!!risky && riskyFail <= 0.5), ok = reached || g === 'Greater', best = Math.max(safeBest, riskyBest);
        bestStep[gradeKey(f, p, g)] = best;
        add(ok, `${gname(f, p, g)} (needs ${p} ${N}): ${safe ? `safe with ${names(safe)} · best safe step ${fmtStep(safeBest)}` : risky ? `only with risk: ${names(risky)} at ${pct(riskyFail)}` : g === 'Greater' ? 'no route yet (the gamble grade: needs a dirty herb of this property, or a level 26 to 30 herb)' : 'NOT REACHABLE in band'}${risky && safe ? ` · with risk ${fmtStep(riskyBest)} at ${pct(riskyFail)}` : ''}`);
        if (reached && best < 2) notes.push(`${gname(f, p, g)} tops out at ${fmtStep(best)} in its band.`);
        if (reached && !safe) notes.push(`${gname(f, p, g)} needs a Toxic roll in its band (${pct(riskyFail)} at best).`);
        if (!reached && g === 'Greater') notes.push(`${gname(f, p, g)} has no route in the herb table yet.`);
      }
    }
    // the band's best wash: two of the strongest purifier at or below the band
    const washFor = g => { const best = Math.max(0, ...HERBS.filter(h => h.level <= BAND_TOP[g] && h.values[PURIFY]).map(h => h.values[PURIFY])); return best * WASH; };
    for (const p of PROPS) for (const g of GRADES) {
      const tinc = tincOut[gradeKey('tincture', p, g)], wash = washFor(g);
      for (const [f, n] of [['oil', 2], ['essence', 3]]) {
        const N = THRESHOLD[f][p][g];
        let found = null, foundFail = 1, best = 0, bestFail = 0;
        const consider = (main, toxIn, worstIn, how) => {
          const tox = Math.max(0, toxIn - wash), fail = failChance(tox, main), held = main + payoff(tox), gr = gradeFor(f, p, held), worst = Math.max(worstIn, fail);
          if (!gr || gr.grade !== g || worst > 0.5) return;
          if (!found || worst < foundFail) { found = how; foundFail = worst; }
          if (gr.step > best || (gr.step === best && worst < bestFail)) { best = gr.step; bestFail = worst; }
        };
        for (const set of multisets(tinc, n)) consider(set.reduce((a, t) => a + t.pts, 0), set.reduce((a, t) => a + t.tox, 0), Math.max(...set.map(t => t.fail)), `Tinctures of ${set.map(t => `${fmtPts(t.pts)}${t.tox ? ` (Toxic ${t.tox})` : ''}`).join(' + ')}`);

          const raws = [...fives.keys()].map(id => id.split('|').map(Number));
          for (const set of multisets(raws, 3)) { const main = set.reduce((a, r) => a + r[0], 0), tx = set.reduce((a, r) => a + r[1], 0), pu = set.reduce((a, r) => a + r[2], 0); const tox = Math.max(0, tx - pu), fail = failChance(tox, main), gr = gradeFor(f, p, main + payoff(tox)); if (!gr || gr.grade !== g || fail > 0.5) continue; const how = `15 herbs with ${p} ${main}${tox ? `, net Toxic ${tox}` : ''}`; if (!found || fail < foundFail) { found = how; foundFail = fail; } if (gr.step > best || (gr.step === best && fail < bestFail)) { best = gr.step; bestFail = fail; } }
        }

        add(!!found || g === 'Greater', `${gname(f, p, g)} (needs ${p} ${N}): ${found ? `${found} (${rollTxt(foundFail)}) · best step ${fmtStep(best)} (${rollTxt(bestFail)})` : g === 'Greater' ? 'no route yet (the gamble grade)' : 'NOT REACHABLE in band at 50% or less'}`);
        if (found && best < 2) notes.push(`${gname(f, p, g)} tops out at ${fmtStep(best)} in its band.`);
        if (found && foundFail > 0) notes.push(`${gname(f, p, g)} needs Toxic rolls in its band (up to ${pct(foundFail)}).`);
        if (!found && g === 'Greater') notes.push(`${gname(f, p, g)} has no route in the herb table yet.`);
      }
    }

    return { ok: failures.length === 0, passed: checks.length - failures.length, total: checks.length, checks, failures, notes, bestStep };
  }

  // ---------- debug ----------
  function give(k, n) { const p = parseKey(k); if (!(p.kind === 'herb' && HERB[p.name]) && !(p.kind === 'fish' && FISH_BY[p.name])) return [{ t: 'error', text: 'No such item.' }]; addItem(k, n); save(); return [{ t: 'info', text: `${n} ${nameOf(k)} added to your bags.` }]; }
  function giveBundle() {
    HERBS.filter(h => h.level <= S.level).forEach(h => { const n = h.rarity === 'legendary' ? 5 : h.rarity === 'rare' ? 10 : 15; addItem(key('herb', h.name), n); });

  }

  return {
    // data
    PROPS, PAIRS, TOXIC, PURIFY, PROP_COLOUR, PROP_HUE, GRADES, STEPS, LADDER, THRESHOLD, PAYOFF, STILL_KEEP, WASH, HERBS, FISH, TABLES, RUMOUR_PRICE, MAKE_OF_FAMILY,
    nameOf, qualityOf, iconOf, describe, parseKey, kindOf, fmtStep, fmtPts, gradeName,
    // state views
    status: () => ({ level: S.level, clock: fmtClock(S.clock), night: isNight(), inCombat: S.inCombat, gold: S.gold, table: S.table, tableName: TABLES[S.table].name, alchemist: TABLES[S.table].alchemist, line: TABLES[S.table].line }),
    tables: () => Object.values(TABLES).map(t => ({ id: t.id, name: t.name, alchemist: t.alchemist, tiers: t.tiers })),
    makes: () => MAKES.map(m => ({ id: m.id, group: m.group, name: m.name, station: m.station, verb: m.verb, rule: m.rule, accepts: m.accepts, fill: m.fill, family: m.family, opensBy: m.opensBy, open: !!S.makes[m.id] })),
    bags, count,
    discoveries, character, herbNotes, recipePage, flaskPage, hiddenTables, rumoursFor,
    log: () => S.log.slice().reverse(),

    gradeKeys: () => allGradeKeys().map(gk => { const [f, p, g] = gk.split('|'); return { key: gk, name: nameOf(key(f, p, g, 1)), family: f, prop: p, grade: g, learned: gradeKnown(gk), rumoured: gradeRec(gk).rumoured }; }),
    // bench

    room(makeId, k, slots, want) { const m = MAKE[makeId], kind = kindOf(k); if (!S.makes[makeId] || !m.accepts[kind]) return 0; const cap = Math.min(want || m.accepts[kind], m.accepts[kind]) - kindCounts(slots)[kind]; return Math.max(0, Math.min(cap, count(k) - slots.filter(s => s === k).length)); },
    bars: (makeId, keys, target) => bars(makeId, keys, target, null),
    preview(makeId, slots, target) {
      const err = slotCheck(makeId, slots);

      const base = { ready: true, fail: r.fail || 0, failText: pct(r.fail || 0), tox: r.tox || 0, bonus: r.bonus || 0, prop: r.prop || null, carried: r.carried || 0 };

      return { ...base, known: true, key: r.product, name: nameOf(r.product), step: r.step ? fmtStep(r.step) : '', quality: qualityOf(r.product) };
    },
    make, drink, applyOil, useFlask, swing, advance, setTable, sellSludge,
    buyRumour: gk => rumour(gk, false),
    // debug
    setLevel(n) { S.level = Math.max(1, Math.min(30, Math.floor(n) || 1)); S.hp = null; S.mp = null; save(); },
    setGold(c) { S.gold = Math.max(0, Math.floor(c) || 0); save(); },
    setCombat(on) { S.inCombat = !!on; if (!on) S.threat = 0; save(); return [{ t: 'info', text: on ? 'You are in combat.' : 'You leave combat.' }]; },
    takeDamage(n) {
      const c = character(); let absorbed = 0; const extra = [];
      if (shieldLeft()) {
        absorbed = Math.min(S.shield.left, n); S.shield.left -= absorbed;
        if (S.shield.manaPerHit) { const was = S.mp; S.mp = Math.min(c.maxMp, S.mp + S.shield.manaPerHit); extra.push(`+${S.mp - was} mana from the shield`); }
        if (!S.shield.left && S.shield.burst) { S.threat += S.shield.burst; pushCombat(`The shield bursts for ${S.shield.burst} fire around you.`); extra.push(`it bursts for ${S.shield.burst} fire`); }
      }
      S.hp = Math.max(0, S.hp - (n - absorbed)); S.inCombat = true; save();
      return [{ t: 'info', text: `You take ${n} damage${absorbed ? `, ${absorbed} absorbed by the shield${S.shield.left ? ` (${S.shield.left} left)` : ' (it breaks)'}` : ''}${extra.length ? `; ${extra.join('; ')}` : ''} (${S.hp} of ${c.maxHp}).` }];
    },
    openAll() { MAKES.forEach(m => { S.makes[m.id] = true; }); save(); return [{ t: 'learn', text: 'Every make is open.' }]; },
    fillNotes() { HERBS.forEach(h => { S.notes[h.name] = Math.max(5, S.notes[h.name] || 0); }); save(); return [{ t: 'learn', text: 'Every Herb Note is filled.' }]; },
    teach(gk) { const [f, p, g] = gk.split('|'); const msgs = [], ev = { learned: [], opened: [] }; learnGrade(f, p, g, 1, msgs, ev); const rec = S.grades[gk]; rec.steps[1] -= 1; if (!rec.steps[1]) delete rec.steps[1]; save(); return msgs.length ? msgs : [{ t: 'info', text: 'Already learned.' }]; },
    rumourFree: gk => rumour(gk, true),
    give, giveBundle,
    _audit,
    reset() { S = freshState(); try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* fine */ } save(); },
  };
})();
if (typeof module !== 'undefined') module.exports = realm;
</script>
<script>
// ============================================================
// UI: shows what realm says. It keeps only screen state
// (which tab, what is being made, what sits in the workspace,
// the target). The UI never computes a result; every number
// comes from realm.
// ============================================================
const ui = {
  tab: 'bench', jtab: 'herbs', making: 'potion',
  slots: { potion: [], tincture: [], essence: [], oil: [], flask: [] },
  target: { potion: null, tincture: null, essence: null, oil: null, flask: null },
  last: {}, result: {}, log: [], debug: false, hidden: false, audit: null,
  giveKey: 'herb|Peacebloom', giveN: 5, gradeKey: 'potion|Restorative|Minor', dmg: 50, rumourKey: null, flash: false,
};
const $app = document.getElementById('app'), $tip = document.getElementById('tip');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function money(c) {
  const g = Math.floor(c / 10000), s = Math.floor(c / 100) % 100, cc = c % 100, out = [];
  if (g) out.push(`<span class="g">${g}g</span>`);
  if (s || g) out.push(`<span class="s">${s}s</span>`);
  out.push(`<span class="c">${cc}c</span>`);
  return `<span class="money">${out.join(' ')}</span>`;
}
const ico = k => { const i = realm.iconOf(k); return `<span class="ico b-${realm.qualityOf(k)}" style="--h:${i.hue}${i.border ? `;border-color:${i.border}` : ''}">${esc(i.glyph)}</span>`; };
const pname = (k, extra = '') => `<span class="q-${realm.qualityOf(k)}">${esc(realm.nameOf(k))}${extra}</span>`;
const push = msgs => { ui.log.push(...msgs); ui.log = ui.log.slice(-40); };
const after = msgs => { push(msgs); render(); };
const stepTxt = s => s ? ` ${realm.fmtStep(s)}` : '';
const sun = night => night ? '☾' : '☀';
const plain = g => g === 'Standard' ? 'plain' : g;
const KIND_LABEL = { herb: 'Herbs', fish: 'Fish', tincture: 'Tinctures', essence: 'Essences' };
const stacks = keys => { const m = new Map(); keys.forEach(k => m.set(k, (m.get(k) || 0) + 1)); return [...m].map(([key, count]) => ({ key, count })); };
const makeOf = id => realm.makes().find(m => m.id === id);
const TOX_COLOUR = realm.PROP_COLOUR[realm.TOXIC], PUR_COLOUR = realm.PROP_COLOUR[realm.PURIFY];

function render() {
  const st = realm.status();
  $app.innerHTML = `
  <header class="frame topbar">
    <h1 class="brand">Twilight's Eve<span>Alchemy prototype</span></h1>
    <label class="chip">Table
      <select id="table" data-ch="table">${realm.tables().map(t => `<option value="${t.id}" ${t.id === st.table ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
    </label>
    <span class="spacer"></span>
    <span class="chip" title="Game clock">${sun(st.night)} ${esc(st.clock)} · ${st.night ? 'Night' : 'Day'}</span>
    <span class="clockbtns"><button class="btn ghost small" data-act="skip" data-v="1">+1 min</button><button class="btn ghost small" data-act="skip" data-v="10">+10 min</button></span>
    ${st.inCombat ? '<span class="chip combat">In combat</span>' : ''}
    <span class="chip">${money(st.gold)}</span>
    <button class="btn ghost small" data-act="debug" aria-expanded="${ui.debug}">Debug</button>
  </header>
  <div class="layout">
    <div class="col">${discoveriesPanel()}${consumablesPanel()}${characterPanel()}</div>
    <div class="col">
      <div class="tabs" role="tablist">
        ${[['bench', 'Bench'], ['journal', 'Journal']].map(([id, l]) => `<button class="tab" role="tab" aria-selected="${ui.tab === id}" data-act="tab" data-v="${id}">${l}</button>`).join('')}
      </div>
      ${ui.tab === 'journal' ? journalTab() : benchTab(st)}
    </div>
  </div>
  ${ui.debug ? debugDrawer(st) : ''}
  ${ui.hidden ? hiddenTables() : ''}`;
  ui.flash = false;
}

// ---------- left column ----------
function discoveriesPanel() {
  const d = realm.discoveries();
  return `<section class="frame"><h2 class="fh">Discoveries</h2><div class="fb disc">
    <div class="drow"><span>Makes open</span><b>${d.makesOpen} of ${d.makesTotal}</b></div>

    <div class="drow"><span>Flask kinds made</span><b>${d.flasksMade} of ${d.flasksTotal}</b></div>

  </div></section>`;
}

// A herb card's known values as small chips, so what it would add to the bars can be read from the bags.
function valueChips(it, tProp) {
  if (!it.knownProps.length) return '<span class="mk dim">unknown</span>';
  return it.knownProps.map(p => `<span class="mk${p.prop === realm.TOXIC ? ' tox' : p.prop === realm.PURIFY ? ' pur' : ''}${tProp && p.prop === tProp ? ' tgt' : ''}" style="--pc:${p.colour}">${p.prop === realm.PURIFY ? 'Pure' : p.prop === realm.TOXIC ? 'Tox' : p.prop.slice(0, 4)} ${p.value === null ? '?' : p.value}</span>`).join('');
}
// The tray: the materials the picked make can take, under the vials. Click adds one; a loaded card shows how many are in and a −.
function trayHtml(m) {
  const b = realm.bags(), id = m.id, slots = ui.slots[id];
  const t = ui.target[id] ? ui.target[id].split('|') : null, tProp = t ? t[1] : null;
  const herbBody = m.id === 'potion' || m.id === 'tincture' || m.id === 'essence';
  const kinds = (herbBody ? ['herb', 'tincture', 'essence', 'fish'] : ['tincture', 'essence', 'fish', 'herb']).filter(k => m.accepts[k]);
  const bodyKinds = herbBody ? ['herb', 'tincture'] : ['tincture', 'essence'];
  const card = it => {
    const inSlot = slots.filter(k => k === it.key).length, left = it.count - inSlot, room = realm.room(id, it.key, slots, m.fill);
    const chips = it.kind === 'herb' ? valueChips(it, tProp) : it.kind === 'tincture' || it.kind === 'essence' ? `${tProp && it.prop === tProp ? `<span class="mk tgt" style="--pc:${realm.PROP_COLOUR[it.prop]}">${it.prop}</span>` : ''}${it.tox ? `<span class="mk tox" style="--pc:${TOX_COLOUR}">Tox ${it.tox}</span>` : '<span class="mk pur">clean</span>'}` : '';
    return `<div class="tc${inSlot ? ' used' : ''}" data-tip="${esc(it.key)}">
      <button class="card" data-act="add" data-v="${esc(it.key)}" ${room ? '' : 'disabled'}>${ico(it.key)}<span class="ct"><span class="cn q-${it.quality}">${esc(it.name)}${stepTxt(it.step)}</span><span class="cm">× ${left}</span>${chips ? `<span class="chips">${chips}</span>` : ''}</span></button>
      ${inSlot ? `<span class="inb"><b>${inSlot} in</b><button class="aimb" data-act="less" data-v="${esc(id + '|' + it.key)}" title="Remove one">−</button></span>` : room > 1 ? `<button class="btn inl ghost fillb" data-act="fill" data-v="${esc(it.key)}" title="Add ${room}">+${room}</button>` : ''}
    </div>`;
  };
  const group = kind => {
    const items = b.filter(i => i.kind === kind);
    if (!items.length) return '';
    const wash = kind === 'herb' && !bodyKinds.includes('herb');
    return `<div class="tg"><div class="pg-l">${KIND_LABEL[kind]}${wash ? ' <span class="dimnote">as a wash: only Toxic and Purifying count</span>' : kind === 'fish' ? ' <span class="dimnote">two, any kind</span>' : ''}</div><div class="cards">${items.map(card).join('')}</div></div>`;
  };
  const any = kinds.some(k => b.some(i => i.kind === k));
  return `<div class="tray">${kinds.map(group).join('')}${any ? '' : `<p class="nobuff" style="margin:0">Nothing in your bags that a ${esc(m.name)} takes. Debug can give herbs and fish.</p>`}</div>`;
}
function consumablesPanel() {
  const b = realm.bags();
  const kinds = k => b.filter(i => i.kind === k);
  const act = (a, v, label) => `<button class="btn small inl" data-act="${a}" data-v="${esc(v)}">${label}</button>`;
  const card = it => `<div class="card static" data-tip="${esc(it.key)}">${ico(it.key)}<span class="ct"><span class="cn q-${it.quality}">${esc(it.name)}${stepTxt(it.step)}</span><span class="cm">× ${it.count}</span></span></div>`;
  const group = (label, items, fn) => items.length ? `<div class="pg"><div class="pg-l">${label}</div><div class="cards">${items.map(fn).join('')}</div></div>` : '';
  const any = ['potion', 'hybrid', 'oil', 'flask', 'sludge'].some(k => kinds(k).length);
  return `<section class="frame"><h2 class="fh">Bags · consumables <small>potions, oils, flasks</small></h2><div class="fb pantry">
    ${group('Potions', kinds('potion'), it => `<div class="cardrow">${card(it)}${act('drink', it.key, 'Drink')}</div>`)}
    ${group('Hybrid potions', kinds('hybrid'), it => `<div class="cardrow">${card(it)}${act('drink', it.key, 'Drink')}</div>`)}
    ${group('Weapon oils', kinds('oil'), it => `<div class="cardrow">${card(it)}${act('oil-main', it.key, 'Main hand')}${act('oil-off', it.key, 'Off hand')}</div>`)}
    ${group('Flasks', kinds('flask'), it => `<div class="cardrow">${card(it)}${act('flask', it.key, 'Use')}</div>`)}
    ${group('Junk', kinds('sludge'), it => `<div class="cardrow">${card(it)}<button class="btn small inl" data-act="sell">Sell</button></div>`)}

}
function characterPanel() {
  const c = realm.character(), fl = ui.flash ? ' flash' : '';
  const left = m => m ? `${m} min left` : '';
  return `<section class="frame"><h2 class="fh">Character <small>level ${c.level}</small></h2><div class="fb">
    ${c.flask ? `<div class="buffline"><span data-tip="${esc(c.flask.key)}">${pname(c.flask.key)}</span><span class="timer">${left(c.flask.left)} · survives death</span></div>`

    <div class="hp"><span class="gold-t">Health</span><span>${c.hp} / ${c.maxHp}</span></div>

    <div class="stats">${c.stats.map(s => `<div class="stat${s.bonus ? ' up' + fl : ''}"><span class="lbl">${esc(s.name)}</span><span class="v">${s.total}${s.unit ? `<span class="muted"> ${s.unit}</span>` : ''}</span><span class="b">${s.bonus ? '+' + s.bonus : ''}</span></div>`).join('')}</div>
    <div class="effects">

      <div class="eff"><span>Shield</span>${c.shield ? `<span class="on">${c.shield.left} absorbs <span class="timer">${left(c.shield.minutes)}</span></span>` : '<span class="off">none</span>'}</div>

    <div class="clog">${realm.combatLog().slice(0, 4).map(l => `<div>${esc(l.text)}</div>`).join('') || '<div class="muted">No swings yet.</div>'}</div>
