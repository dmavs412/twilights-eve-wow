# The backstop: the same `cargo check`, realm tests and spell-pipeline tests a session runs by
# hand, on every push to main and every pull request. Nothing here needs the game data or a
# display; the generated-output check skips the DBC-resolved fields for that reason.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      WOW_DATA: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check
        run: cargo check --workspace
      - name: realm tests
        run: cargo test -p twilight-realm --features wire
      - name: spell pipeline tests
        run: python3 -m unittest discover tools/twilights-eve/tests
      - name: generated spell outputs match the CSV
        run: python3 tools/twilights-eve/build_spells.py --no-dbc-check --check
